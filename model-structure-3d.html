<script type="module">
import * as THREE from './vendor/three.module.js';
import { OrbitControls } from './vendor/jsm/controls/OrbitControls.js';

/* ============================================================
   MiMo-V2.5 (310B omni-modal MoE) — ONE big, fully-expanded model
   structure. Everything is placed at once; you orbit / zoom / click.
   Faithful to real SGLang source, verified 2026-08-03:
     python/sglang/srt/models/mimo_v2.py         (LM backbone)
     python/sglang/srt/models/mimo_v2_nextn.py   (MTP / nextn head)
     python/sglang/srt/models/mimo_vl.py         (ViT encoder)
     python/sglang/srt/models/mimo_audio.py      (audio encoder)
   and the checkpoint config.json (XiaomiMiMo/MiMo-V2.5).
   ------------------------------------------------------------
   Ground-truth config used below:
     hidden=4096, layers=48, vocab=152576, tie_word_embeddings=false
     hybrid_layer_pattern (0=global attn, 1=SWA): globals at
       0,5,11,17,23,29,35,41,47  (9 global + 39 SWA)
       global: 64 Q / 4 KV, head_dim 192, v_head_dim 128, no sink
       SWA:    64 Q / 8 KV, head_dim 192, v_head_dim 128,
               sliding_window 128, attention-sink bias, swa_rope_theta 1e4
       partial_rotary_factor 0.334 -> RoPE on 64 of 192 dims
       attention_value_scale 0.707 (v *= 0.707)
     moe_layer_freq: layer 0 = Dense (intermediate 16384),
       layers 1..47 = MoE (256 experts, top-8, moe_intermediate 2048,
       n_group 1, sigmoid + noaux_tc bias, norm_topk_prob, NO shared expert)
     MTP (nextn): 1 physical block, EAGLE recursive multi-step
     ViT: 28 blocks (full-attn at 0,9,18,27; else window=64), hidden 1280,
       GQA 32 Q / 8 KV head_dim 64, merger 2x2 -> 4096
     Audio: mel->tokenizer(conv+8L+RVQ)->codes; 20 ch-embeds summed,
       group_size 4; input_local_transformer (Qwen2, 6L, 1024, 16h MHA,
       rope 640000, full-attn); projection -> 4096
   ============================================================ */

const $ = id => document.getElementById(id);
const hex6 = n => "#" + n.toString(16).padStart(6, "0");
const T = (zh, en) => ({ zh, en });

// ---------- model registry ----------
// Add future models here. `ready:true` renders its 3D structure (only MiMo-V2.5 for now);
// `ready:false` shows a "coming soon" overlay instead of a scene, until its real config
// (from the checkpoint config.json on ModelScope) is wired into a builder.
const MODELS = [
  { id:"mimo-v2.5", ready:true,
    name:T("MiMo-V2.5","MiMo-V2.5"),
    title:T("MiMo-V2.5 · 模型结构 3D","MiMo-V2.5 · Model Structure 3D") },
  { id:"kimi3", ready:false,
    name:T("Kimi3","Kimi3"),
    title:T("Kimi3 · 模型结构 3D","Kimi3 · Model Structure 3D"),
    soon:T("Kimi3 结构建设中，敬请期待","Kimi3 structure — coming soon") },
];
const getModel = id => MODELS.find(m=>m.id===id) || MODELS[0];
let curModel = "mimo-v2.5";

// ---------- config arrays (verbatim from config.json) ----------
const PATTERN = [0,1,1,1,1,0,1,1,1,1,1,0,1,1,1,1,1,0,1,1,1,1,1,0,1,1,1,1,1,0,1,1,1,1,1,0,1,1,1,1,1,0,1,1,1,1,1,0];
const N_LAYERS = 48;
const isMoE = i => i !== 0;               // moe_layer_freq: only layer 0 is dense
const isGlobal = i => PATTERN[i] === 0;   // 0 = global attention, 1 = SWA
const GLOBALS = PATTERN.map((v,i)=>v===0?i:-1).filter(i=>i>=0); // [0,5,11,17,23,29,35,41,47]
const VIT_LAYERS = 28, VIT_FULL = [0,9,18,27];

// ---------- colours ----------
const C = {
  global: 0x4ea1ff, swa: 0xf0a44a, dense: 0x9aa7b8, moe: 0x57d977,
  vit: 0x39c5cf, vitFull: 0x7ee0e6, audio: 0xc678dd, mtp: 0xe5484d,
  io: 0xe0b341, norm: 0x6b7a8f, cyan: 0x39c5cf, dim: 0x2a3446,
  qh: 0x7fb2ff, kh: 0xf0a44a, vh: 0x57d977, ctx: 0xb3a9ee, wo: 0x7fd4dd,
  inter: 0x57d977, comm: 0x39c5cf, rs: 0xe0b341, res: 0x6b7a8f, rope: 0xf0a44a,
};
// per-GPU rank colours (attention head TP split + expert EP owner) + KV-replica grey
const GPU_COLS = [0x4ea1ff,0xf0a44a,0x57d977,0xc678dd,0xe5484d,0x39c5cf,0xe0b341,0xff8fab];
const REPLICATE_COL = 0x8b98a9;
const rankColor = r => GPU_COLS[r % GPU_COLS.length];

// ---------- deployment config (single-node 8-GPU: --tp 8 --dp 2 --ep 8 --enable-dp-attention) ----
// tp here = attention-TP within each DP group; world = tp*dp (=8). ep = expert-parallel degree.
let cfg = { tp:4, dp:2, ep:8, dpAttn:true };
const NE_TOTAL = 256, TOPK = 8;   // 256 routed experts, top-8 per token (config.json)
const SEQ = 3;                    // illustrative token-block height
const worldSize = () => cfg.tp * cfg.dp;

// ---------- three.js scene ----------
const canvas = $("gl");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias:true }); }
catch(e){
  document.body.insertAdjacentHTML("beforeend",
    "<div style='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;"+
    "padding:24px;text-align:center;color:#f0a44a;font-size:14px;line-height:1.7'>"+
    "WebGL 初始化失败 / WebGL init failed<br>"+String(e)+"</div>");
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141b26);
const FOV = 50;
const camera = new THREE.PerspectiveCamera(FOV, innerWidth/innerHeight, 0.1, 5000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.addEventListener("change", ()=>{ if(typeof markLodDirty==="function") markLodDirty(); });

scene.add(new THREE.AmbientLight(0xffffff, 0.95));
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a2233, 0.7));
const keyL = new THREE.DirectionalLight(0xffffff, 1.35); keyL.position.set(20,34,26); scene.add(keyL);
const fillL = new THREE.DirectionalLight(0xffffff, 0.55); fillL.position.set(-20,16,30); scene.add(fillL);

const root = new THREE.Group(); scene.add(root);
const conns = new THREE.Group(); root.add(conns);   // connector arrows layer

// ---------- corner orientation gizmo (top-right) ----------
// Own tiny scene + ortho camera, drawn in a scissored viewport with the SAME renderer
// (no 2nd WebGL context → CSP-safe). Orientation mirrors the main camera each frame.
const GIZMO_PX = 96;
const gizmoScene = new THREE.Scene();
const gizmoCam = new THREE.OrthographicCamera(-1.6,1.6,1.6,-1.6,0.1,10);
gizmoCam.position.set(0,0,4);
const gizmoRoot = new THREE.Group(); gizmoScene.add(gizmoRoot);
function gizmoAxis(dir, color, letter){
  const g = new THREE.Group();
  const v = dir.clone().normalize();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,1.0,10), new THREE.MeshBasicMaterial({color}));
  shaft.position.copy(v).multiplyScalar(0.5);
  shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), v);
  g.add(shaft);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.14,0.28,12), new THREE.MeshBasicMaterial({color}));
  tip.position.copy(v).multiplyScalar(1.08);
  tip.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), v);
  g.add(tip);
  if(letter){ const s=gizmoLetter(letter,color); s.position.copy(v).multiplyScalar(1.5); g.add(s); }
  return g;
}
function gizmoLetter(ch, color){
  const cv=document.createElement("canvas"); cv.width=cv.height=64;
  const x=cv.getContext("2d"); x.fillStyle="#"+color.toString(16).padStart(6,"0");
  x.font="bold 46px -apple-system,Segoe UI,sans-serif"; x.textAlign="center"; x.textBaseline="middle";
  x.fillText(ch,32,34);
  const tx=new THREE.CanvasTexture(cv); tx.anisotropy=4;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthTest:false}));
  sp.scale.set(0.6,0.6,0.6); return sp;
}
gizmoRoot.add(gizmoAxis(new THREE.Vector3(1,0,0), 0xe5484d, "X"));   // X red   (data-flow axis)
gizmoRoot.add(gizmoAxis(new THREE.Vector3(0,1,0), 0xf5c518, "Y"));   // Y yellow (rows / seq up)
gizmoRoot.add(gizmoAxis(new THREE.Vector3(0,0,1), 0x4ea1ff, "Z"));   // Z blue  (head / lane fan)
gizmoRoot.add(gizmoAxis(new THREE.Vector3(-1,0,0), 0x7a2f34, null));
gizmoRoot.add(gizmoAxis(new THREE.Vector3(0,-1,0), 0x7a6410, null));
gizmoRoot.add(gizmoAxis(new THREE.Vector3(0,0,-1), 0x2f5f9e, null));
gizmoRoot.add(new THREE.Mesh(new THREE.SphereGeometry(0.12,16,16), new THREE.MeshBasicMaterial({color:0xc4d0de})));
function renderGizmo(){
  gizmoRoot.quaternion.copy(camera.quaternion).invert();
  const s = GIZMO_PX, pad = 12, topClear = 52;   // topClear drops it below the EN/中文 button
  const x = innerWidth - s - pad;
  const y = innerHeight - s - pad - topClear;     // GL origin = bottom-left → top-right corner
  renderer.setViewport(x,y,s,s); renderer.setScissor(x,y,s,s);
  renderer.setScissorTest(true);
  renderer.autoClear = false;
  renderer.clearDepth();
  renderer.render(gizmoScene, gizmoCam);
  renderer.autoClear = true;
  renderer.setScissorTest(false);
  renderer.setViewport(0,0,innerWidth,innerHeight);
}

let LANG = (navigator.language||"").toLowerCase().startsWith("zh") ? "zh" : "en";

// ---------- geometry helpers ----------
const boxGeo = new THREE.BoxGeometry(1,1,1);
function mat(color, opacity){
  // near-solid blocks (>=0.95) render OPAQUE so they depth-write and don't z-fight/flicker;
  // only genuinely translucent blocks (dim experts 0.5, weight sheets 0.9) stay transparent.
  const opaque = (opacity==null || opacity>=0.95);
  return new THREE.MeshStandardMaterial({ color, transparent:!opaque, opacity:opaque?1:opacity,
    roughness:0.55, metalness:0.08, emissive:color, emissiveIntensity:0.14 });
}
function box(w,h,d, color, opacity){
  const m = mat(color, opacity);
  const mesh = new THREE.Mesh(boxGeo, m);
  mesh.scale.set(w,h,d);
  mesh._mat = m; mesh._baseEmissive = 0.14;
  return mesh;
}
function label(text, color=0xe6edf3, H=0.42){
  H *= 2.6;                 // global label upscale (fixed-orientation planes) — 2× the previous 1.3
  const px = 40, pad = 10;  // higher canvas res so upscaled text stays crisp
  const meas = document.createElement("canvas").getContext("2d");
  const font = "600 "+px+"px -apple-system,Segoe UI,PingFang SC,sans-serif";
  meas.font = font;
  const w = Math.ceil(meas.measureText(text).width) + pad*2, h = px + pad*2;
  const s = 2, cv = document.createElement("canvas"); cv.width = w*s; cv.height = h*s;
  const c = cv.getContext("2d"); c.scale(s,s); c.font = font;
  c.fillStyle = hex6(color); c.textAlign = "center"; c.textBaseline = "middle";
  c.fillText(text, w/2, h/2);
  const tex = new THREE.CanvasTexture(cv); tex.anisotropy = 4;
  // Fixed-orientation label plane (no longer a camera-facing sprite): front face points -x.
  // Default PlaneGeometry normal = +z, text width along +x. Rotating -90° about Y makes the
  // normal point -x, text width run along +z, up stays +y → reads left→right, upright, from -x.
  const pg = new THREE.PlaneGeometry((w/h)*H, H);
  const sp = new THREE.Mesh(pg, new THREE.MeshBasicMaterial({
    map:tex, transparent:true, depthTest:false, depthWrite:false, side:THREE.DoubleSide, toneMapped:false }));
  sp.rotation.y = -Math.PI/2;
  sp.renderOrder = 999;        // draw on top, like the old depthTest:false sprites
  sp._isLabel = true;
  return sp;
}
function arrow(from, to, color=0x5a6b80, op=0.75){
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length(); if(len < 1e-4) return new THREE.Group();
  dir.normalize();
  const a = new THREE.ArrowHelper(dir, from, len, color, Math.min(0.5, len*0.28), 0.24);
  a.line.material.transparent = true; a.line.material.opacity = op;
  return a;
}
function pos(obj, x, y, z){ obj.position.set(x,y,z); return obj; }
function V(x,y,z){ return new THREE.Vector3(x,y,z); }

// ---------- expanded-geometry helpers (match transformer-3d.html shape/orientation) ----------
// makeHead: a token/activation SHEET = cube grid, rows stacked up Y, cols along Z (axis='z',
// the "wide matrix" look) or along X (axis='x', compact). Thin along the X flow axis.
// (mirrors transformer-3d makeHead: cell 1.0 row pitch, 0.62 col pitch, scale ~0.6×0.92×0.55.)
function makeHead(color, rows, w, cols, gi, axis){
  const g = new THREE.Group();
  const nc = cols||1;
  const cw = nc>1 ? 0.55 : (w||0.9);   // narrower cells when it's a real grid
  const gap = nc>1 ? 0.62 : 1.0;
  const alongZ = axis!=="x";           // default z (wide matrices)
  for(let r=0;r<rows;r++) for(let c=0;c<nc;c++){
    const cell = box(alongZ?0.6:cw, 0.92, alongZ?cw:0.6, color, 0.96);
    const off = (c-(nc-1)/2)*gap;
    cell.position.set(alongZ?0:off, (r-(rows-1)/2)*1.0, alongZ?off:0);
    if(gi!=null) cell.userData.gi = gi;
    g.add(cell);
  }
  g._mat = g.children[0] && g.children[0]._mat;
  return g;
}
// makeMatrix('stand'): a standing weight matrix = cube grid in the YZ plane — rows up Y, cols
// along Z, thin along the X flow axis (mirrors transformer-3d makeMatrix stand: 0.44³ cubes,
// 0.62 pitch). blockCols inserts head-block gaps; divs draws GPU-partition lines pushed to +X.
// When `divs={axis:'col'|'row', n}` the matrix is TP-sharded: each shard is COLOURED by its GPU rank
// (rankColor, same palette as the head fans) and separated by a real GAP, so the TP split is obvious —
// not just a thin divider line. axis 'col' = column-parallel (split along Z), 'row' = row-parallel (split along Y).
const MAT_SP = 0.62, TGAP_COL = 1.0, TGAP_ROW = 0.6;  // cube pitch; TP-shard gaps (row gap smaller: Y is the tight, label-bearing axis)
// half-height of a standing matrix in Y, accounting for a row-parallel TP split (splitN shards).
// used by callers to place labels JUST outside the matrix silhouette (labels draw depthTest-off / on top).
function matHalfY(rows, splitN){ return ((rows-1)*MAT_SP + ((splitN||1)-1)*TGAP_ROW)/2; }
function makeMatrix(rows, cols, color, gi, blockCols, divs){
  const g = new THREE.Group();
  const sp = MAT_SP, bc = blockCols||0, bgap = 0.5;
  const n = (divs && divs.n>1) ? divs.n : 1;
  const tgap = (divs && divs.axis==="row") ? TGAP_ROW : TGAP_COL;   // row-split uses the smaller gap
  const splitCol = n>1 && divs.axis==="col", splitRow = n>1 && divs.axis==="row";
  const colBand = j => splitCol ? Math.min(n-1, Math.floor(j*n/cols)) : 0;
  const rowBand = i => splitRow ? Math.min(n-1, Math.floor(i*n/rows)) : 0;
  const colZ = j => j*sp + (bc? Math.floor(j/bc)*bgap : 0) + colBand(j)*tgap;
  const rowY = i => i*sp + rowBand(i)*tgap;
  const midZ = colZ(cols-1)/2, midY = rowY(rows-1)/2;
  for(let i=0;i<rows;i++) for(let j=0;j<cols;j++){
    const band = splitCol ? colBand(j) : (splitRow ? rowBand(i) : -1);
    const c = box(0.44,0.44,0.44, band>=0 ? rankColor(band) : color, 0.96);
    c.position.set(0, rowY(i)-midY, colZ(j)-midZ);
    if(gi!=null) c.userData.gi = gi;
    g.add(c);
  }
  g._mat = g.children[0] && g.children[0]._mat;
  // faint divider lines in the gaps (pushed to +X so they float in front of the cube sheet)
  if(n>1){
    const xf = 0.35, yHalf = midY + 0.4, zHalf = midZ + 0.4;
    for(let k=1;k<n;k++){
      if(splitCol){ const z = (colZ(Math.round(k*cols/n)-1)+colZ(Math.round(k*cols/n)))/2 - midZ;
        g.add(line(V(xf,-yHalf,z), V(xf,yHalf,z), 0xeaf0f8, 0.85)); }
      else { const y = (rowY(Math.round(k*rows/n)-1)+rowY(Math.round(k*rows/n)))/2 - midY;
        g.add(line(V(xf,y,-zHalf), V(xf,y,zHalf), 0xeaf0f8, 0.85)); }
    }
  }
  return g;
}
function cube(color, gi){ const c = box(1,1,1,color,0.96); if(gi!=null) c.userData.gi=gi; return c; }
function line(a, b, color=0x8b98a9, op=0.6){
  const geo = new THREE.BufferGeometry().setFromPoints([a,b]);
  const m = new THREE.LineBasicMaterial({ color, transparent:true, opacity:op });
  return new THREE.Line(geo, m);
}
function arc(a, b, color, op, dip=-2){
  const mid = V((a.x+b.x)/2, (a.y+b.y)/2 + dip, (a.z+b.z)/2);
  const cv = new THREE.QuadraticBezierCurve3(a, mid, b);
  const geo = new THREE.BufferGeometry().setFromPoints(cv.getPoints(20));
  return new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent:true, opacity:op==null?0.6:op }));
}
function makeRope(){
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.07, 8, 20),
    new THREE.MeshStandardMaterial({ color:C.rope, emissive:C.rope, emissiveIntensity:0.4 }));
  g.add(ring); return g;
}

const GROUPS = [];   // { info:{title,name,desc}, meshes:[], region, cx, cy }
const REGION = {};   // regionTag -> {min:{x,y}, max:{x,y}}
const pickables = [];

function extend(region, x, y){
  const r = REGION[region] || (REGION[region] = { minx:1e9, miny:1e9, maxx:-1e9, maxy:-1e9 });
  r.minx=Math.min(r.minx,x); r.miny=Math.min(r.miny,y); r.maxx=Math.max(r.maxx,x); r.maxy=Math.max(r.maxy,y);
}

// Layout: expanded ViT + Audio encoder pipelines stacked at the left (each a full 3D
// transformer block), the LM I/O (input embedding + output head) fully expanded in the middle
// beside the 48-layer tower, and the deploy section on the right where the LM layers themselves
// are fully expanded. The expanded MTP head branches off the top. All sections use the same 3D
// shape vocabulary (standing weight matrices + activation sheets); no abstract node chains.
const ENC_X = 0;
// world anchor of the MTP lm_head — used to place the "shares the main lm_head weight" text note.
// (The two lm_head instances share ONE weight tensor at runtime via SGLang set_embed_and_head.)
let mtpLmHeadAnchor = null;
let mainLmHeadAnchor = null, mainBonusAnchor = null;  // main model's lm_head and bonus token anchors

function buildScene(){
  // ---- LEFT: ViT + Audio encoder pipelines, aligned 1:1 with layer-0's two DP lanes ----
  // Both encoders flow +X (same direction as the backbone lanes) at Y = layer-0 height, and each sits on
  // the EXACT Z of a DP lane: ViT on lane 1 (+Z), audio on lane 0 (−Z). So each encoder's input→output
  // axis lines up with that DP lane's input→output axis, and its feed arrow runs straight into the lane.
  const encY = runY(0);                    // both encoders sit at the backbone's first-layer height
  const dp0 = cfg.dp;                      // layer-0 uses the current DP degree (2 in the default cfg)
  const zVit = laneZof(Math.min(dp0-1,1), dp0);   // ViT → DP lane 1 (+Z) (or the single lane if dp=1)
  const zAud = laneZof(0, dp0);                    // audio → DP lane 0 (−Z)
  const vitP = buildVitPipeline(ENC_X, encY, zVit);
  const audP = buildAudioPipeline(ENC_X, encY, zAud);
  // EQUALISE the output→backbone gap: both encoders start at ENC_X but have different lengths, so shift
  // each group in X to make their OUTPUT end at the same X (ENC_OUT_X), a fixed gap left of the backbone
  // input. Arrows/labels live inside each group, so a group.position.x shift moves everything together.
  const ENC_GAP = 10;                      // uniform gap from each encoder's output matrix to layer-0 input
  const ENC_OUT_X = FLOOR_X - ENC_GAP;     // world X where BOTH encoder outputs should land
  vitP.group.position.x += ENC_OUT_X - vitP.endX;  vitP.endX = ENC_OUT_X;
  audP.group.position.x += ENC_OUT_X - audP.endX;  audP.endX = ENC_OUT_X;
  // refresh region extents to the shifted positions (builders' extend() used the pre-shift x0)
  delete REGION.vit; delete REGION.audio;
  extend("vit", ENC_OUT_X - vitP.len - 4, encY-6); extend("vit", ENC_OUT_X + 2, encY+6);
  extend("audio", ENC_OUT_X - audP.len - 4, encY-6); extend("audio", ENC_OUT_X + 2, encY+6);

  // ---- deploy column = the LM backbone. After folding to ~5 segments the mesh budget is small
  //      enough (~5×2.4k ≈ 12k) to expand EVERY segment up front and keep them all visible (no LOD
  //      hide/collapse). buildDeployColumn still makes the collapsed strips (kept as a fallback),
  //      then we expand all segments so nothing is hidden. ----
  buildDeployColumn();
  for(let r=0;r<NR;r++) buildRunDetail(r);

  // multimodal encoders feed the FIRST decoder layer (layer 0) directly. Both ViT & audio project to
  // 4096 and are scattered at placeholder tokens into layer-0's input (the standalone middle embed /
  // output-head column was removed — only the expanded 48 layers remain).
  // feed arrows run straight along +X into each DP lane's input (same Z as the encoder → axis-aligned).
  conns.add(arrow(V(vitP.endX, vitP.y, vitP.z), V(FLOOR_X-2.4, runY(0), vitP.z), C.vit, 0.5));
  conns.add(arrow(V(audP.endX, audP.y, audP.z), V(FLOOR_X-2.4, runY(0), audP.z), C.audio, 0.5));
  root.add(pos(label("ViT / audio → 合流进 layer 0 / merged into layer 0", C.io, 0.42),
    FLOOR_X-16, runY(0)-2.6, 0));

  // ---- output head above the TOP of the column: layer 47 → model.norm → lm_head → logits ----
  // extra vertical gap between layer 47 (COL_TOP) and the lm_head floor so the head reads as a distinct
  // stage, not crowding the last layer.
  const final = buildFinalPipeline(FLOOR_X, COL_TOP + 20);
  conns.add(arrow(V(FLOOR_X, COL_TOP + 6, 0), V(FLOOR_X, final.y - 3, 0), C.io, 0.6));
  root.add(pos(label("layer 47 → 输出头 / output head", C.io, 0.4), FLOOR_X-4, (COL_TOP+6 + final.y-3)/2, 0));

  // ---- MTP (nextn) draft head above the output head ----
  const mtpY = COL_TOP + 36;
  buildMtpPipeline(FLOOR_X, mtpY);
  conns.add(arrow(V(FLOOR_X-3, mtpY-6, 0), V(FLOOR_X-3, mtpY-1.5, 0), C.mtp, 0.5));

  // shared-weight note: the MTP draft head reuses the SAME lm_head weight as the main output head
  // (SGLang set_embed_and_head swaps MTP's lm_head.weight to the target's). A text note by the MTP
  // lm_head says so — no connector line (user preferred text-only, 2026-08-06).
  if(mtpLmHeadAnchor){
    root.add(pos(label("↑ 与主输出头 lm_head 权重共享 / shares the main lm_head weight", C.io, 0.4),
      mtpLmHeadAnchor.x, mtpLmHeadAnchor.y - 3.5, mtpLmHeadAnchor.z));
  }
  // bonus token → MTP seed: the main model's bonus(gold) token IS the MTP recursion's initial seed
  if(mainBonusAnchor){
    const mtpSeedAnchor = V(FLOOR_X-1.5, mtpY-SEQ*0.5-0.8, 0);
    conns.add(line(mainBonusAnchor, mtpSeedAnchor, C.io, 0.5));
    root.add(pos(label("bonus(金) 作为 MTP 递归种子 / bonus token seeds MTP recursion", C.io, 0.35),
      (mainBonusAnchor.x+mtpSeedAnchor.x)/2, (mainBonusAnchor.y+mtpSeedAnchor.y)/2+2, 0));
  }

  computeSceneBounds();
}

// ============================================================
//  48-LAYER DEPLOY COLUMN with lazy per-layer detail (LOD)
//  All 48 layers stacked as cheap placeholder strips (always visible, colour-coded by type).
//  Only layers near the camera get their full 8-GPU expansion built (buildExpandedFloor); the
//  rest stay as strips. Detail is disposed when the camera moves away → live mesh count stays
//  bounded (~ current 3-floor cost) instead of ~110k for all 48 expanded at once.
// ============================================================
// DP-lane pitch along Z, shared so the multimodal encoders can align to the exact lane centres.
// laneZof(d,dp) = world Z of DP-lane d (centred group of dp lanes). For dp=2 → lanes at ∓LANE_DZ/2.
const LANE_DZ = 20;
const laneZof = (d, dp) => (d-(dp-1)/2)*LANE_DZ;
const COL_Y0 = 4, COL_PITCH = 22;             // floor spacing. Each expanded floor now reaches ~±6.6 in Y
                                              // (taller row-split matrices + 2× labels pushed to ±(halfY+1)),
                                              // so 22 leaves a clear ~9-unit gap between adjacent floors.
const STRIP_H = 9;                            // collapsed-layer marker height (< pitch → gaps)
// ---- collapse the 48 layers into RUNS of consecutive same-type layers (Dense / global+MoE / SWA+MoE).
// The backbone is highly repetitive (39 SWA+MoE, 8 global+MoE, 1 Dense), so instead of 48 tall slots we
// draw one strip + one lazily-expanded floor per RUN, labelled with its layer range and ⟳×N multiplicity.
// This shrinks the column from 48 → ~17 while still covering every layer. LOD keys on runs, not layers.
// step 1: flat runs of consecutive same-type layers (Dense / global+MoE / SWA+MoE).
function flatRuns(){
  const runs=[]; const key = i => (isGlobal(i)?"g":"s")+(isMoE(i)?"m":"d");
  let s=0;
  for(let i=1;i<=N_LAYERS;i++){
    if(i===N_LAYERS || key(i)!==key(s)){
      runs.push({ s, e:i-1, n:i-s, attn:isGlobal(s)?"global":"swa", mlp:isMoE(s)?"moe":"dense" });
      s=i;
    }
  }
  return runs;
}
// step 2: detect the longest periodic block among the runs (the repeating [global+MoE, SWA+MoE×5]
// motif). Returns {a,p,k} = block starts at run a, period p runs, repeats k times (k≥2), or null.
function findCycle(runs){
  const sig = r => runs[r].attn[0]+runs[r].mlp[0]+"n"+runs[r].n;
  const N = runs.length; let best=null;
  for(let p=1;p<=Math.floor(N/2);p++){
    for(let a=0;a+2*p<=N;a++){
      let k=1;
      while(a+(k+1)*p<=N){
        let ok=true; for(let j=0;j<p;j++) if(sig(a+k*p+j)!==sig(a+j)){ ok=false; break; }
        if(!ok) break; k++;
      }
      if(k>=2){ const cov=k*p;
        if(!best || cov>best.cov || (cov===best.cov && p<best.p)) best={a,p,k,cov}; }
    }
  }
  return best;
}
// step 3: SEGMENTS = the floors actually drawn (each is one expandable floor). The repeating motif is
// folded to ONE period wrapped in a ⟳×k cycle bracket, so the column shrinks to ~5 floors instead of
// 17 runs / 48 layers. CYCLES describes the bracket(s). Every layer is still covered (prefix + cycle×k
// + suffix). NOTE: the final layer L47 is global (full attention) and falls in the suffix → drawn as
// its own standalone floor (user asked the last full layer be shown separately).
function computeSegments(){
  const runs = flatRuns();
  const cyc = findCycle(runs);
  const segs = []; const cycles = [];
  if(!cyc){ runs.forEach(R=> segs.push({ ...R, cyc:-1 })); return { segs, cycles }; }
  // prefix runs (standalone)
  for(let r=0;r<cyc.a;r++) segs.push({ ...runs[r], cyc:-1 });
  // one period of the cycle (its runs become cycle-member segments)
  const cid = 0, segFrom = segs.length;
  for(let j=0;j<cyc.p;j++) segs.push({ ...runs[cyc.a+j], cyc:cid });
  cycles.push({ id:cid, times:cyc.k, segFrom, segTo:segs.length-1,
                sLayer:runs[cyc.a].s, eLayer:runs[cyc.a+cyc.p*cyc.k-1].e });
  // suffix runs after the whole periodic block (standalone) — includes the final global L47
  for(let r=cyc.a+cyc.p*cyc.k;r<runs.length;r++) segs.push({ ...runs[r], cyc:-1 });
  return { segs, cycles };
}
const _SEG = computeSegments();
const RUNS = _SEG.segs;          // kept the name "RUNS" = the list of drawn floors
const CYCLES = _SEG.cycles;
const NR = RUNS.length;
const runY = r => COL_Y0 + r*COL_PITCH;        // world Y of segment r's strip / detail
const COL_TOP = runY(NR-1);
const cycleOf = r => RUNS[r].cyc>=0 ? CYCLES[RUNS[r].cyc] : null;
// per-segment LOD record: null = only the strip is shown; else { group, giRange:[s,e) }
const runDetail = new Array(NR).fill(null);
const runStrip  = new Array(NR).fill(null);    // {meshes:[a,m]} placeholder handle per segment

function specForRun(r){
  const R = RUNS[r];
  return R.s===0 ? LAYER_SPEC.globalDense : (R.attn==="global" ? LAYER_SPEC.globalMoE : LAYER_SPEC.swaMoE);
}
// segment-aware clickable info: representative layer's text, prefixed with range / per-pass count /
// cycle multiplicity so it's clear how many real layers this one floor stands for.
function runInfo(R){
  const base = lmInfo({ i:R.s, attnType:R.attn, mlpType:R.mlp });
  const cy = R.cyc>=0 ? CYCLES[R.cyc] : null;
  if(R.n===1 && !cy) return { title: base.name, alt: base.title, desc: base.desc };
  const rng = R.n===1 ? ("L"+R.s) : ("L"+R.s+"–"+R.e);
  const perPass = R.n>1 ? ("每轮 ⟳×"+R.n+" 层") : "每轮 1 层";
  const perPassEn = R.n>1 ? ("⟳×"+R.n+"/cycle") : "1/cycle";
  const cycTxt = cy ? ("，整段循环 ⟳×"+cy.times+"（L"+cy.sLayer+"–"+cy.eLayer+"，共 "+(R.n*cy.times)+" 层）") : "";
  const cycTxtEn = cy ? (", cycle ⟳×"+cy.times+" (L"+cy.sLayer+"–"+cy.eLayer+", "+(R.n*cy.times)+" layers total)") : "";
  return {
    title: { zh: base.name.zh+"（"+rng+" 代表"+(cy?"，"+perPass+cycTxt:( R.n>1?"，"+perPass:"")) +"）",
             en: base.name.en+" ("+rng+" repr"+(cy?", "+perPassEn+cycTxtEn:(R.n>1?", ×"+R.n:""))+")" },
    alt: base.title,
    desc: { zh: (cy? "这是重复单元的一部分：基本单元 [全局层 + SWA×5] 连续循环 "+cy.times+" 次，覆盖 L"+cy.sLayer+"–"+cy.eLayer+"。本楼是其中一类层的代表（"+rng+"，"+perPass+"）。权重各层独立，只是结构完全一致，故折叠。\n\n"
                  : "本段是连续 "+R.n+" 个同类型层（"+rng+"）的代表，权重各层独立但结构一致，故折叠并标 ⟳×"+R.n+"。\n\n")+base.desc.zh,
            en: (cy? "Part of the repeat unit: the base unit [global layer + SWA×5] cycles "+cy.times+"× covering L"+cy.sLayer+"–"+cy.eLayer+". This floor represents one layer type in it ("+rng+", "+perPassEn+"). Weights differ per layer; only the structure is identical, hence folded.\n\n"
                  : "Represents "+R.n+" consecutive same-type layers ("+rng+"); weights differ per layer but structure is identical, so folded and marked ⟳×"+R.n+".\n\n")+base.desc.en },
  };
}

function buildDeployColumn(){
  const nLayersTotal = N_LAYERS;
  // explicit arithmetic breakdown so it's obvious the fold still covers all 48 layers.
  // e.g. "L0(1) + L1–4(4) + [L5–10 单元 6层]×7=42 + L47(1) = 48 层". built from RUNS/CYCLES.
  const seg = []; let checkSum = 0;
  let ci = -1;
  for(let r=0;r<NR;r++){
    const R = RUNS[r];
    if(R.cyc<0){ seg.push("L"+R.s+(R.n>1?("–"+R.e):"")+"("+R.n+")"); checkSum += R.n; }
    else if(R.cyc!==ci){                        // first segment of a cycle → emit "(unit)×k=NN"
      ci = R.cyc; const cy = CYCLES[R.cyc];
      let per=0; for(let k=cy.segFrom;k<=cy.segTo;k++) per+=RUNS[k].n;
      const tot = per*cy.times;
      seg.push("[L"+cy.sLayer+"–"+cy.eLayer+" 单元 "+per+"层]×"+cy.times+"="+tot);
      checkSum += tot;
    }
  }
  const breakdown = seg.join(" + ")+" = "+checkSum+" 层";

  // section header at the TOP of the column
  root.add(pos(label("单机 8 卡部署 · "+nLayersTotal+" 层全部覆盖，重复单元只画一遍 / single-node 8-GPU · all "+nLayersTotal+" layers, repeat unit drawn once", C.global, 0.6),
    FLOOR_X+10, COL_TOP + 5.9, 0));
  root.add(pos(label(breakdown+"  （"+NR+" 楼 / "+NR+" floors）", C.cyan, 0.5),
    FLOOR_X+10, COL_TOP + 5.0, 0));
  root.add(pos(label("tp"+cfg.tp+" · dp"+cfg.dp+" · ep"+cfg.ep+(cfg.dpAttn?" · dp-attn":"")
    +"  ·  "+worldSize()+" GPUs = "+cfg.dp+" DP groups × "+cfg.tp+" attn-TP · EP="+cfg.ep, 0x9fb0c3, 0.42),
    FLOOR_X+10, COL_TOP + 4.2, 0));
  root.add(pos(label("重复的 [全局full + SWA×5] 单元只画一遍并标 ⟳×"+(CYCLES[0]?CYCLES[0].times:"N")+" · 靠近自动展开 / repeating unit drawn once · zoom to expand", 0x8b98a9, 0.4),
    FLOOR_X+10, COL_TOP + 3.5, 0));

  // one placeholder strip per SEGMENT: left = attn-type block, right = MLP-type block, colour-coded.
  // multi-layer segments get a taller strip + a ⟳×N (per-pass) tag so folded repetition reads at a glance.
  for(let r=0;r<NR;r++){
    const R = RUNS[r], y = runY(r);
    const aC = R.attn==="global" ? C.global : C.swa;
    const mC = R.mlp==="moe" ? C.moe : C.dense;
    const gi = GROUPS.length;
    const h = R.n>1 ? STRIP_H*1.15 : STRIP_H*0.8;   // multi-layer segments slightly taller
    const a = box(1.4, h, 1.4, aC, 0.96); a.position.set(FLOOR_X-0.9, y, 0); a.userData.gi=gi;
    const m = box(1.4, h, 1.4, mC, 0.96); m.position.set(FLOOR_X+0.9, y, 0); m.userData.gi=gi;
    root.add(a, m);
    GROUPS.push({ info: runInfo(R), meshes:[a,m], region:"deploy", cx:FLOOR_X, cy:y, runStrip:r });
    runStrip[r] = { meshes:[a,m], gi };
    // range label; multi-layer segments also show per-pass ⟳×N. global segments get a brighter tag.
    const rng = R.n===1 ? ("L"+R.s) : ("L"+R.s+"–"+R.e);
    const typ = R.s===0 ? " · Dense" : (R.attn==="global" ? " · 全局full" : " · SWA");
    root.add(pos(label(rng+typ, R.attn==="global"?C.global:0x9fb0c3, 0.4), FLOOR_X+2.4, y+(R.n>1?0.5:0), 0));
    if(R.n>1) root.add(pos(label("⟳ ×"+R.n+" 层 / layers", C.cyan, 0.36), FLOOR_X+2.4, y-0.6, 0));

    // STANDALONE multi-layer run (e.g. L1–4 SWA×4): give it its OWN small ⟳×N bracket on the -X side,
    // same idiom as the big ×7 cycle bracket, so "this one floor = N looped layers" reads as clearly.
    // (cycle-member segments are covered by the shared big bracket below, so skip those here.)
    if(R.n>1 && R.cyc<0){
      const yT = y + STRIP_H*0.7, yB = y - STRIP_H*0.7, bx = FLOOR_X - 3.4;
      root.add(line(V(bx, yB, 0), V(bx, yT, 0), C.cyan, 0.85));
      root.add(line(V(bx, yT, 0), V(bx+1.2, yT, 0), C.cyan, 0.85));
      root.add(line(V(bx, yB, 0), V(bx+1.2, yB, 0), C.cyan, 0.85));
      root.add(arc(V(bx, yT, 0), V(bx, yB, 0), C.cyan, 0.8, -(yT-yB)*0.5 - 1.2));
      root.add(pos(label("⟳ ×"+R.n, C.cyan, 0.44), bx-1.8, y+0.4, 0));
      root.add(pos(label("L"+R.s+"–"+R.e, 0x9fb0c3, 0.3), bx-1.8, y-0.4, 0));
    }
  }

  // ---- cycle bracket(s): enclose the folded repeat unit's segments with a ⟳×k loop on the -X side ----
  for(const cy of CYCLES){
    const yTop = runY(cy.segTo) + STRIP_H*0.7, yBot = runY(cy.segFrom) - STRIP_H*0.7;
    const bx = FLOOR_X - 3.4;   // bracket sits just left of the strips
    const bracketCol = C.cyan;
    // vertical bar + top/bottom ticks (a "[" opening toward +X)
    root.add(line(V(bx, yBot, 0), V(bx, yTop, 0), bracketCol, 0.85));
    root.add(line(V(bx, yTop, 0), V(bx+1.2, yTop, 0), bracketCol, 0.85));
    root.add(line(V(bx, yBot, 0), V(bx+1.2, yBot, 0), bracketCol, 0.85));
    // recursion return arc (top back down to bottom) on the far -X side → the "loop" visual
    root.add(arc(V(bx, yTop, 0), V(bx, yBot, 0), bracketCol, 0.8, -(yTop-yBot)*0.18 - 1.5));
    root.add(pos(label("⟳ ×"+cy.times+" 循环 / cycle", bracketCol, 0.5), bx-2.5, (yTop+yBot)/2, 0));
    root.add(pos(label("基本单元 [全局full + SWA×5] / base unit", bracketCol, 0.34), bx-2.5, (yTop+yBot)/2 - 0.9, 0));
    root.add(pos(label("覆盖 L"+cy.sLayer+"–"+cy.eLayer, 0x9fb0c3, 0.32), bx-2.5, (yTop+yBot)/2 - 1.6, 0));
  }

  // column bounds (strips only — detailed layers extend +X but frameRegion uses this box)
  extend("deploy", FLOOR_X-10, COL_Y0-4); extend("deploy", FLOOR_X+82, COL_TOP + 6);
  rebuildPickables();
}

// rebuild the flat pickables[] array from all live (non-null) GROUPS. Cheap at 48-layer scale and
// avoids gi-index shifting when a mid-column detailed layer is disposed (we null the slot instead).
function rebuildPickables(){
  pickables.length = 0;
  for(const g of GROUPS){ if(!g) continue; for(const m of g.meshes){ if(m) pickables.push(m); } }
}

// build the full 8-GPU detail for run r (idempotent), hide its placeholder strip.
function buildRunDetail(r){
  if(runDetail[r]) return;
  const R = RUNS[r];
  const h = buildExpandedFloor(specForRun(r), runY(r), R);   // adds to root + GROUPS
  runDetail[r] = { group:h.group, giRange:h.giRange };
  if(runStrip[r]) runStrip[r].meshes.forEach(m=>{ m.visible=false; });
  rebuildPickables();
}

// dispose run r's detail: free GPU resources, null its GROUPS slots (keep gi stable), show strip.
function disposeRunDetail(r){
  const d = runDetail[r]; if(!d) return;
  if(selGi>=0 && selGi>=d.giRange[0] && selGi<d.giRange[1]){ selGi=-1; renderHUD(null); }
  d.group.traverse(o=>{
    if(o.geometry && o.geometry!==boxGeo) o.geometry.dispose();   // dispose line/label geoms, keep shared boxGeo
    if(o.material){
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(mm=>{ if(mm.map) mm.map.dispose(); mm.dispose(); });
    }
  });
  root.remove(d.group);
  for(let gi=d.giRange[0]; gi<d.giRange[1]; gi++) GROUPS[gi] = null;   // keep indices stable
  runDetail[r] = null;
  if(runStrip[r]) runStrip[r].meshes.forEach(m=>{ m.visible=true; });
  rebuildPickables();
}

// ---- LOD controller: after folding to ~5 segments we keep EVERY segment expanded & visible at all
// times (no hide/collapse). updateLOD just guarantees all segment details exist; it never disposes.
// (The old distance-banded build/dispose logic was only needed at the 48-layer scale.)
let lodDirty = true, lodTick = 0;
function markLodDirty(){ lodDirty = true; }
function updateLOD(){
  if(tween) return;                 // wait until a camera fly settles before touching geometry
  for(let r=0;r<NR;r++){ if(!runDetail[r]) buildRunDetail(r); }
}

// ---- expanded ViT encoder pipeline (patch_embed → window block → full block → merger) ----
// z0 offsets the whole pipeline along Z so ViT & audio can share the SAME Y (layer-0 height) as two
// parallel streams without their bodies overlapping in X.
function buildVitPipeline(x0, y, z0=0){
  const g = new THREE.Group(); g.position.set(x0, y, z0); root.add(g);
  const giP=GROUPS.length;
  const patch = addPeriph(g, 0, "mat", 10, 8, C.vit, giP, "patch_embed", "Conv3d→linear→1280");
  regGroup(giP, patch.meshes, mkInfo("vitPatch"), "vit", x0, y);
  // window block
  let bx = 6;
  const giW=GROUPS.length;
  const wb = buildXfBlock(g, bx, { Hq:32, Hkv:8, hidden:1280, headDim:64, interDim:4608, mlp:"swiglu",
    inter:"SiluAndMul", sink:true, ropeTag:"2D RoPE", gqaColorByGroup:true }, giW, giW);
  g.add(pos(label("窗口块 window·64 +sink / ×24", C.vit, 0.34), bx+8, SEQ*0.5+2.4, 0));
  regGroup(giW, wb.attnMeshes.concat(wb.mlpMeshes), mkInfo("vitWindow",1), "vit", x0+bx+8, y);
  // full block
  bx += wb.span + 3;
  const giF=GROUPS.length;
  const fb = buildXfBlock(g, bx, { Hq:32, Hkv:8, hidden:1280, headDim:64, interDim:4608, mlp:"swiglu",
    inter:"SiluAndMul", sink:false, ropeTag:"2D RoPE", gqaColorByGroup:true }, giF, giF);
  g.add(pos(label("全局块 full·no-sink / ×4 (0,9,18,27)", C.vitFull, 0.34), bx+8, SEQ*0.5+2.4, 0));
  regGroup(giF, fb.attnMeshes.concat(fb.mlpMeshes), mkInfo("vitFull",0), "vit", x0+bx+8, y);
  // merger
  bx += fb.span + 3;
  const giM=GROUPS.length;
  const mg = addPeriph(g, bx, "mat", 12, 10, C.vit, giM, "merger 2×2→4096", "ln_q→5120→GELU→4096");
  regGroup(giM, mg.meshes, mkInfo("vitMerger"), "vit", x0+bx, y);
  // inter-stage arrows added to the group g (LOCAL coords) so they inherit the pipeline's z-lane and
  // move if the group is later shifted in X to equalise the output gap.
  g.add(arrow(V(2,0,0), V(5.4,0,0), C.vit, 0.5));
  g.add(arrow(V(bx-2.6,0,0), V(bx-1,0,0), C.vit, 0.5));
  g.add(pos(label("▸ Vision ViT (×28 blocks) → 4096", C.vit, 0.55), -2, SEQ*0.5+4.2, 0));
  const endX = x0+bx+2;
  extend("vit", x0-4, y-6); extend("vit", endX+2, y+6);
  return { endX, y, z:z0, group:g, len:bx+2 };
}

// ---- expanded Audio encoder pipeline (frontend → ch-embed → local xf block → projection) ----
function buildAudioPipeline(x0, y, z0=0){
  const g = new THREE.Group(); g.position.set(x0, y, z0); root.add(g);
  // frontend convs (mel → 768, ×2 downsample)
  const giFe=GROUPS.length;
  const c1 = addPeriph(g, 0, "cube", 5, 1, C.audio, giFe, "conv1+GELU", "mel→768");
  const c2 = addPeriph(g, 2, "cube", 5, 1, C.audio, giFe, "conv2 s2", "↓2×");
  regGroup(giFe, c1.meshes.concat(c2.meshes), mkInfo("audioFrontend"), "audio", x0, y);
  // tokenizer's 8-layer encoder — now FULLY EXPANDED as a representative 3D block (was a flat sheet),
  // matching ViT / the local transformer. MiMoAudioTokenizer: 8 layers, hidden 768, 12-head MHA, d64.
  let bx = 5;
  const giEnc=GROUPS.length;
  const eb = buildXfBlock(g, bx, { Hq:12, Hkv:12, hidden:768, headDim:64, interDim:3072, mlp:"dense",
    inter:"FFN", sink:false, ropeTag:"RoPE", gqaColorByGroup:false }, giEnc, giEnc);
  g.add(pos(label("tokenizer 编码器 ×8 (768 / 12-head) / tokenizer encoder", C.audio, 0.34), bx+8, SEQ*0.5+2.4, 0));
  regGroup(giEnc, eb.attnMeshes.concat(eb.mlpMeshes), mkInfo("audioFrontend"), "audio", x0+bx+8, y);
  // RVQ quantizer → discrete codes
  bx += eb.span + 2;
  const giRvq=GROUPS.length;
  const rvq = addPeriph(g, bx, "cube", 5, 1, C.audio, giRvq, "RVQ", "→ codes[T,20]");
  regGroup(giRvq, rvq.meshes, mkInfo("audioFrontend"), "audio", x0+bx, y);
  // 20-channel embedding sum + grouping
  bx += 3;
  const giEm=GROUPS.length;
  const em = addPeriph(g, bx, "mat", 10, 8, C.io, giEm, "20 ch-embed Σ", "→[T/4,4,1024]");
  regGroup(giEm, em.meshes, mkInfo("audioEmbed"), "audio", x0+bx, y);
  // local transformer block (Qwen2 ×6, MHA 16 heads) — already expanded
  bx += 3;
  const lbx = bx;
  const giL=GROUPS.length;
  const lb = buildXfBlock(g, lbx, { Hq:16, Hkv:16, hidden:1024, headDim:64, interDim:4096, mlp:"swiglu",
    inter:"SwiGLU", sink:false, ropeTag:"RoPE θ640k", gqaColorByGroup:false }, giL, giL);
  g.add(pos(label("input_local_transformer (Qwen2 ×6, full-attn)", C.audio, 0.34), lbx+8, SEQ*0.5+2.4, 0));
  regGroup(giL, lb.attnMeshes.concat(lb.mlpMeshes), mkInfo("audioLocal"), "audio", x0+lbx+8, y);
  const px = lbx + lb.span + 3;
  const giPj=GROUPS.length;
  const pj = addPeriph(g, px, "mat", 12, 10, C.audio, giPj, "projection→4096", "4096→16384→4096");
  regGroup(giPj, pj.meshes, mkInfo("audioProj"), "audio", x0+px, y);
  // header added to the group g (LOCAL coords) so it follows the pipeline's z-lane / X shift.
  g.add(pos(label("▸ Audio Encoder → 4096", C.audio, 0.55), -2, SEQ*0.5+4.2, 0));
  const endX = x0+px+2;
  extend("audio", x0-4, y-6); extend("audio", endX+2, y+6);
  return { endX, y, z:z0, group:g, len:px+2 };
}

// ---- expanded MTP (nextn) head: embed/enorm/hnorm→eh_proj→SWA block→final_norm→lm_head, recursion ----
function buildMtpPipeline(x0, y){
  const g = new THREE.Group(); g.position.set(x0, y, 0); root.add(g);
  const giH=GROUPS.length;
  // seed token (gold) — the main model's bonus token, fed into embed_tokens on the first recursion step
  const seedTok = cube(C.io, giH); seedTok.scale.set(0.8,0.8,0.8); pos(seedTok, -1.5, -SEQ*0.5-0.8, 0); g.add(seedTok);
  g.add(pos(label("seed (金 bonus)", C.io, 0.3), -1.5, -SEQ*0.5+0.5, 0));
  addPeriph(g, 0, "sheet", SEQ, 4, C.io, giH, "draft embed", "embed_tokens(input_ids)");
  g.add(arrow(V(-0.9, -SEQ*0.5-0.8, 0), V(-0.3, 0, 0), C.io, 0.5));  // seed → embed input
  addPeriph(g, 2, "cube", 4, 1, C.norm, giH, "enorm", "");
  addPeriph(g, 3.5, "cube", 4, 1, C.norm, giH, "hnorm", "target hidden");
  const eh = addPeriph(g, 5.5, "mat", 10, 10, C.mtp, giH, "eh_proj", "cat 8192→4096");
  // one SWA + Dense block
  const bx = 8;
  const blk = buildXfBlock(g, bx, { Hq:64, Hkv:8, hidden:4096, headDim:192, vHeadDim:128, interDim:16384,
    mlp:"dense", inter:"SiluAndMul", sink:true, ropeTag:"RoPE 64/192", gqaColorByGroup:false }, giH, giH);
  g.add(pos(label("mtp_block (SWA attn + Dense MLP)", C.mtp, 0.34), bx+8, SEQ*0.5+2.4, 0));
  const fx = bx + blk.span + 2.5;
  addPeriph(g, fx, "cube", 4, 1, C.norm, giH, "final_norm", "");
  const lm = addPeriph(g, fx+2.5, "mat", 12, 8, C.io, giH, "lm_head (与主模型共享权重 / shared)", "→ draft logits");
  // sample → draft token id: the recursion input is a TOKEN, not logits. SGLang mimo_v2_nextn.py:205
  // embed_tokens(input_ids) — MTP consumes the previous step's sampled token id, then re-embeds it.
  const smp = addPeriph(g, fx+5, "cube", 4, 1, C.mtp, giH, "sample", "argmax / top-p");
  // draft token cube (blue/red) — each recursion step's output, loops back to embed_tokens
  const draftTok = cube(0x4ea1ff, giH); draftTok.scale.set(0.8,0.8,0.8); pos(draftTok, fx+7, -SEQ*0.5-0.8, 0); g.add(draftTok);
  g.add(pos(label("draft token id", 0x4ea1ff, 0.3), fx+7, -SEQ*0.5+0.5, 0));
  g.add(arrow(V(fx+2.9, 0, 0), V(fx+4.4, 0, 0), C.mtp, 0.5));        // lm_head → sample
  g.add(arrow(V(fx+5.6, 0, 0), V(fx+7, -SEQ*0.5-0.8, 0), 0x4ea1ff, 0.5)); // sample → draft token
  const allMtp = [].concat(eh.meshes, blk.attnMeshes, blk.mlpMeshes, lm.meshes, smp.meshes, [seedTok, draftTok]);
  regGroup(giH, allMtp, mkInfo("mtp"), "mtp", x0+bx+8, y);
  mtpLmHeadAnchor = V(x0+fx+2.5, y, 0);   // world anchor of the MTP lm_head, for the shared-weight link
  // recursion loop arrow (sampled draft TOKEN → back to draft embed_tokens, per EAGLE). NOTE: added to
  // world-space conns/root, so Y must include this pipeline's world y (else it lands at the scene bottom
  // under layer 0 and, since conns is never LOD-disposed, shows as a stray red line everywhere).
  conns.add(arc(V(x0+fx+7, y-SEQ*0.5-0.8, 0.8), V(x0-1.5, y-SEQ*0.5-0.8, 0.8), 0x4ea1ff, 0.7, -2.5)); // draft token → seed pos
  root.add(pos(label("↺ ×N steps (EAGLE, 采样 token 回喂 embed / sampled token → embed, 权重共享)", C.mtp, 0.34), x0+fx/2, y-SEQ*0.5-3.2, 0.8));
  root.add(pos(label("▸ MTP (nextn) draft head", C.mtp, 0.55), x0-2, SEQ*0.5+4.2, 0));
  const endX = x0+fx+8;
  extend("mtp", x0-4, y-7); extend("mtp", endX+2, y+6);
  return { endX, y };
}

// ---- expanded LM output head: hidden → model.norm → lm_head (big standing matrix) → logits ----
function buildFinalPipeline(x0, y){
  const g = new THREE.Group(); g.position.set(x0, y, 0); root.add(g);
  const gi = GROUPS.length;
  const hid = addPeriph(g, 0,   "sheet", SEQ, 6, C.io,   gi, "hidden", "[seq, 4096]");
  const nm  = addPeriph(g, 2.5, "cube",  6,  1, C.norm, gi, "model.norm", "RMSNorm");
  const lmh = addPeriph(g, 5,   "mat",   16, 12, C.io,  gi, "lm_head", "4096 → 152576");
  const lg  = addPeriph(g, 10,  "cube",  5,  1, C.io,   gi, "logits", "");
  // bonus(gold) token cube — the sampled token id from argmax/top-p, serves as MTP's recursion seed
  const bonusTok = cube(C.io, gi); bonusTok.scale.set(0.8,0.8,0.8); pos(bonusTok, 12, -SEQ*0.5-0.8, 0); g.add(bonusTok);
  g.add(pos(label("bonus(金 token id)", C.io, 0.3), 12, -SEQ*0.5+0.5, 0));
  mainLmHeadAnchor = V(x0+5, y, 0);      // world anchor of main lm_head (for MTP shared-weight link)
  mainBonusAnchor  = V(x0+12, y-SEQ*0.5-0.8, 0); // world anchor of the gold bonus token (MTP seed)
  regGroup(gi, [].concat(hid.meshes, nm.meshes, lmh.meshes, lg.meshes, [bonusTok]), mkInfo("final"), "head", x0+5, y);
  conns.add(arrow(V(x0+1.1, y, 0), V(x0+1.9, y, 0), C.io, 0.5));
  conns.add(arrow(V(x0+3.1, y, 0), V(x0+1.9+2.2, y, 0), C.io, 0.5));
  conns.add(arrow(V(x0+8.2, y, 0), V(x0+9.4, y, 0), C.io, 0.5));
  conns.add(arrow(V(x0+10.6, y, 0), V(x0+11.4, y, 0), C.io, 0.5)); // logits → sample arrow
  conns.add(arrow(V(x0+11.4, y-0.5, 0), V(x0+12, y-SEQ*0.5-0.8, 0), C.io, 0.5)); // sample → bonus token
  // header added to world-space root → Y must include this pipeline's world y (not just local offset)
  g.add(pos(label("▸ 输出头 / output head", C.io, 0.55), -2, SEQ*0.5+4.2, 0));
  const endX = x0+11.5;
  extend("head", x0-4, y-6); extend("head", endX+1, y+6);
  return { endX, y };
}

// build a clickable-group info object from a detailSpec focus (title/alt/desc reused verbatim)
function mkInfo(kind, i){
  const spec = detailSpec(i!=null?{kind,i}:{kind});
  return { title: spec.name, alt: spec.title, desc: spec.desc };
}

      "Layer 0 is the only Dense layer. gate_up_proj column-parallel 4096→[16384,16384], SiluAndMul, down_proj row-parallel 16384→4096; with TP>1 the down_proj partial sums are combined by one all-reduce."),

      +"deepep 路径无 combine 后 all-reduce(combine 已把 token 送回属主卡)。",

      +"② attn→MoE 边界: reduce-scatter(TP_ATTN_FULL→SCATTERED),同时把 o_proj 的部分和求和(融合了延后的 o_proj all-reduce)并散射成每卡不相交的 1/8 token。\n"
      +"③ gate/top-k 在各卡自己的 1/8 token 上跑 —— gate 前没有 all-gather。跨 DP 组的 token 交换只发生在专家 all-to-all(EP=8 跨全部 8 卡)。\n"
