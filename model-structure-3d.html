const FLOOR_X = 124, FLOOR_PITCH = 18;   // taller sheets (16 rows) + ±5.3 labels need more vertical room

// build ONE expanded decoder layer at height y. dp lanes along Z; TP colours heads; EP shards experts.
// ALL geometry (heads/weights, EP experts, all-to-all lines, labels, header) lives under a single
// group `F` positioned at (FLOOR_X, y) — so a lazy LOD controller can build/dispose one layer at once.
// Returns { group, giRange:[start,end) } for disposal. Coords inside are LOCAL to (FLOOR_X, y).
// `run` (optional): the RUN this floor represents; if run.n>1 a ⟳×N loop arc + label is drawn to
// show that this one expanded floor stands for N consecutive identical layers.
function buildExpandedFloor(spec, y, run){
  const dp = cfg.dp, tp = cfg.tp, ep = cfg.ep;
  const F = new THREE.Group(); F.position.set(FLOOR_X, y, 0); root.add(F);
  const giStart = GROUPS.length;
  const info = floorInfo(spec);
  const laneDZ = LANE_DZ, laneZ = d => laneZof(d, dp);   // DP-lane pitch (Z). col-split matrices grew ~+3 Z
                                                         // from TP-shard gaps, so widen lanes 14→20 for clear separation.
  // X anchors on a UNIFORM grid (pitch PX) so every stage is evenly spaced along the data-flow axis.
  // (was irregular 2–7 spacing; small within-stage offsets like V-heads +2.2 / dense act +4 stay.)
  const PX = 5;
  const XIN=0*PX, XWQ=1*PX, XWK=2*PX, XWV=3*PX, XHEAD=4*PX, XKV=5*PX, XSCORE=6*PX, XCTX=7*PX,
        XWO=8*PX, XOUT=9*PX, XRES1=10*PX, XRS=11*PX, XGATE=12*PX, XEXP=13*PX, XRES2=14*PX, XLOUT=15*PX;
  const attnMeshes=[], mlpMeshes=[], commMeshes=[];
  const giAttn=GROUPS.length, giMlp=giAttn+1, giComm=giAttn+2;
  // type colour used for the floor header (global=blue / SWA=orange), kept as a subtle at-a-glance cue.
  const attnTypeCol = spec.attn==="global" ? C.global : C.swa;

  const qpr = spec.Hq/tp, kvPart = spec.Hkv>=tp;
  const nQ = Math.min(spec.Hq, Math.max(2, tp*2));        // representative Q heads drawn
  const qRankOf = h => Math.floor(h / (nQ/tp));
  const kvRankOf = g => kvPart ? Math.floor(g / Math.max(1, spec.Hkv/tp)) : -1; // -1 = replicated
  const headGapZ = 1.0;   // > head Z-depth (0.6) so fanned heads never intersect (no z-fight/flicker)

  for(let d=0; d<dp; d++){
    const z0 = laneZ(d), Z = z => z0 + z;
    // input X
    const xg = makeHead(0xc4d0de, SEQ, 0.9, 8, giAttn); pos(xg, XIN, 0, z0); F.add(xg); attnMeshes.push(...xg.children);
    F.add(pos(label((dp>1?"["+d+"] ":"")+"X seq×4096", 0xc4d0de, 0.34), XIN, SEQ*0.5+0.5, z0));
    if(dp>1) F.add(pos(label("DP rank "+d+" · 不相交 token / disjoint", 0x9aa7b8, 0.32), XIN-2.5, SEQ*0.5+1.3, z0));
    // W_Q / W_K / W_V — standing weight matrices (YZ plane), column-parallel; KV width shrinks with Hkv
    const qS=spec.Hq*HEAD_DIM, kS=spec.Hkv*HEAD_DIM, vS=spec.Hkv*V_HEAD_DIM, oIn=spec.Hq*V_HEAD_DIM;
    const perG = n => tp>1 ? (n+"→"+Math.round(n/tp)) : (""+n);
    // head-block gap dropped when TP dividers are shown, else the 4-col blocks and the
    // tp-col divider lines misalign and chop the sheet into ragged segments (e.g. 6 for tp4).
    // split-dim = 16 (Q) / 8 (KV), multiples of 8 so tp∈{1,2,4,8} divides evenly → even TP bands, dividers land in gaps.
    // head-block gap dropped when TP dividers show, else 4-col blocks and tp-col lines misalign into ragged segments.
    const wQ = makeMatrix(12, 16, C.qh, giAttn, tp>1?0:4, tp>1?{axis:"col",n:tp}:null); pos(wQ, XWQ,0,z0); F.add(wQ); attnMeshes.push(...wQ.children.filter(c=>c._mat));
    const wK = makeMatrix(12, 8, kvPart?C.kh:REPLICATE_COL, giAttn, (tp>1&&kvPart)?0:4, (tp>1&&kvPart)?{axis:"col",n:tp}:null); pos(wK, XWK,0,z0); F.add(wK); attnMeshes.push(...wK.children.filter(c=>c._mat));
    const wV = makeMatrix(12, 8, kvPart?C.vh:REPLICATE_COL, giAttn, (tp>1&&kvPart)?0:4, (tp>1&&kvPart)?{axis:"col",n:tp}:null); pos(wV, XWV,0,z0); F.add(wV); attnMeshes.push(...wV.children.filter(c=>c._mat));
    { const qy = matHalfY(12, 1) + 1.0;   // col-split doesn't grow Y; clear silhouette + big text
      F.add(pos(label("qkv_proj col-parallel", C.qh, 0.28), XWK, qy, z0));
      F.add(pos(label("4096 → ["+perG(qS)+" | "+perG(kS)+" | "+perG(vS)+"]", 0x9fb0c3, 0.32), XWK, -qy, z0));
      F.add(pos(label("Q="+spec.Hq+"×192 · K="+spec.Hkv+"×192 · V="+spec.Hkv+"×128", 0x9fb0c3, 0.3), XWK, -qy-0.75, z0)); }
    // Q head fan (coloured by TP rank) — each head thin along Z (axis 'x') so fanned heads don't overlap
    for(let h=0; h<nQ; h++){
      const zc = Z((h-(nQ-1)/2)*headGapZ);
      const hd = makeHead(rankColor(qRankOf(h)), SEQ, 0.7, 3, giAttn, "x"); pos(hd, XHEAD, 0, zc); F.add(hd);
      attnMeshes.push(...hd.children);
    }
    F.add(pos(label("Q×"+spec.Hq+" ("+qpr+"/GPU)", C.qh, 0.3), XHEAD, SEQ*0.5+0.9, z0));
    { const rp=makeRope(); pos(rp, XHEAD, SEQ*0.5+1.7, z0); F.add(rp);
      F.add(pos(label("RoPE 64/192", C.rope, 0.26), XHEAD+1.3, SEQ*0.5+1.7, z0)); }
    // K / V heads — thin along Z (axis 'x') and fanned at headGapZ so neighbours never intersect
    for(let gk=0; gk<spec.Hkv; gk++){
      const zc = Z((gk-(spec.Hkv-1)/2)*headGapZ);
      const col = kvRankOf(gk)>=0 ? rankColor(kvRankOf(gk)) : REPLICATE_COL;
      const kh = makeHead(col, SEQ, 0.6, 3, giAttn, "x"); pos(kh, XKV, 0, zc); F.add(kh); attnMeshes.push(...kh.children);
      const vh = makeHead(col, SEQ, 0.6, 2, giAttn, "x"); pos(vh, XKV+2.2, 0, zc); F.add(vh); attnMeshes.push(...vh.children);
    }
    F.add(pos(label("K/V×"+spec.Hkv+(kvPart?" (split)":" (replicated)"), C.kh, 0.28), XKV, SEQ*0.5+0.9, z0));
    F.add(pos(label("v·0.707", C.vh, 0.24), XKV+2.2, -SEQ*0.5-0.6, z0));
    // scores / softmax + sink marker
    const sc = makeHead(0xe5484d, SEQ, 0.9, SEQ, giAttn); pos(sc, XSCORE,0,z0); F.add(sc); attnMeshes.push(...sc.children);
    F.add(pos(label(spec.sink?"QKᵀ softmax +sink":"QKᵀ softmax", 0xe5484d, 0.28), XSCORE, SEQ*0.5+0.6, z0));
    // SWA layers get a real sink-token block + a sliding-window band prepended to the score sheet — a
    // physical presence/absence cue so SWA vs global is obvious even from afar (global draws neither).
    if(spec.sink){
      const sink = box(0.9, 0.9, 0.9, C.swa, 0.98); pos(sink, XSCORE-1.6, SEQ*0.5-0.2, z0); sink.userData.gi=giAttn;
      F.add(sink); attnMeshes.push(sink);
      F.add(pos(label("sink", C.swa, 0.24), XSCORE-1.6, SEQ*0.5+0.6, z0));
      const win = box(0.35, SEQ*0.9, SEQ*0.55, C.swa, 0.4); pos(win, XSCORE-0.7, 0, z0); win.userData.gi=giAttn;
      F.add(win); attnMeshes.push(win);
      F.add(pos(label("window 128", C.swa, 0.22), XSCORE-0.7, -SEQ*0.5-0.6, z0));
    }
    // context, W_O (row-parallel, reduce deferred), attn out, res1
    const ctx = makeHead(C.ctx, SEQ, 0.9, 8, giAttn); pos(ctx, XCTX,0,z0); F.add(ctx); attnMeshes.push(...ctx.children);
    F.add(pos(label("attn_output", C.ctx, 0.28), XCTX, SEQ*0.5+0.6, z0));
    const wO = makeMatrix(16, 12, C.wo, giAttn, 0, tp>1?{axis:"row",n:tp}:null); pos(wO, XWO,0,z0); F.add(wO); attnMeshes.push(...wO.children.filter(c=>c._mat));
    { const oy = matHalfY(16, tp>1?tp:1) + 1.0;   // clear of the (row-split) matrix silhouette + big text
      F.add(pos(label(tp>1?"o_proj row-parallel · reduce deferred":"o_proj", C.wo, 0.26), XWO, oy, z0));
      F.add(pos(label((tp>1?perG(oIn):oIn)+" → 4096", 0x9fb0c3, 0.32), XWO, -oy, z0)); }
    const out = makeHead(0x9aa7b8, SEQ, 0.9, 8, giAttn); pos(out, XOUT,0,z0); F.add(out); attnMeshes.push(...out.children);
    const r1 = makeHead(C.res, SEQ, 0.9, 8, giAttn); pos(r1, XRES1,0,z0); F.add(r1); attnMeshes.push(...r1.children);
    F.add(pos(label("⊕ 残差① / res①", C.res, 0.26), XRES1, SEQ*0.5+0.6, z0));

    // reduce-scatter node (attn→MoE boundary) — MoE layers only; Dense keeps per-lane MLP
    if(spec.mlp==="moe"){
      const rs = box(1.1, SEQ*0.9, 1.1, C.rs, 0.95); pos(rs, XRS,0,z0); rs.userData.gi=giComm; F.add(rs); commMeshes.push(rs);
      F.add(pos(label(tp>1?"reduce-scatter (fused o_proj)":"scatter", C.rs, 0.28), XRS, SEQ*0.5+0.7, z0));
      const l = arc(V(XRES1+0.5,0,z0), V(XRS-0.5,0,z0), C.rs, 0.7, -0.6); F.add(l); commMeshes.push(l);
    }

    // ---- Dense MLP path (per lane) ----
    if(spec.mlp==="dense"){
      const wUp = makeMatrix(12, 16, 0x8fb8ff, giMlp, 0, tp>1?{axis:"col",n:tp}:null);
      pos(wUp, XGATE,0,z0); F.add(wUp); mlpMeshes.push(...wUp.children.filter(c=>c._mat));
      { const gy = matHalfY(12, 1) + 1.0;   // gate_up: 12-row col-split (Y not grown)
        F.add(pos(label(tp>1?"gate_up_proj col-parallel":"gate_up_proj", 0x8fb8ff, 0.26), XGATE, gy, z0));
        F.add(pos(label("4096 → 2×"+(tp>1?("16384→"+Math.round(16384/tp)):"16384"), 0x9fb0c3, 0.32), XGATE, -gy, z0)); }
      const act = makeHead(C.inter, SEQ, 0.9, 14, giMlp); pos(act, XGATE+4,0,z0); F.add(act); mlpMeshes.push(...act.children);
      F.add(pos(label("SiluAndMul", C.inter, 0.26), XGATE+4, SEQ*0.5+0.6, z0));
      F.add(pos(label("→ "+(tp>1?Math.round(16384/tp):16384), 0x9fb0c3, 0.3), XGATE+4, -SEQ*0.5-0.7, z0));
      const wDn = makeMatrix(16, 12, C.wo, giMlp, 0, tp>1?{axis:"row",n:tp}:null);
      pos(wDn, XEXP+2,0,z0); F.add(wDn); mlpMeshes.push(...wDn.children.filter(c=>c._mat));
      { const dy = matHalfY(16, tp>1?tp:1) + 1.0;   // down_proj: 16-row row-split (Y grown by gaps)
        F.add(pos(label(tp>1?"down_proj row-parallel +AllReduce":"down_proj", C.wo, 0.26), XEXP+2, dy, z0));
        F.add(pos(label((tp>1?("16384→"+Math.round(16384/tp)):"16384")+" → 4096", 0x9fb0c3, 0.32), XEXP+2, -dy, z0)); }
    }

    // residual② + layer output (both paths)
    const r2 = makeHead(C.res, SEQ, 0.9, 8, giMlp); pos(r2, XRES2,0,z0); F.add(r2); mlpMeshes.push(...r2.children);
    F.add(pos(label("⊕ 残差② / res②", C.res, 0.26), XRES2, SEQ*0.5+0.6, z0));
    const lout = makeHead(0xb9c4d2, SEQ, 0.9, 8, giMlp); pos(lout, XLOUT,0,z0); F.add(lout); mlpMeshes.push(...lout.children);
    F.add(pos(label((dp>1?"["+d+"] ":"")+"layer output", 0xb9c4d2, 0.28), XLOUT, SEQ*0.5+0.6, z0));
    // skip/residual arc res1→res2
    F.add(arc(V(XRES1,-SEQ*0.5-0.3,z0), V(XRES2,-SEQ*0.5-0.3,z0), C.res, 0.5, -1.6));
  }

  // ---- MoE: ONE EP-sharded expert block centred at z=0; lanes all-to-all into it ----
  if(spec.mlp==="moe"){
    // gate per lane
    for(let d=0; d<dp; d++){
      const z0=laneZ(d);
      const gate = makeMatrix(12, 8, C.audio, giMlp, 0, null); pos(gate, XGATE,0,z0); F.add(gate); mlpMeshes.push(...gate.children.filter(c=>c._mat));
      F.add(pos(label((dp>1?"["+d+"] ":"")+"gate→top-8", C.audio, 0.26), XGATE, 4.2, z0));
      F.add(pos(label("4096 → 256", 0x9fb0c3, 0.32), XGATE, -4.2, z0));
    }
    const nE = Math.min(NE_TOTAL, Math.max(ep, ep*4));    // representative experts drawn
    const eOwner = e => Math.floor(e / (nE/ep));
    // spacing must exceed the widest cube z-depth (0.8) so neighbours never intersect (no z-fight)
    const eZ = 1.15, eDepth = 0.8, expZ = e => (e-(nE-1)/2)*eZ;
    // experts group is LOCAL to F: sits at x=XEXP within the layer (F already at FLOOR_X,y).
    const experts = new THREE.Group(); experts.position.set(XEXP, 0, 0); F.add(experts);
    const expAnchor=[];
    for(let e=0;e<nE;e++){
      const col=rankColor(eOwner(e)), z=expZ(e);
      const up=cube(col, giMlp); up.scale.set(0.5,1.6,eDepth); up.position.set(-1.2,0,z);
      const mid=cube(C.inter, giMlp); mid.scale.set(0.5,0.9,eDepth); mid.position.set(0,0,z);
      const dn=cube(col, giMlp); dn.scale.set(0.5,0.9,eDepth); dn.position.set(1.2,0,z);
      experts.add(up,mid,dn); mlpMeshes.push(up,mid,dn);
      // anchors LOCAL to F (all-to-all lines are added to F too)
      expAnchor.push({ up:V(XEXP-1.2, 0, z), dn:V(XEXP+1.2, 0, z) });
    }
    // EP owner boundary lines
    if(ep>1) for(let r=1;r<ep;r++){ const bz=(expZ(r*(nE/ep)-1)+expZ(r*(nE/ep)))/2;
      experts.add(line(V(-1.8,0,bz), V(1.8,0,bz), 0xd0d8e4, 0.5)); }
    F.add(pos(label(NE_TOTAL+" experts · top-"+TOPK+" · EP "+Math.round(NE_TOTAL/ep)+"/GPU×"+ep+" · no shared expert",
      0x8fb8ff, 0.4), XEXP, SEQ*0.5+1.9, 0));
    F.add(pos(label("each expert SwiGLU: 4096 →2×2048 →4096", 0x9fb0c3, 0.34), XEXP, SEQ*0.5+1.3, 0));
    // all-to-all dispatch (res1 → experts) and combine (experts → res2), per lane.
    // lines live under F (local space) → endpoints use LOCAL y (ty), matching experts/expAnchor.
    const routeOf = i => { const a=[]; for(let k=0;k<Math.min(TOPK,nE);k++) a.push((i*3+k*5)%nE); return a; };
    for(let d=0; d<dp; d++){
      const z0=laneZ(d);
      for(let i=0;i<SEQ;i++) for(const e of routeOf(i)){
        const ty=(i-(SEQ-1)/2)*0.9;
        const ld=line(V(XRS,ty,z0), expAnchor[e].up, C.comm, 0.0); F.add(ld); commMeshes.push(ld);
        const lc=line(expAnchor[e].dn, V(XRES2,ty,z0), C.comm, 0.0); F.add(lc); commMeshes.push(lc);
      }
    }
    // reveal dispatch/combine lines faintly so they read as all-to-all
    commMeshes.forEach(m=>{ if(m.material && m.material.opacity===0) m.material.opacity=0.18; });
  }

  // register the 2-3 clickable groups for this floor
  const cx = FLOOR_X + XHEAD;
  GROUPS.push({ info:{ title:info.attn.title, alt:spec.name, desc:info.attn.desc }, meshes:attnMeshes.filter(Boolean), region:"deploy", cx, cy:y });
  GROUPS.push({ info:{ title:info.mlp.title, alt:spec.name, desc:info.mlp.desc }, meshes:mlpMeshes.filter(Boolean), region:"deploy", cx:FLOOR_X+XEXP, cy:y });
  GROUPS.push({ info:{ title:info.comm.title, alt:spec.name, desc:info.comm.desc }, meshes:commMeshes.filter(Boolean), region:"deploy", cx:FLOOR_X+XRS, cy:y });
  // comm meshes need their gi stamped (heads/weights already got it via makeHead/makeMatrix gi arg).
  commMeshes.filter(Boolean).forEach(m=>{ if(m.userData) m.userData.gi=giComm; });
  // pickables are rebuilt from live GROUPS by rebuildPickables() after build/dispose.

  // floor header (local to F) — coloured by attn type so the layer-kind reads from the header;
  // for a folded run (n>1) show the layer range + ⟳×N so this one floor reads as "repeats N times".
  const hdr = run && run.n>1
    ? "▸ "+spec.name[LANG]+"   ⟳ ×"+run.n+"  (L"+run.s+"–"+run.e+")"
    : "▸ "+spec.name[LANG];
  F.add(pos(label(hdr, attnTypeCol, 0.5), -2, SEQ*0.5+2.2, 0));
  // folded run: a recursion loop arc from the layer output back to the input, tagged ⟳×N — the
  // visual "this block repeats N times" cue (same idiom as the MTP recursion arc).
  if(run && run.n>1){
    // recursion arc represents the WHOLE floor repeating, not one DP lane. Place it BEHIND the furthest
    // lane (z = last-lane Z + margin) so it doesn't hang under just one lane. (Bug fix: old zf=(dp-1)*7+1.5
    // ≈8.5 landed right beside the +z lane at +10, making it look like only that DP had a long trailing line.)
    const yb = -SEQ*0.5-1.2, zf = laneZof(dp-1, dp) + 6;
    F.add(arc(V(XLOUT, yb, zf), V(XIN, yb, zf), C.cyan, 0.7, -2.6));
    F.add(pos(label("⟳ ×"+run.n+" 层结构相同 / identical layers", C.cyan, 0.4), (XIN+XLOUT)/2, yb-2.0, zf));
  }
  return { group:F, giRange:[giStart, GROUPS.length], y, giAttn };
}

// ============================================================
//  EXPANDED single-lane transformer block (for ViT / Audio / MTP)
//  — same shape vocabulary as the LM floors, but no TP/DP/EP sharding.
// ============================================================
// A "peripheral" stage: a labelled standing matrix or activation sheet (embed, conv, proj, merger).
// kind: "mat" (standing weight) | "sheet" (activation) | "cube" (opaque op block).
function addPeriph(g, x, kind, rows, cols, color, gi, title, sub){
  let node;
  if(kind==="mat") node = makeMatrix(rows, cols, color, gi, 0, null);
  else if(kind==="sheet") node = makeHead(color, rows, 0.9, cols, gi);
  else { node = cube(color, gi); node.scale.set(1.0, Math.min(4,rows*0.5), 1.0); }
  pos(node, x, 0, 0); g.add(node);
  const meshes = node.children ? node.children.filter(c=>c._mat) : [node];
  const topY = kind==="mat" ? (rows-1)/2*0.62+0.7 : rows*0.5+0.7;
  if(title) g.add(pos(label(title, color, 0.3), x, topY, 0));
  if(sub) g.add(pos(label(sub, 0x9fb0c3, 0.32), x, -topY, 0));
  return { meshes, x };
}
// one expanded attention+MLP block (single device). opt: {Hq,Hkv,headDim,mlp:"dense"|"swiglu",
// inter, sink, ropeTag, gqaColorByGroup}. Returns {span, attnMeshes, mlpMeshes}.
function buildXfBlock(g, x0, opt, giAttn, giMlp){
  const A=[], M=[];
  const nQ = Math.min(opt.Hq, 8), nKV = Math.min(opt.Hkv, 8);
  const perGrp = Math.max(1, Math.round(opt.Hq/opt.Hkv));
  const grpOf = h => Math.floor(h / Math.max(1, nQ/nKV));
  const headCol = h => opt.gqaColorByGroup ? GPU_COLS[grpOf(h)%GPU_COLS.length] : C.qh;
  const seq = SEQ, gapZ = 1.0;   // > head Z-depth (0.6) so fanned heads never intersect (no z-fight)
  // real dims for shape labels
  const h = opt.hidden, hd = opt.headDim, vhd = opt.vHeadDim||hd, inter = opt.interDim;
  const qkvOut = (opt.Hq*hd)+"|"+(opt.Hkv*hd)+"|"+(opt.Hkv*vhd), oIn = opt.Hq*vhd;
  const shp = (x,y,t)=> g.add(pos(label(t, 0x9fb0c3, 0.3), x, y, 0));
  // X anchors on a UNIFORM grid (pitch PXB) so stages are evenly spaced (was irregular 1.6–3.5).
  const PXB = 3.2, K = ["in","ln1","wqkv","q","kv","sc","ctx","wo","res1","ln2","mUp","mAct","mDn","res2","out"];
  const dX = {}; K.forEach((k,i)=> dX[k] = i*PXB);
  const X = k => x0 + dX[k];
  // input
  const xin = makeHead(0xc4d0de, seq, 0.9, 6, giAttn); pos(xin, X("in"),0,0); g.add(xin); A.push(...xin.children);
  g.add(pos(label("X", 0xc4d0de, 0.3), X("in"), seq*0.5+0.6, 0));
  // norm1
  const ln1 = cube(C.norm, giAttn); ln1.scale.set(0.6, seq*0.9, 1.2); pos(ln1, X("ln1"),0,0); g.add(ln1); A.push(ln1);
  g.add(pos(label("norm1", C.norm, 0.24), X("ln1"), seq*0.5+0.6, 0));
  // W_qkv (fused, standing)
  const wqkv = makeMatrix(12, 12, C.qh, giAttn, 4, null); pos(wqkv, X("wqkv"),0,0); g.add(wqkv); A.push(...wqkv.children.filter(c=>c._mat));
  const my12 = matHalfY(12,1) + 1.0;   // label clearance for a 12-row standing matrix (+ big text)
  g.add(pos(label("qkv_proj", C.qh, 0.26), X("wqkv"), my12, 0));
  shp(X("wqkv"), -my12, h+" → "+qkvOut);
  shp(X("wqkv"), -my12-0.9, "Q "+opt.Hq+"×"+hd+" · K "+opt.Hkv+"×"+hd+" · V "+opt.Hkv+"×"+vhd);
  // Q head fan (coloured by KV-group so GQA sharing reads) — thin along Z so fanned heads don't overlap
  for(let h=0; h<nQ; h++){
    const hh = makeHead(headCol(h), seq, 0.7, 3, giAttn, "x"); pos(hh, X("q"),0,(h-(nQ-1)/2)*gapZ); g.add(hh); A.push(...hh.children);
  }
  g.add(pos(label("Q×"+opt.Hq, C.qh, 0.28), X("q"), seq*0.5+0.9, 0));
  { const rp=makeRope(); pos(rp, X("q"), seq*0.5+1.7, 0); g.add(rp);
    g.add(pos(label(opt.ropeTag||"RoPE", C.rope, 0.24), X("q")+1.1, seq*0.5+1.7, 0)); }
  // K / V heads (grouped)
  for(let k=0;k<nKV;k++){
    const col = opt.gqaColorByGroup ? GPU_COLS[k%GPU_COLS.length] : C.kh;
    const kh = makeHead(col, seq, 0.6, 3, giAttn, "x"); pos(kh, X("kv"),0,(k-(nKV-1)/2)*gapZ); g.add(kh); A.push(...kh.children);
    const vh = makeHead(col===C.kh?C.vh:col, seq, 0.6, 2, giAttn, "x"); pos(vh, X("kv")+2.0,0,(k-(nKV-1)/2)*gapZ); g.add(vh); A.push(...vh.children);
  }
  g.add(pos(label("K/V×"+opt.Hkv+(opt.Hq>opt.Hkv?" (GQA "+perGrp+":1)":""), C.kh, 0.26), X("kv"), seq*0.5+0.9, 0));
  // scores/softmax (+sink)
  const sc = makeHead(0xe5484d, seq, 0.9, seq, giAttn); pos(sc, X("sc"),0,0); g.add(sc); A.push(...sc.children);
  g.add(pos(label(opt.sink?"QKᵀ softmax +sink":"QKᵀ softmax", 0xe5484d, 0.26), X("sc"), seq*0.5+0.6, 0));
  // attn_output, o_proj, res1
  const ctx = makeHead(C.ctx, seq, 0.9, 6, giAttn); pos(ctx, X("ctx"),0,0); g.add(ctx); A.push(...ctx.children);
  g.add(pos(label("attn_output", C.ctx, 0.24), X("ctx"), seq*0.5+0.6, 0));
  const wo = makeMatrix(12, 12, C.wo, giAttn, 0, null); pos(wo, X("wo"),0,0); g.add(wo); A.push(...wo.children.filter(c=>c._mat));
  g.add(pos(label("o_proj", C.wo, 0.24), X("wo"), my12, 0));
  shp(X("wo"), -my12, oIn+" → "+h);
  const r1 = makeHead(C.res, seq, 0.9, 6, giAttn); pos(r1, X("res1"),0,0); g.add(r1); A.push(...r1.children);
  g.add(pos(label("⊕ res①", C.res, 0.24), X("res1"), seq*0.5+0.6, 0));
  // norm2
  const ln2 = cube(C.norm, giMlp); ln2.scale.set(0.6, seq*0.9, 1.2); pos(ln2, X("ln2"),0,0); g.add(ln2); M.push(ln2);
  g.add(pos(label("norm2", C.norm, 0.24), X("ln2"), seq*0.5+0.6, 0));
  // MLP (dense gate_up→act→down, or swiglu)
  const wUp = makeMatrix(12, 18, 0x8fb8ff, giMlp, 0, null); pos(wUp, X("mUp"),0,0); g.add(wUp); M.push(...wUp.children.filter(c=>c._mat));
  g.add(pos(label(opt.mlp==="swiglu"?"gate_up (SwiGLU)":"gate_up", 0x8fb8ff, 0.24), X("mUp"), my12, 0));
  shp(X("mUp"), -my12, h+" → 2×"+inter);
  const act = makeHead(C.inter, seq, 0.9, 10, giMlp); pos(act, X("mAct"),0,0); g.add(act); M.push(...act.children);
  g.add(pos(label(opt.inter||"SiluAndMul", C.inter, 0.24), X("mAct"), seq*0.5+0.6, 0));
  const wDn = makeMatrix(18, 12, C.wo, giMlp, 0, null); pos(wDn, X("mDn"),0,0); g.add(wDn); M.push(...wDn.children.filter(c=>c._mat));
  { const my18 = matHalfY(18,1) + 1.0;   // 18-row matrix is taller → push labels further out
    g.add(pos(label("down_proj", C.wo, 0.24), X("mDn"), my18, 0));
    shp(X("mDn"), -my18, inter+" → "+h); }
  const r2 = makeHead(C.res, seq, 0.9, 6, giMlp); pos(r2, X("res2"),0,0); g.add(r2); M.push(...r2.children);
  g.add(pos(label("⊕ res②", C.res, 0.24), X("res2"), seq*0.5+0.6, 0));
  const out = makeHead(0xb9c4d2, seq, 0.9, 6, giMlp); pos(out, X("out"),0,0); g.add(out); M.push(...out.children);
  g.add(pos(label("block out", 0xb9c4d2, 0.24), X("out"), seq*0.5+0.6, 0));
  g.add(arc(V(X("res1"),-seq*0.5-0.3,0), V(X("res2"),-seq*0.5-0.3,0), C.res, 0.5, -1.4));
  return { span:X("out")-x0+1, attnMeshes:A.filter(Boolean), mlpMeshes:M.filter(Boolean) };
}

// register a group + push meshes to pickables (shared helper)
function regGroup(gi, meshes, info, region, cx, cy){
  meshes.forEach(m=>{ if(m.userData) m.userData.gi=gi; });
  GROUPS.push({ info, meshes, region, cx, cy });
  meshes.forEach(m=>pickables.push(m));
}

let sceneBB = null;
function computeSceneBounds(){
  sceneBB = new THREE.Box3().setFromObject(root);
}

// ============================================================
//  interaction — click to inspect (highlight + describe)
// ============================================================
let selGi = -1;
function setEmissive(meshes, v){ meshes.forEach(m=>{ if(m._mat) m._mat.emissiveIntensity = v; }); }
function selectGroup(gi){
  if(selGi>=0 && GROUPS[selGi]) setEmissive(GROUPS[selGi].meshes, null_or_base(selGi));
  selGi = gi;
  const grp = GROUPS[gi]; if(!grp) return;
  setEmissive(grp.meshes, 0.9);
  renderHUD(grp.info);
}
function null_or_base(gi){ return 0.14; }   // reset emissive to base
function clearSelection(){
  if(selGi>=0 && GROUPS[selGi]) setEmissive(GROUPS[selGi].meshes, 0.14);
  selGi = -1; renderHUD(null);
}

// picking
const ray = new THREE.Raycaster();
let downXY = null, moved = false;
canvas.addEventListener("pointerdown", e=>{ downXY=[e.clientX,e.clientY]; moved=false; });
canvas.addEventListener("pointermove", e=>{ if(downXY && (Math.abs(e.clientX-downXY[0])+Math.abs(e.clientY-downXY[1])>6)) moved=true; });
canvas.addEventListener("pointerup", e=>{
  if(moved || !downXY){ downXY=null; return; }
  downXY=null;
  const r = canvas.getBoundingClientRect();
  const ndc = new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, false);
  if(hits.length){
    const gi = hits[0].object.userData.gi;
    selectGroup(gi);
    // clicking a run's placeholder strip flies to that run (which triggers LOD to build its detail)
    const g = GROUPS[gi];
    if(g && g.runStrip!=null){ const yy=runY(g.runStrip); flyToBox(FLOOR_X-6, yy-COL_PITCH, FLOOR_X+60, yy+COL_PITCH, 2); }
  } else clearSelection();
});

// ---------- camera framing ----------
let tween = null;
function flyToBox(minx,miny,maxx,maxy, pad=2){
  const cx=(minx+maxx)/2, cy=(miny+maxy)/2;
  const radius = Math.max(maxx-minx, maxy-miny)/2 + pad;
  const aspect = innerWidth/innerHeight, vFov = FOV*Math.PI/180;
  const hFov = 2*Math.atan(Math.tan(vFov/2)*aspect);
  const fit = Math.min(vFov, hFov);
  const dist = (radius/Math.sin(fit/2)) * 1.02;
  let dir = new THREE.Vector3().subVectors(camera.position, controls.target);
  if(dir.length()<1e-3) dir.set(0.15,0.12,1);
  dir.normalize();
  const center = V(cx,cy,0);
  tween = { t:0, dur:0.7, fromPos:camera.position.clone(), toPos:center.clone().addScaledVector(dir,dist),
            fromTgt:controls.target.clone(), toTgt:center, dist, radius };
}
function frameWhole(){
  const s = sceneBB || (sceneBB = new THREE.Box3().setFromObject(root));
  flyToBox(s.min.x, s.min.y, s.max.x, s.max.y, 3);
}
function frameRegion(tag){
  if(tag==="whole"){ frameWhole(); return; }
  const r = REGION[tag]; if(!r){ frameWhole(); return; }
  flyToBox(r.minx, r.miny, r.maxx, r.maxy, 2);
}
const smooth = t => t*t*(3-2*t);

canvas.addEventListener("dblclick", ()=>{ clearSelection(); frameWhole(); });

// ============================================================
//  HUD / i18n
// ============================================================
const UI = {
  zh:{ home:"首页", reset:"回到全景", jump:"跳转",
       title:"MiMo-V2.5 · 模型结构 3D",
       hint:"点击任意模块查看说明 · 拖拽旋转 · 滚轮缩放 · 双击空白回到全景" },
  en:{ home:"Home", reset:"Fit all", jump:"Jump to",
       title:"MiMo-V2.5 · Model Structure 3D",
       hint:"Click any block for its notes · drag to rotate · scroll to zoom · double-click empty to fit all" },
};
const REGIONS = [
  { v:"whole",  t:T("整机全景","Whole model") },
  { v:"deploy", t:T("48 层主干展开","48-layer backbone") },
  { v:"head",   t:T("输出头 lm_head","Output head") },
  { v:"vit",    t:T("ViT 视觉","ViT vision") },
  { v:"audio",  t:T("音频编码器","Audio encoder") },
  { v:"mtp",    t:T("MTP 头","MTP head") },
];
const LEGEND = [
  [C.global, T("全局注意力","global attn")], [C.swa, T("滑窗 SWA","SWA attn")],
  [C.dense, T("Dense MLP","Dense MLP")], [C.moe, T("MoE 256e top-8","MoE 256e top-8")],
  [C.vit, T("视觉 ViT","Vision ViT")], [C.audio, T("音频编码器","Audio enc")],
  [C.mtp, T("MTP 草稿头","MTP head")], [C.io, T("嵌入 / 输出","embed / head")],
  [GPU_COLS[0], T("GPU rank 颜色","GPU-rank colour")], [REPLICATE_COL, T("KV 复制","KV replica")],
  [C.rs, T("reduce-scatter (融合 o_proj)","reduce-scatter (fused o_proj)")], [C.comm, T("EP all-to-all","EP all-to-all")],
];
const OVERVIEW = T(
  "MiMo-V2.5 (310B 全模态 MoE) 完整结构一次性铺开:左侧音频编码器与 ViT 视觉编码器 (28 块,全局块 0/9/18/27) 各自投影到 4096,按占位符 token 直接合流进右侧主干的 layer 0;主干「8 卡部署」把 48 层按类型折叠成一列(连续同类型层合并为一段,标层号范围 + ⟳×N 循环次数;共 Dense×1、全局+MoE×8、SWA+MoE×39),列顶是输出头 model.norm→lm_head→logits,再往上是单块递归 MTP 草稿头(与主 lm_head 权重共享,虚线相连)。\n每一段里靠近相机会自动完整展开成 3D:单机 8 卡 --tp8 --dp2 --ep8 --enable-dp-attention —— 2 个 DP 组各 4 卡切注意力头(DP 组间 token 不相交),256 专家按 EP=8 分到 8 卡(每卡 32),attn→MoE 边界用 reduce-scatter(融合 o_proj)、专家用 all-to-all。用面板的 TP/DP/EP 下拉改并行度,几何实时重建。点击任意方块看说明、点击某段会飞过去并展开。",
  "The full MiMo-V2.5 (310B omni-modal MoE) structure, all at once: on the left the audio encoder and ViT (28 blocks, full-attn at 0/9/18/27) project to 4096 and merge (at placeholder tokens) directly into layer 0 of the backbone on the right; the '8-GPU deployment' backbone folds the 48 layers into one column by type — consecutive same-type layers are merged into a single segment labelled with its layer range + ⟳×N repeat count (Dense×1, global+MoE×8, SWA+MoE×39). The output head model.norm→lm_head→logits sits at the top of the column, with the single-block recursive MTP draft head above it (sharing the lm_head weight, shown by a dashed link).\nWithin each segment, the part near the camera auto-expands fully into 3D: single-node --tp8 --dp2 --ep8 --enable-dp-attention — 2 DP groups of 4 GPUs split attention heads (tokens disjoint across DP groups), 256 experts sharded EP=8 across 8 GPUs (32/GPU), with reduce-scatter (fused o_proj) at the attn→MoE boundary and all-to-all for experts. Change TP/DP/EP in the panel and the geometry rebuilds live. Click any block for notes; click a segment to fly over and expand it."
);

function renderHUD(info){
  const u = UI[LANG];
  $("title").textContent = getModel(curModel).title[LANG];
  $("tModel").textContent = LANG==="zh" ? "模型" : "Model";
  if(info){
    $("stepName").textContent = info.title[LANG];
    $("stepDesc").textContent = info.desc[LANG];
  } else {
    $("stepName").textContent = T("整机结构总览","Whole-model overview")[LANG];
    $("stepDesc").textContent = OVERVIEW[LANG];
  }
  $("hint").textContent = u.hint;
  $("legend").innerHTML = LEGEND.map(([c,t])=>'<span><i style="background:'+hex6(c)+'"></i>'+t[LANG]+'</span>').join("");
  $("tHome").textContent = u.home; $("btnReset").textContent = u.reset; $("tJump").textContent = u.jump;
  $("tTP").textContent = "TP"; $("tDP").textContent = "DP"; $("tEP").textContent = "EP";
  $("tDPAttn").textContent = LANG==="zh" ? "DP注意力" : "DP-attn";
  $("btnLang").textContent = LANG==="zh" ? "EN" : "中文";
  document.documentElement.lang = LANG;
}
function buildRegionSelect(){
  const sel = $("selRegion"); sel.innerHTML = "";
  REGIONS.forEach(r=>{ const o=document.createElement("option"); o.value=r.v; o.textContent=r.t[LANG]; sel.appendChild(o); });
}
function buildModelSelect(){
  const sel = $("selModel"); sel.innerHTML = "";
  MODELS.forEach(m=>{ const o=document.createElement("option"); o.value=m.id;
    o.textContent = m.name[LANG] + (m.ready ? "" : (LANG==="zh"?"（敬请期待）":" (soon)"));
    sel.appendChild(o); });
  sel.value = curModel;
}
// show the 3D scene for a ready model, or a "coming soon" overlay for one without a config yet.
function applyModel(){
  const m = getModel(curModel), ready = m.ready;
  $("soon").style.display = ready ? "none" : "flex";
  document.querySelector(".panel").style.display = ready ? "" : "none";
  $("gl").style.display = ready ? "block" : "none";
  if(!ready){
    $("soonTitle").textContent = m.name[LANG];
    $("soonBody").textContent = (m.soon||T("结构建设中，敬请期待","Structure coming soon"))[LANG];
  }
  renderHUD(null);
  // a not-ready model has no scene, so MiMo's legend / overview / hint would mislead — hide them.
  ["stepName","stepDesc","legend","hint"].forEach(x=>{ $(x).style.display = ready ? "" : "none"; });
}

// ---------- wiring ----------
$("btnReset").onclick = ()=>{ clearSelection(); $("selRegion").value = "whole"; frameWhole(); };
$("selRegion").onchange = ()=> frameRegion($("selRegion").value);
$("selModel").onchange = ()=>{ curModel = $("selModel").value; applyModel(); if(getModel(curModel).ready) rebuild(); };
$("btnLang").onclick = ()=>{ LANG = LANG==="zh"?"en":"zh"; buildModelSelect(); applyModel(); rebuild(); };
function syncCfg(){
  cfg.tp = parseInt($("selTP").value,10);
  cfg.dp = parseInt($("selDP").value,10);
  cfg.ep = parseInt($("selEP").value,10);
  cfg.dpAttn = $("chkDPAttn").checked;
  rebuild();
}
$("selTP").onchange = syncCfg; $("selDP").onchange = syncCfg;
$("selEP").onchange = syncCfg; $("chkDPAttn").onchange = syncCfg;

// wipe and rebuild geometry (labels are baked sprites → rebuild for language / config change)
function rebuild(){
  const keepRegion = $("selRegion") ? $("selRegion").value : "whole";
  // dispose any live per-run detail first (frees materials/label textures) before wiping root
  for(let r=0;r<NR;r++) if(runDetail[r]) disposeRunDetail(r);
  runDetail.fill(null); runStrip.fill(null); lodDirty = true;
  while(root.children.length){ const c=root.children[0]; root.remove(c); }
  GROUPS.length = 0; pickables.length = 0; for(const k in REGION) delete REGION[k];
  root.add(conns); while(conns.children.length) conns.remove(conns.children[0]);
  buildScene();
  buildRegionSelect();
  if($("selRegion") && [...$("selRegion").options].some(o=>o.value===keepRegion)) $("selRegion").value = keepRegion;
  renderHUD(null);
  selGi = -1;
  frameRegion(keepRegion==="whole" ? "whole" : keepRegion);
}

function onResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener("resize", onResize);
addEventListener("orientationchange", ()=> setTimeout(onResize, 300));

// ---------- boot ----------
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if(tween){
    tween.t += dt/tween.dur;
    const e = smooth(Math.min(1, tween.t));
    camera.position.lerpVectors(tween.fromPos, tween.toPos, e);
    controls.target.lerpVectors(tween.fromTgt, tween.toTgt, e);
    if(tween.t>=1) tween = null;
  }
  // keep near/far tracking the live camera distance so pinch-zoom (mobile) never clips blocks.
  // driven by actual distance to target, not a frozen tween value.
  {
    const dist = camera.position.distanceTo(controls.target);
    const span = sceneBB ? sceneBB.getSize(new THREE.Vector3()).length() : 200;
    camera.near = Math.max(0.05, dist - span);
    camera.far  = dist + span * 1.5;
    camera.updateProjectionMatrix();
  }
  controls.update();
  // LOD: build/dispose per-layer deploy detail near the camera focus. Throttled + dirty-flagged
  // so we don't rebuild every frame; skipped while a camera tween is flying (handled in updateLOD).
  lodTick = (lodTick+1) % 6;
  if(lodDirty || lodTick===0){ lodDirty=false; updateLOD(); }
  renderer.render(scene, camera);
  renderGizmo();
}

onResize();
buildScene();
buildRegionSelect();
buildModelSelect();
applyModel();
camera.position.set(90, 34, 150);
controls.target.set(86, 28, 0);
renderHUD(null);
frameWhole();
animate();

// expose for headless harness
globalThis.__api = { GROUPS, pickables, camera, controls, selectGroup, clearSelection, frameRegion, frameWhole,
  isGlobal, isMoE, VIT_FULL, GLOBALS, REGION, cfg, rebuild, buildScene,
  RUNS, CYCLES, NR, runDetail, runStrip, runY, buildRunDetail, disposeRunDetail, updateLOD, markLodDirty,
  aliveDetail: ()=>runDetail.reduce((n,d)=>n+(d?1:0),0),
  get selGi(){ return selGi; } };
</script>
