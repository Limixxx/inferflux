  c.scale.set(w,h,d); const g=new THREE.Group(); g.add(c); g.userData.mat=m; return g; }
function cube(color){ const m=mat(color,1); const c=new THREE.Mesh(boxGeo,m); c.scale.setScalar(0.72);
  c.userData.mat=m; return c; }
// a row of `n` token cubes along Z (each its own material for per-token recolour/highlight)
function makeTokenRow(n,sp){ const g=new THREE.Group(); const cells=[];
  for(let i=0;i<n;i++){ const c=cube(COL.draft); c.position.z=(i-(n-1)/2)*sp; g.add(c);
    cells.push({mesh:c,mat:c.userData.mat,i}); } g.userData.cells=cells; return g; }
function addRootLabel(txt,x,y,z,hex,owner){ const s=makeLabel(txt,hex); s.position.set(x,y,z);
  root.add(s); parts.labels.push({sp:s,owner}); return s; }
function arc(a,b,color,opacity,lift){ const pts=[]; const n=28;
  const mid=new THREE.Vector3((a.x+b.x)/2,(a.y+b.y)/2+(lift??10),(a.z+b.z)/2);
  for(let i=0;i<=n;i++){ const t=i/n, it=1-t;
    pts.push(new THREE.Vector3(it*it*a.x+2*it*t*mid.x+t*t*b.x, it*it*a.y+2*it*t*mid.y+t*t*b.y, it*it*a.z+2*it*t*mid.z+t*t*b.z)); }
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.Line(geo, new THREE.LineBasicMaterial({color,transparent:true,opacity:opacity??0.5,
    blending:THREE.AdditiveBlending, depthWrite:false})); }
// ---------- step state ----------
let step = 0, playing = false, stepT = 0;
const STEP_DUR = 3.2; // seconds per step when playing

// covers single mat (heads/boxes), block mats (TP-tinted weights) and per-cell mats
// (MLP lanes, experts) — else those groups ignore the highlight and the per-frame reset.
function setEmissive(grp, v){ if(!grp)return;
  if(grp.userData.mat) grp.userData.mat.emissiveIntensity = v;
  if(grp.userData.mats) grp.userData.mats.forEach(m=>m.emissiveIntensity=v);
  if(grp.userData.cells) grp.userData.cells.forEach(c=>c.mat.emissiveIntensity=v); }
function matSet(m, v){ if(m&&m.userData.cells) m.userData.cells.forEach(c=>c.mat.emissiveIntensity=v); }
function setLineOpacity(ln, v){ ln.material.opacity = v; }
// set a group's opacity across whichever material shape it has (head=single, matrix=cells)
function setGroupOpacity(grp, v){
  if(!grp) return;
  if(grp.userData.mat) grp.userData.mat.opacity = v;
  if(grp.userData.mats) grp.userData.mats.forEach(m=>m.opacity=v);
  if(grp.userData.cells) grp.userData.cells.forEach(c=>c.mat.opacity=v);
}
// collect the inner-layer protagonists (base step s=0..9) of ONE phase P into R.
function pushInner(R, P, s){
  const MO=P.moe;
  P.lanes.forEach((L,d)=>{
    const T=P.laneTails[d]||{}, M=T.mlp||{};
    const mlpGroups = cfg.mlp==="DENSE" ? [M.wUp,M.interAct,M.wDn]
                                        : (MO ? [MO.gates[d],MO.experts,MO.shareds[d]] : []);
    if(s===0) R.push(L.input,L.wQ,L.wK,L.wV,...L.qHeads,...L.kHeads,...L.vHeads,...(L.ropes||[]));
    else if(s===1) R.push(...L.qHeads,...L.kHeads,...L.vHeads);
    else if(s===2) R.push(...L.qHeads,...L.kHeads,...(L.ropes||[]),L.scores);
    else if(s===3) R.push(L.scores,L.weights);
    else if(s===4) R.push(L.weights,...L.vHeads,L.ctxVec);
    else if(s===5) R.push(L.ctxVec,L.wO,L.out);
    else if(s===6) R.push(L.out,L.res1);
    else if(s===7) R.push(L.res1,...mlpGroups);
    else if(s===8) R.push(...mlpGroups,T.res2);
    else if(s===9) R.push(T.res2,T.lout);
  });
}
// which element groups are the "protagonists" of the current step. MODULAR: floor = floorOf(step),
// sub = subOf(step). Same shape every floor (0 input · 1-10 inner · 11 head · 12 MTP tail).
function relevantGroups(step){
  const R=[]; const P=parts.phases[floorOf(step)]; if(!P) return new Set();
  const sub=subOf(step), io=P.io;
  if(sub===SUB_IN){ io.candIn.forEach(x=>R.push(x)); io.embeds.forEach(x=>R.push(x)); P.lanes.forEach(L=>R.push(L.input)); }
  else if(sub>=SUB_INNER0 && sub<SUB_HEAD) pushInner(R, P, sub-SUB_INNER0);
  else if(sub===SUB_HEAD){ P.laneTails.forEach(T=>R.push(T.lout));
    io.lmParts.forEach(lm=>{ if(lm){ R.push(lm.head, lm.logits); if(lm.norm) R.push(lm.norm); } });
    io.accepts.forEach(a=>{ if(a) R.push(a); }); }
  else if(sub===SUB_MTP){ P.laneTails.forEach(T=>R.push(T.lout));
    io.drafts.forEach(x=>R.push(x)); io.frozenKVs.forEach(x=>R.push(x)); io.candOut.forEach(x=>R.push(x)); }
    // OFF decode output step: the KV cache / QKᵀ / softmax are NOT protagonists — they stay unfocused
    // (no enlarge, dim labels). Only the emitted token + self-loop arc are the focus here.
  return new Set(R.filter(Boolean));
}
// every focusable group in the scene (all floors: lanes + tails + shared MoE + modular I/O shell)
function allFocusable(){
  const out=[];
  parts.phases.forEach(P=>{
    P.lanes.forEach(L=> out.push(L.input,L.wQ,L.wK,L.wV,...L.qHeads,...L.kHeads,...L.vHeads,
      ...(L.ropes||[]),L.scores,L.weights,L.ctxVec,L.wO,L.out,L.res1));
    P.laneTails.forEach(T=>{ out.push(T.res2,T.lout);
      if(T.mlp) out.push(T.mlp.wUp,T.mlp.interAct,T.mlp.wDn); });
    if(P.moe) out.push(P.moe.experts, ...P.moe.shareds, ...P.moe.gates);
    const io=P.io;
    out.push(...io.candIn, ...io.embeds, ...io.drafts, ...io.candOut, ...io.frozenKVs);
    io.accepts.forEach(a=>{ if(a) out.push(a); });
    io.lmParts.forEach(lm=>{ if(lm){ out.push(lm.head, lm.logits); if(lm.norm) out.push(lm.norm); } });
  });
  return out.filter(Boolean);
}
// the active step's groups grow (scale 1.0); off-step groups stay FULLY OPAQUE and equally
// crisp, just not enlarged (scale 0.78). Focus is signalled by size only, never by fading —
// so every block reads clearly at all times, and the current step simply pops larger.
function applyFocus(dt){
  const rel = relevantGroups(step);
  const k = 1 - Math.pow(0.001, dt); // frame-rate independent smoothing
  allFocusable().forEach(g=>{
    const target = rel.has(g) ? 1 : 0;                  // focus factor (1=active step)
    const f = g.userData.focus ?? target;
    const nf = f + (target - f) * k;
    g.userData.focus = nf;
    if(g.userData.noZoom){ g.scale.setScalar(1.0); setGroupOpacity(g,1.0); return; } // KV cache: fixed size
    const sc = 0.78 + 0.22*nf;                          // scale 0.78 (off) .. 1.0 (active)
    g.scale.setScalar(sc);
    // heads carrying a `spread` are part of a Q/K/V cluster: grow the gap between them by the SAME
    // factor the cubes grow, so focusing zooms the whole cluster instead of just fattening each box.
    const sp = g.userData.spread;
    if(sp){ const off = sp.base * (sc/0.78);
      if(sp.axis==='z') g.position.z = sp.center + off; else g.position.x = sp.center + off; }
    setGroupOpacity(g, 1.0);                             // always fully opaque — crisp everywhere
  });
  // Q→K share lines connect heads that just moved with the focus zoom → re-point their endpoints.
  parts.phases.forEach(P=> P.lanes.forEach(L=>{
    if(!L.shareLines.length || !L.kHeads.length) return;
    const pg = L.qHeads.length / L.kHeads.length;   // Q heads sharing each K head (GQA group size)
    const kxPos = L.kHeads[0].position.x;
    let i=0;
    for(let g=0; g<L.kHeads.length; g++) for(let h=0; h<pg; h++){
      const q = L.qHeads[g*pg+h], ln = L.shareLines[i++];
      if(!q||!ln) continue;
      ln.geometry.setFromPoints([new THREE.Vector3(q.position.x,0,q.position.z),
                                 new THREE.Vector3(kxPos,0,L.kHeads[g].position.z)]);
    }
  }));
  // MTP detail blocks own their labels but are NOT in allFocusable() (their S=0.55 scale must not be
  // touched). Drive their focus here for LABEL dimming only — bright on their floor's MTP step, dim else.
  const onMtp = subOf(step)===SUB_MTP, activeP = parts.phases[floorOf(step)];
  parts.phases.forEach(P=>{ const t = (onMtp && P===activeP) ? 1 : 0;
    P.io.mtpBlocks.forEach(blocks=>blocks.forEach(b=>{
      const f = b.userData.focus ?? t; b.userData.focus = f + (t-f)*k; })); });
  // fade each label with the focus of the element it belongs to
  parts.labels.forEach(({sp, owner})=>{
    const nf = owner ? (owner.userData.focus ?? 1) : 1;
    sp.material.opacity = 0.12 + 0.88*nf; // unfocused labels nearly vanish
  });
}

// attention steps 0-6 for ONE lane L (identical to the original single-pipeline animation).
function applyAttnStep(L, step, p, g, perGroup, BASE, DIM, ACT, NROWS){
  // (OFF-decode KV-cache reveal is centralised in resetPhase so the appended +1 row PERSISTS through
  // MLP / head / loop instead of dropping back — see the kvGrow block there.)
  if(step===0){ // projection: X × W_{Q,K,V} → Q,K,V — steady highlight (0.8), no sine pulse
    setEmissive(L.input, 0.8);
    setEmissive(L.wQ, 0.8); setEmissive(L.wK, 0.8); setEmissive(L.wV, 0.8);
    L.qHeads.forEach(h=>setEmissive(h, BASE + (0.8-BASE)*p));
    L.kHeads.forEach(h=>setEmissive(h, BASE + (0.8-BASE)*p));
    L.vHeads.forEach(h=>setEmissive(h, BASE + (0.8-BASE)*p));
  } else if(step===1){ // grouping: show ALL groups at once (GQA groups run in parallel), steady — no
    // per-group walk, no sine pulse (which made only one head appear to flicker).
    const HL=0.8;
    L.qHeads.forEach(h=>setEmissive(h,HL));
    L.kHeads.forEach(h=>setEmissive(h,HL));
    L.shareLines.forEach(l=>setLineOpacity(l, 0.7*p));
  } else if(step===2){ // QK^T scores — steady highlight (0.8), no sine pulse
    const from=g*perGroup, to=(g+1)*perGroup;
    L.qHeads.forEach((h,i)=>setEmissive(h,(i>=from&&i<to)?0.8:DIM));
    setEmissive(L.kHeads[g], 0.8);
    L.shareLines.forEach((l,i)=>setLineOpacity(l, Math.floor(i/perGroup)===g?0.55:0.1));
    const cells = L.scores.userData.cells;
    cells.forEach((c,idx)=>c.mat.emissiveIntensity = (idx < p*cells.length)?0.85:BASE);
  } else if(step===3){ // softmax
    L.scores.userData.cells.forEach(c=>c.mat.emissiveIntensity=DIM);
    L.weights.userData.cells.forEach(c=>{ const rowP=Math.min(Math.max(p*NROWS - c.i,0),1);
      c.mat.emissiveIntensity = BASE + 0.6*rowP; });
  } else if(step===4){ // weighted × V → context — steady highlight (0.8), no sine pulse
    L.weights.userData.cells.forEach(c=>c.mat.emissiveIntensity=0.55);
    setEmissive(L.vHeads[g], 0.8);
    setEmissive(L.ctxVec, BASE + (0.8-BASE)*p);
    const from=g*perGroup, to=(g+1)*perGroup;
    L.qHeads.forEach((h,i)=>setEmissive(h,(i>=from&&i<to)?(BASE+(0.8-BASE)*p):DIM));
  } else if(step===5){ // output projection: context × W_O → attn output
    L.qHeads.forEach(h=>setEmissive(h, DIM));
    setEmissive(L.ctxVec, ACT); setEmissive(L.wO, ACT);
    setEmissive(L.out, BASE + (ACT-BASE)*p);
  } else if(step===6){ // residual① : attn output + X
    setEmissive(L.out, 0.5); setEmissive(L.res1, ACT);
    if(L.res1Line) L.res1Line.material.opacity=0.7*p;
  }
}

// reset ONE phase P (lanes + tails + moe + I/O) to baseline emissive / hidden lines.
function resetPhase(P, BASE){
  P.lanes.forEach(L=>{
    setEmissive(L.input, BASE); setEmissive(L.out, BASE); setEmissive(L.res1, BASE);
    setEmissive(L.wQ, BASE); setEmissive(L.wK, BASE); setEmissive(L.wV, BASE);
    setEmissive(L.wO, BASE); setEmissive(L.ctxVec, BASE);
    L.qHeads.forEach(h=>setEmissive(h, BASE));
    L.kHeads.forEach(h=>setEmissive(h, BASE));
    L.vHeads.forEach(h=>setEmissive(h, BASE));
    L.shareLines.forEach(l=>setLineOpacity(l, 0.0));
    L.scores.userData.cells.forEach(c=>c.mat.emissiveIntensity=BASE);
    L.weights.userData.cells.forEach(c=>c.mat.emissiveIntensity=BASE);
    // OFF-decode reveal (centralised, driven by global step so it PERSISTS across all substeps):
    // the cache holds only the PREFIX (C0) until the decode QKV projection produces the new token's
    // K/V — from grouping (inner step 1) onward it stays at C0+1 through MLP/head/loop and never grows
    // a second time. QKᵀ appears at QKᵀ step (inner 2), its softmax weight at softmax step (inner 3).
    if(L.kvGrow){ const C0=L.kvGrow.C0, onDecode = floorOf(step)===1 && subOf(step)>=SUB_INNER0;
      const inner = subOf(step)-SUB_INNER0;              // 0=proj,1=group,2=QKᵀ,3=softmax… (HEAD/MTP map ≥10)
      const past  = s2=> onDecode && inner>=s2;          // at/after inner step s2 on the decode floor
      const rev=(m,rows)=> m.userData.cells && m.userData.cells.forEach(c=>{ c.mesh.visible = c.i < rows; });
      const kvRows = past(1) ? C0+1 : C0;                // +1 K/V appended after projection, then persists
      L.kHeads.forEach(h=>rev(h,kvRows)); L.vHeads.forEach(h=>rev(h,kvRows));
      rev(L.scores,  past(2) ? C0+1 : C0);               // +1 QKᵀ score from the QKᵀ step onward
      rev(L.weights, past(3) ? C0+1 : C0); }             // +1 softmax weight from the softmax step onward
    if(L.res1Line) L.res1Line.material.opacity=0.0;
  });
  P.laneTails.forEach(T=>{
    setEmissive(T.res2, BASE); setEmissive(T.lout, BASE);
    if(T.res2Line) T.res2Line.material.opacity=0.0;
    if(T.mlp){ setEmissive(T.mlp.wUp,BASE); setEmissive(T.mlp.interAct,BASE); setEmissive(T.mlp.wDn,BASE);
      if(T.mlp.arLines) T.mlp.arLines.forEach(l=>l.material.opacity=0.0); }
  });
  const MO=P.moe;
  if(MO){ setEmissive(MO.experts, BASE); MO.shareds.forEach(x=>setEmissive(x,BASE));
    MO.gates.forEach(x=>setEmissive(x,BASE));
    MO.dispatch.forEach(l=>l.material.opacity=0.0);
    MO.combine.forEach(l=>l.material.opacity=0.0);
    MO.sharedLines.forEach(l=>l.material.opacity=0.0); }
  const io=P.io;
  // token blocks keep their permanent colours (set at build) — reset only the emissive glow / lines
  io.candIn.forEach(c=>c.userData.cells.forEach(cell=>cell.mat.emissiveIntensity=BASE));
  io.embeds.forEach(x=>setEmissive(x,BASE));
  io.inFlows.forEach(fl=>fl.forEach(l=>l.material.opacity=0.0));
  io.lmParts.forEach(lm=>{ if(lm){ setEmissive(lm.head,BASE); setEmissive(lm.logits,BASE);
    if(lm.norm) setEmissive(lm.norm,BASE); if(lm.bonus) lm.bonus.material.emissiveIntensity=BASE; } });
  io.lmFlows.forEach(fl=>fl.forEach(l=>l.material.opacity=0.0));
  io.bonusLinks.forEach(l=>l.material.opacity=0.0);
  io.accepts.forEach(a=>{ if(a) a.userData.cells.forEach(c=>c.mat.emissiveIntensity=BASE); });
  io.drafts.forEach(x=>setEmissive(x,BASE));
  io.recArrows.forEach(rs=>rs.forEach(l=>l.material.opacity=0.0));
  io.mtpBlocks.forEach(blocks=>blocks.forEach(blk=>{
    if(blk.userData.flows) blk.userData.flows.forEach(l=>l.material.opacity=0.0);
    else if(blk.userData.a2a) blk.userData.a2a.forEach(l=>l.material.opacity=0.0);
    const G=blk.userData.grow; if(G)                               // restore full cache strip off-step
      [G.qk,G.sm,G.kc,G.vc].forEach(m=>m&&m.userData.cells.forEach(c=>{ c.mesh.visible=true;
        c.mat.emissiveIntensity=BASE; })); }));
  io.frozenKVs.forEach(x=>setEmissive(x,BASE));
  io.candOut.forEach(c=>c.userData.cells.forEach(cell=>cell.mat.emissiveIntensity=BASE));
  io.downFlows.forEach(l=>l.material.opacity=0.0);
}

// animate ONE phase P's inner layer step s (0-9), reusing the base attention/MLP highlight.
function applyInner(P, s, p, g, perGroup, BASE, DIM, ACT){
  if(s<=6){ P.lanes.forEach(L=>applyAttnStep(L, s, p, g, perGroup, BASE, DIM, ACT, P.seqLen||cfg.seq)); return; }
  const MO=P.moe;
  if(cfg.mlp==="DENSE"){
    P.laneTails.forEach(T=>{ const M=T.mlp; if(!M) return;
      if(s===7){ setEmissive(M.wUp,ACT); setEmissive(M.interAct,BASE+(ACT-BASE)*p); }
      else if(s===8){ setEmissive(M.interAct,0.6); setEmissive(M.wDn,ACT);
        if(M.arLines) M.arLines.forEach(l=>l.material.opacity=0.7*p); }
      else if(s===9){ setEmissive(T.res2,ACT);
        if(T.res2Line) T.res2Line.material.opacity=0.7*p; setEmissive(T.lout, BASE+(ACT-BASE)*p); }
    });
  } else if(MO){
    if(s===7){ MO.gates.forEach(x=>setEmissive(x,ACT)); MO.shareds.forEach(x=>setEmissive(x,0.4));
      MO.dispatch.forEach(l=>l.material.opacity=0.7*p); setEmissive(MO.experts, BASE+(0.6-BASE)*p);
    } else if(s===8){ setEmissive(MO.experts,ACT); MO.shareds.forEach(x=>setEmissive(x,ACT));
      MO.combine.forEach(l=>l.material.opacity=0.7*p); MO.sharedLines.forEach(l=>l.material.opacity=0.6*p);
    } else if(s===9){ P.laneTails.forEach(T=>{ setEmissive(T.res2,ACT);
      if(T.res2Line) T.res2Line.material.opacity=0.7*p; setEmissive(T.lout, BASE+(ACT-BASE)*p); }); }
  }
}

// smooth ramp 0..1 across the step — full request lifecycle across the two floors.
function updateScene(dt, t){
  if(!parts) return;
  stepT += dt;
  if(!playing && onMtpStep()) parts.mtpAnim += dt;  // per-iteration sub-clock; reset on each click
  if(playing && stepT > STEP_DUR){ next(); }
  applyFocus(dt);
  const p = Math.min(stepT/1.0, 1);
  const BASE = 0.34, DIM = 0.22;
  const ACT  = BASE + 0.30 + 0.30*Math.sin(t*3);
  const g = parts.group, perGroup = cfg.Hq/cfg.Hkv;
  parts.phases.forEach(P=>resetPhase(P, BASE));

  const P = parts.phases[floorOf(step)]; if(!P) return;
  const sub = subOf(step), isPrefill = P.floor===0, io = P.io;

  if(sub===SUB_IN){ // input block → embed_tokens → X
    io.candIn.forEach(c=>c.userData.cells.forEach(cell=>cell.mat.emissiveIntensity=ACT));
    io.embeds.forEach(x=>setEmissive(x, BASE+(ACT-BASE)*p));
    io.inFlows.forEach(fl=>fl.forEach(l=>l.material.opacity=0.7*p));
    P.lanes.forEach(L=>setEmissive(L.input, BASE+(ACT-BASE)*p));
  } else if(sub>=SUB_INNER0 && sub<SUB_HEAD){ // inner layer 0..9
    applyInner(P, sub-SUB_INNER0, p, g, perGroup, BASE, DIM, ACT);
  } else if(sub===SUB_HEAD){ // head: prefill / OFF-decode = lm_head→sample; real spec decode = verify+accept
    P.laneTails.forEach(T=>setEmissive(T.lout, 0.5));
    if(isPrefill || cfg.spec==="OFF"){
      // staged reveal: norm → lm_head → logits → argmax pop, spread across the step
      io.lmParts.forEach(lm=>{ if(!lm) return; const st=p*3;
        if(lm.norm) setEmissive(lm.norm, st>0.2?ACT:BASE);
        setEmissive(lm.head, st>0.8?ACT:BASE);
        lm.logits.userData.cells.forEach((c,i)=>{
          const on = st>1.6;
          c.mat.emissiveIntensity = (i===lm.argRow)
            ? (st>2.2 ? ACT+0.3 : (on?0.6:BASE))   // argmax cell pops brightest last
            : (on?0.45:BASE);
        });
        if(lm.bonus) lm.bonus.material.emissiveIntensity = st>2.2?ACT:BASE;  // gold bonus pops with argmax
      });
      io.lmFlows.forEach(fl=>fl.forEach((l,i)=>l.material.opacity = (p*fl.length>i)?0.8:0.0));
      io.bonusLinks.forEach(l=>l.material.opacity = p>0.9?0.7:0.0);  // bonus→MTP seed lights once bonus is sampled
    } else {
      const N=P.seqLen||cfg.seq, accLen=Math.max(1, Math.floor(N*0.6));
      io.accepts.forEach(a=>{ if(a) a.userData.cells.forEach((c,i)=>{
        c.mat.emissiveIntensity = i<accLen?0.75 : (i===accLen?ACT:BASE); }); });
    }
  } else if(sub===SUB_MTP){ // OFF-decode: KV-cache growth loop · else MTP/DFlash draft tail
    P.laneTails.forEach(T=>setEmissive(T.lout, 0.5));
    const offGrow = cfg.spec==="OFF" && P.floor===1;
    if(offGrow){
      // Plain autoregression, ONE decode step. The prefill token's K/V was ALREADY appended during
      // the attention walkthrough, so the working cache is fixed at C0+1 here — it does NOT grow again
      // when this step emits its token id. The 4-phase sub-clock only lights the OUTPUT: ③ softmax +
      // self-loop arc → ④ emit the next token (candOut). K/V, QKᵀ, softmax all stay at C0+1 rows.
      const PH2=0.4;
      const ph = playing ? 4 : Math.min(4, 1+Math.floor(parts.mtpAnim/PH2));
      P.lanes.forEach(L=>{ const G=L.kvGrow; if(!G) return;
        const cache = G.C0 + 1;                          // fixed working cache (prefix + the 1 appended row)
        const revRows=(grp,newGlow)=>grp.userData.cells.forEach(c=>{
          const on=c.i<cache; c.mesh.visible=on;         // show the full C0+1 cache, hide nothing beyond
          c.mat.emissiveIntensity = !on?BASE : c.i<G.C0?0.4 : newGlow; }); // prefix dim, appended row bright
        G.kc.forEach(h=>revRows(h,0.7)); G.vc.forEach(h=>revRows(h,0.7));
        revRows(G.scores,0.6); revRows(G.weights,0.6);
      });
      io.candOut.forEach(c=>c.userData.cells.forEach(cell=>cell.mat.emissiveIntensity = ph>=4?ACT:0.45));
      io.recArrows.forEach(rs=>rs.forEach(l=>l.material.opacity = ph>=4?0.8:0.0));
      // ③ decode self-loop arc (stored in decode io.downFlows): output candidate → back to input.
      io.downFlows.forEach(l=>l.material.opacity = ph>=3?0.8:0.0);
    } else {
    io.frozenKVs.forEach(x=>setEmissive(x,0.4));
    io.bonusLinks.forEach(l=>l.material.opacity=0.7);  // main-model bonus = the MTP recursion seed (same gold token)
    // Recursion driven by iteration k and a 4-PHASE sub-clock (manual): each "next" click plays,
    // in order, over ~1.6s → (1) KV cache +1 row, (2) QKᵀ/softmax +1 cell, (3) layer-output loop
    // arc lights toward eh_proj, (4) one blue draft token pops into candOut. k=0 = the initial
    // GOLD-only state (context + bonus, no drafts yet). k=1..maxK = the maxK(=seq-1) draft steps.
    //   · MANUAL  → k=parts.mtpIter; ph = 1 + floor(mtpAnim/PH), clamped 1..4 (k≥1).
    //   · PLAYING → k grows on stepT clock; ph pinned to 4 (row-by-row auto-growth, no sub-phases).
    //   · DFlash  → all revealed at once (k=maxK, ph=4).
    const isMTP = cfg.spec==="MTP", PH=0.4, maxK = cfg.seq-1;
    const k  = !isMTP ? maxK : (playing ? Math.min(maxK, Math.floor(stepT/1.1)) : Math.min(maxK, parts.mtpIter));
    const ph = !isMTP ? 4    : (playing ? 4 : (k===0 ? 0 : Math.min(4, 1+Math.floor(parts.mtpAnim/PH))));
    if(isMTP){
      io.mtpBlocks.forEach(blocks=>{ blocks.forEach(blk=>{
        setEmissive(blk, ACT);
        if(blk.userData.flows) blk.userData.flows.forEach(l=>l.material.opacity=0.7);
        const G=blk.userData.grow; if(!G) return;
        const kvLevel = G.C + k + 1;                        // KV rows: new row on phase 1 (instant)
        const scLevel = G.C + (k===0 ? 1 : k + (ph>=2?1:0));// scores/softmax: new cell on phase 2
        const reveal=(mtx,lvl,ctxGlow)=>mtx.userData.cells.forEach(c=>{
          const on = c.i < lvl; c.mesh.visible = on;
          c.mat.emissiveIntensity = !on ? BASE
            : c.i < G.C ? ctxGlow                           // frozen context rows
            : c.i === lvl-1 ? ACT : 0.7;                    // newest revealed row pops
        });
        reveal(G.kc,kvLevel,0.45); reveal(G.vc,kvLevel,0.45);
        reveal(G.qk,scLevel,0.5);  reveal(G.sm,scLevel,0.5);
      }); });
    } else {
      io.drafts.forEach(x=>setEmissive(x,ACT));
    }
    // arcs: [0]=backbone hidden→eh_proj (always on); [1]=layer-output loop arc→eh_proj (phase 3);
    // [2..]=draft d→candOut[d] (phase 4 of iteration d, stays lit afterwards).
    io.recArrows.forEach(rs=>rs.forEach((l,idx)=>{
      let on;
      if(idx===0)      on = true;
      else if(idx===1) on = (k>=1 && ph>=3);
      else { const d=idx-1; on = (k>d) || (k===d && ph>=4); }
      l.material.opacity = on?0.8:0.0;
    }));
    // candOut: [0]=gold bonus (always lit); [i]=blue draft i (pops on phase 4 of iteration i).
    io.candOut.forEach(c=>c.userData.cells.forEach((cell,i)=>{
      if(i===0){ cell.mat.emissiveIntensity = ACT; return; }
      const on = (k>i) || (k===i && ph>=4);
      cell.mat.emissiveIntensity = on ? (i===k?ACT:0.7) : BASE;
    }));
    // connector DOWN to next floor: only once the whole block [gold + drafts] is complete
    io.downFlows.forEach(l=>l.material.opacity = (k>=maxK && ph>=4)?0.8:0.0);
    }
  }
}
// all elements stay visible the whole time; steps are shown via emissive highlight only.
// double-click / double-tap resets the camera to the default iso angle framing everything.
function resetView(){
  if(!parts) return;
  viewInit = false; // force the default iso angle on the next frame
  frameCamera();
}
// ---------- controls & i18n ----------
const $ = id => document.getElementById(id);
function gotoStep(s){
  const from = step;
  step = ((s % STEPS.length) + STEPS.length) % STEPS.length;
  stepT = 0;
  // entering the MTP step: park the triangle cursor at the end we're arriving from
  // (forward → first row 0; backward → last row) so manual stepping is continuous.
  if(subOf(step)===SUB_MTP){ parts.mtpIter = (s>=from) ? 0 : mtpRows()-1; parts.mtpAnim = 0; }
  // walk to the next KV group each time we advance INTO the grouping sub-step (inner step 1 =
  // sub SUB_INNER0+1) on any floor, so repeated plays demo every group; clamp otherwise.
  if(subOf(step)===SUB_INNER0+1 && subOf(from)===SUB_INNER0)
    parts.group = (parts.group + 1) % cfg.Hkv;
  else parts.group = parts.group % cfg.Hkv;
  renderHUD(); // note: camera is NOT touched here — keeps the user's chosen angle
}
// On the MTP step, manual next/prev walk the causal triangle ONE ROW per click (focus-zoom each
// draft token, layer by layer). Only when the cursor runs off either end do we cross to the
// neighbouring step. Autoplay is unaffected (it uses the smooth stepT clock in updateScene).
function mtpRows(){ return cfg.spec==="OFF" ? OFF_NITER : Math.max(1, cfg.seq); }   // manual iterations
// manual-loop step: MTP tail (any floor) OR the OFF decode-loop (decode floor SUB_MTP). Both drive
// parts.mtpIter/mtpAnim (iteration + 4-phase sub-clock).
function onMtpStep(){ return subOf(step)===SUB_MTP &&
  (cfg.spec==="MTP" || (cfg.spec==="OFF" && floorOf(step)===1)); }
// Re-trigger the focus "enlarge" ramp for the current step's protagonists: drop their focus to the
// off-scale baseline so applyFocus grows them back to 1.0 again. Called on each manual iteration
// advance so every loop re-zooms exactly like the first (else focus stays pinned at 1.0 = no ramp).
function pulseFocus(){ const rel = relevantGroups(step);
  allFocusable().forEach(g=>{ if(rel.has(g)) g.userData.focus = 0.78; }); }
function next(){
  if(!playing && onMtpStep() && parts.mtpIter < mtpRows()-1){ parts.mtpIter++; parts.mtpAnim=0; pulseFocus(); renderHUD(); return; }
  gotoStep(step+1);
}
function prev(){
  if(!playing && onMtpStep() && parts.mtpIter > 0){ parts.mtpIter--; parts.mtpAnim=0; pulseFocus(); renderHUD(); return; }
  gotoStep(step-1);
}

// legend rebuilds with the head colouring: tp=1 → Q/K/V; tp>1 → one swatch per GPU rank
// (+ a grey "KV replica" swatch when Hkv<tp, matching the greyed KV heads/weights).
const hex6 = n => "#"+n.toString(16).padStart(6,"0");
function renderLegend(u){
  const el = $("legend"); if(!el) return;
  const tp = cfg.tp||1, dp = cfg.dp||1, items = [];
  // tp>1 colours the heads by TP rank; under DP each lane replicates those same TP ranks,
  // so the swatch means "TP rank r" (present in every DP lane), not one unique GPU.
  const rankLbl = dp>1 ? (u.gpu+"/TP ") : (u.gpu+" ");
  if(tp<=1){
    items.push(["var(--q)", u.q], ["var(--k)", u.k], ["var(--v)", u.v]);
  } else {
    for(let r=0;r<tp;r++) items.push([hex6(GPU_COLS[r % GPU_COLS.length]), rankLbl+r]);
    if(cfg.Hkv < tp) items.push([hex6(REPLICATE_COL), u.kvrep]);
  }
  if(dp>1) items.push([hex6(0x9aa7b8), u.dp+"\u00d7"+dp+" lanes"]);
  items.push([hex6(COL.res), u.res]);
  if(cfg.mlp==="MOE") items.push([hex6(COL.shared), "shared expert"], [hex6(COL.comm), "all-to-all"]);
  else if(tp>1) items.push([hex6(COL.comm), "AllReduce"]);
  el.innerHTML = items.map(([c,t])=>
    '<span><i style="background:'+c+'"></i>'+t+'</span>').join("");
}

function renderHUD(){
  const u = UI[LANG];
  const md = MODES[cfg.mode] || MODES.GQA;
  const dp=cfg.dp||1, tp=cfg.tp||1;
  const par = (dp>1?"DP"+dp+" ":"") + (tp>1?"TP"+tp+" ":"") + (cfg.mlp==="MOE"?"EP"+cfg.ep:"");
  const gpuTag = (dp>1||tp>1) ? "  ·  "+(dp*tp)+" GPU"+(dp*tp>1?"s":"")+(par?" ("+par.trim()+")":"") : "";
  // phase tag by floor (modular)
  const floor = floorOf(step), sub = subOf(step);
  const phaseTag = FLOOR_TAG[floor][LANG];
  // spec OFF: omit the spec segment entirely (a "no-spec" tag is redundant). MTP/DFlash show the name.
  const specSeg = cfg.spec==="OFF" ? "" : " · " + cfg.spec;
  $("title").textContent = md.title[LANG] + " · " + (cfg.mlp==="MOE"?"MoE":"Dense")
    + specSeg + "  ·  " + phaseTag + gpuTag;
  // OFF has no verify/draft steps: relabel the decode head + tail step to plain autoregression.
  let stepName = STEPS[step].name[LANG];
  if(cfg.spec==="OFF"){
    // decode-floor inner step names embed the "② decode·verify" floor tag (baked in at load). With
    // spec OFF the decode floor is plain autoregression, not verification → drop the "·verify".
    if(sub>=SUB_INNER0 && sub<SUB_HEAD)
      stepName = stepName.replace("decode·verify", LANG==="zh"?"decode·自回归":"decode·autoregress");
    else if(sub===SUB_HEAD && floor===1) stepName = STEPS[step].name[LANG].replace(
      /·.*/, LANG==="zh"?"· lm_head → 生成 1 个 token":"· lm_head → generate 1 token");
    else if(sub===SUB_MTP) stepName = STEPS[step].name[LANG].replace(/·.*/, floor===1
      ? (LANG==="zh"?"· 自回归循环：KV cache 逐步增长":"· autoregressive loop: KV cache grows")
      : (LANG==="zh"?"· 输出生成的 token → 下一步":"· output the generated token → next step"));
  }
  $("stepName").textContent = stepName;
  // inner-layer step index s (0..9) when this sub is an inner-layer step, else -1.
  const s = (sub>=SUB_INNER0 && sub<SUB_HEAD) ? sub-SUB_INNER0 : -1;
  let desc = STEPS[step].desc ? STEPS[step].desc[LANG] : "";
  const OFF = cfg.spec==="OFF";
  if(sub===SUB_IN)        desc = floor===0 ? XSPEC.prompt[LANG] : (OFF ? XSPEC.offin[LANG] : XSPEC.blockin[LANG]);
  else if(sub===SUB_HEAD) desc = floor===0 ? XSPEC.lmhead[LANG] : (OFF ? XSPEC.offhead[LANG] : XSPEC.verify[LANG]);
  else if(sub===SUB_MTP && OFF && floor===1){
    const ph=Math.min(4,1+Math.floor(parts.mtpAnim/0.4));
    const phName = LANG==="zh"
      ? ["① prefill 出的 token 的 K/V 入缓存（+1 行）","② QKᵀ 沿缓存竖排算分","③ softmax + 自循环弧点亮","④ 生成下一个 token"]
      : ["① prefill token's K/V enter cache (+1 row)","② QKᵀ down the cache column","③ softmax + self-loop arc","④ emit next token"];
    desc = LANG==="zh"
      ? "自回归 decode 第一步 · "+phName[ph-1]+" · 4 阶段自动播放。"
        +"  prefill 出的 token 追加进缓存 → KV cache = 前缀 + 1，QKᵀ / softmax 也覆盖前缀 + 1（最新一行最亮）。"
      : "First autoregressive decode step · "+phName[ph-1]+" · the 4 phases play automatically."
        +"  The prefill token is appended → KV cache = prefix + 1, and QKᵀ / softmax span prefix + 1 (newest row brightest)."; }
  else if(sub===SUB_MTP && OFF){ desc = LANG==="zh"
      ? "关闭投机解码：prefill 输出 1 个 token（金），直接作为 decode 第一步的输入。"
      : "Speculative decoding OFF: prefill emits 1 token (gold), feeding directly into the first decode step."; }
  else if(sub===SUB_MTP){ desc = XSPEC.mtp[cfg.spec][LANG];
    if(cfg.spec==="MTP"){ const maxK=cfg.seq-1, k=Math.min(maxK,parts.mtpIter);
      const ph = k===0?0:Math.min(4,1+Math.floor(parts.mtpAnim/0.4));
      const phName = LANG==="zh"
        ? ["起始：仅金色 bonus","① KV cache +1","② QKᵀ/softmax +1","③ layer output 回环→eh_proj","④ 输出 +1 蓝 token"]
        : ["start: gold bonus only","① KV cache +1","② QKᵀ/softmax +1","③ layer-output loop→eh_proj","④ emit +1 blue token"];
      desc += LANG==="zh"
        ? "  ｜ 手动递归：第 "+k+"/"+maxK+" 步 · "+phName[ph]+" · 点『下一步』播完 4 阶段并起草下一个 token，共 "+maxK+" 步。"
        : "  | manual recursion: step "+k+"/"+maxK+" · "+phName[ph]+" · click Next to play the 4 phases & draft the next token ("+maxK+" steps total)."; }
    if(cfg.spec==="MTP" && (cfg.tp||1)>1) desc += LANG==="zh"
      ? " ｜ TP="+cfg.tp+"：MTP 同样张量并行，跨全部 rank 执行——self_attn/MLP 按 rank 切分（按 GPU 上色，分隔线为界），eh_proj(fc) 是普通 Linear、每卡复制（灰）。"
      : " | TP="+cfg.tp+": the MTP is tensor-parallel too, running across ALL ranks — self_attn/MLP are sharded per rank (coloured by GPU, dividers mark boundaries); eh_proj (fc) is a plain Linear, replicated on every rank (grey).";
    if(cfg.spec==="MTP" && cfg.mlp==="MOE" && (cfg.dp||1)>1) desc += LANG==="zh"
      ? " ｜ DP="+cfg.dp+"（DP-attention）：MTP 的 MoE 与主干同一套 all-to-all（dispatch/combine，青线）。但 draft 本身不跑 DP——这些 DP rank 在 draft 侧塌缩成一个 attn_tp_group，a2a 在该组内进行（并非主干那种跨 DP rank 汇聚）。"
      : " | DP="+cfg.dp+" (DP-attention): the MTP's MoE runs the SAME all-to-all as the backbone (dispatch/combine, cyan lines). But the draft itself does NOT use DP — those DP ranks collapse into the draft's attn_tp_group, and the a2a happens within it (not the backbone's cross-DP-rank gather)."; }
  else if(s===0)         desc = md.proj[LANG];
  else if(s===1)         desc = md.grp[LANG];
  else if(s===6)         desc = XDESC.res1[LANG];
  else if(s===7)         desc = XDESC.mlpUp[cfg.mlp][LANG];
  else if(s===8)         desc = XDESC.mlpDown[cfg.mlp][LANG];
  else if(s===9)         desc = XDESC.res2[LANG];
  // DP-attention note on inner attention steps (either floor)
  if((cfg.dp||1)>1 && s>=0){
    if(s<=6) desc += LANG==="zh"
      ? " ｜ DP-attention：每个 DP rank 独立算自己那批 token 的 attention、各持自己的 KV（不复制）。"
      : " | DP-attention: each DP rank runs attention on its own tokens with its own KV (not replicated).";
    else if(cfg.mlp==="MOE" && (s===7||s===8)) desc += LANG==="zh"
      ? " ｜ 各 DP rank 的 token 经 all-to-all 汇聚到共享 experts（喂胖 GEMM），算完再散回各 rank。"
      : " | Tokens from all DP ranks are all-to-all gathered into the shared experts (fat GEMM), then scattered back.";
  }
  // DFLASH+DP engine-difference note (neutral, names engines — not an architectural limit)
  if(cfg.spec==="DFLASH" && (cfg.dp||1)>1) desc += LANG==="zh"
    ? " ｜ 注：DFlash+DP-attention —— vLLM 支持；SGLang 当前实现暂不支持（引擎差异，非原理限制）。"
    : " | Note: DFlash + DP-attention — supported by vLLM; not yet supported by SGLang's current implementation (an engine difference, not an architectural limit).";
  $("stepDesc").textContent = desc;
  renderLegend(u);
  $("tPrev").textContent = u.prev; $("tNext").textContent = u.next;
  $("btnPlay").textContent = playing ? u.pause : u.play;
  $("tMode").textContent = u.mode; $("tMlp").textContent = u.mlp; $("tSpec").textContent = u.spec;
  $("tHq").textContent = u.hq; $("tHkv").textContent = u.hkv; $("tSeq").textContent = u.seq; $("tInSeq").textContent = u.inseq;
  $("tTP").textContent = u.tp; $("tEP").textContent = u.ep; $("tTopk").textContent = u.topk;
  $("tDP").textContent = u.dp;
  $("tHome").textContent = u.home;
  $("btnLang").textContent = LANG==="zh" ? "EN" : "中文";
  document.documentElement.lang = LANG;
  $("grpEP").style.display = (cfg.mlp==="MOE") ? "" : "none";
  $("grpTopk").style.display = (cfg.mlp==="MOE") ? "" : "none";
  $("grpSeq").style.display = (cfg.spec==="OFF") ? "none" : "";
}

canvas.addEventListener("dblclick", resetView); // double-click to recenter the view
$("btnNext").onclick = next;
$("btnPrev").onclick = prev;
$("btnPlay").onclick = ()=>{ playing=!playing; stepT=0;
  if(!playing && parts) parts.mtpIter=0;   // pause → reset manual cursor so stepping starts at layer 1
  renderHUD(); };
$("btnLang").onclick = ()=>{ LANG = LANG==="zh"?"en":"zh"; renderHUD(); };

function syncParams(){
  cfg.mode = $("selMode").value;
  cfg.mlp  = $("selMlp").value;
  cfg.spec = $("selSpec").value;   // MTP or DFLASH (DP not disabled; DFLASH+DP allowed — vLLM)
  cfg.ep   = +$("selEP").value;
  cfg.topk = +$("selTopk").value;
  cfg.dp   = +$("selDP").value;
  cfg.Hq  = +$("selHq").value;
  cfg.seq   = +$("selSeq").value;
  cfg.inSeq = +$("selInSeq").value;
  // TP: each GPU gets Hq/tp query heads → tp must divide Hq (clamp down to the largest valid power)
  let tp = +$("selTP").value;
  while(tp>1 && cfg.Hq % tp !== 0) tp >>= 1;   // Hq & tp are powers of 2, so halving lands on a divisor
  cfg.tp = tp; $("selTP").value = String(tp);
  // mode drives the K/V head count
  if(cfg.mode==="MHA")      cfg.Hkv = cfg.Hq;                 // one K/V per Q head → Hkv == Hq
  else if(cfg.mode==="MQA") cfg.Hkv = 1;                      // single shared K/V head
  else {                                                       // GQA: user picks, must be 1<Hkv<Hq & divide Hq
    let h = +$("selHkv").value;
    if(cfg.Hq % h !== 0 || h>=cfg.Hq || h<1) h = gcdDivisor(cfg.Hq, Math.min(h,cfg.Hq-1));
    cfg.Hkv = h;
  }
  $("selHkv").value = String(cfg.Hkv);   // dropdown always mirrors the effective Hkv (=Hq in MHA)
  // the Hkv selector only applies to GQA — grey it out otherwise
  $("selHkv").disabled = (cfg.mode!=="GQA");
  viewInit = true;  // preserve current camera angle on option change — do NOT snap to default iso
  build(); gotoStep(step);
}
function gcdDivisor(hq,hkv){ // largest divisor of hq that is <= hkv and < hq
  for(let d=Math.min(hkv,hq-1); d>=1; d--) if(hq%d===0) return d; return 1; }
$("selMode").onchange = syncParams;
$("selMlp").onchange = syncParams;
$("selSpec").onchange = syncParams;
$("selEP").onchange = syncParams;
$("selTopk").onchange = syncParams;
$("selDP").onchange = syncParams;
$("selHq").onchange = syncParams;
$("selHkv").onchange = syncParams;
$("selSeq").onchange = syncParams;
$("selInSeq").onchange = syncParams;
$("selTP").onchange = syncParams;

// ---------- boot ----------
build();
onResize();   // size the canvas drawing buffer to the window NOW (else it stays 300x150 → blurry)
gotoStep(0);
renderHUD();
animate();
</script>
</body>
</html>
