*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{background:var(--bg); color:var(--text); overflow:hidden;
  font-family:-apple-system,"SF Pro","Segoe UI",Roboto,"PingFang SC",sans-serif;}
#gl{display:block; width:100vw; height:100vh; cursor:grab; touch-action:none;}
#gl:active{cursor:grabbing;}
.hud{position:fixed; top:16px; left:16px; max-width:340px; pointer-events:none;}
.hud .home{display:inline-block; pointer-events:auto; color:var(--muted); font-size:12px;
  text-decoration:none; margin-bottom:6px;}
.hud .home:hover{color:var(--accent);}
.hud h1{font-size:15px; font-weight:700; margin-bottom:6px;}
.hud .step{color:var(--accent); font-weight:600; font-size:13px;}
.hud .desc{color:var(--muted); font-size:12px; line-height:1.6; margin-top:4px;}
.legend{display:flex; flex-wrap:wrap; gap:8px 12px; margin-top:10px; font-size:11px; color:var(--muted);}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:middle;}
.panel{position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
  background:var(--panel); backdrop-filter:blur(8px); border:1px solid var(--border);
  border-radius:12px; padding:12px 16px; display:flex; align-items:center; gap:12px;
  font-size:12px; flex-wrap:wrap; justify-content:center; max-width:calc(100vw - 24px);}
.panel select:disabled{opacity:.5; cursor:not-allowed;}
.panel button{background:#1c2330; border:1px solid var(--border); color:var(--text);
  border-radius:7px; padding:6px 12px; cursor:pointer; font-size:12px;}
.panel button:hover{border-color:var(--accent);}
.panel button.primary{background:var(--accent); border-color:var(--accent); color:#08111e; font-weight:600;}
.panel .grp{display:flex; align-items:center; gap:6px; color:var(--muted);}
.panel select{background:#1c2330; border:1px solid var(--border); color:var(--text);
  border-radius:6px; padding:4px 6px; font-size:12px;}
.badge{position:fixed; bottom:16px; right:16px; color:var(--muted); font-size:11px;}
#btnLang{position:fixed; top:16px; right:16px; background:#1c2330; border:1px solid var(--border);

@media (max-width:640px){
  .hud{max-width:none; right:16px; top:12px; left:12px;}
  .hud h1{font-size:14px;}
  .hud .desc{font-size:11px;}
  .badge{display:none;}
  .panel{left:8px; right:8px; transform:none; bottom:10px; gap:8px 10px;

  .panel button{padding:8px 12px; font-size:13px;}
  .panel select{padding:6px 8px; font-size:13px;}
}

<script type="module">
import * as THREE from './vendor/three.module.js';
import { OrbitControls } from './vendor/jsm/controls/OrbitControls.js';

// ---------- i18n ----------
// Full request lifecycle (real order, per SGLang eagle_worker_v2.forward_batch_generation):
//   ① PREFILL: target runs the WHOLE prompt once (10 inner steps) → 1st token + draft-extend
//      fills the draft KV (warm-up only, no candidates yet).
//   ② DECODE loop: draft produces candidates → target verifies them in one forward (10 inner
//      steps again) → accept prefix + bonus → loop.
// The 10 inner steps (proj→…→res②) are the SAME base layer, run on two floors (prefill/decode).
// INNER[] holds their names/desc once; the step table splices them into both floors.
const INNER = [
  { name:{zh:"输入投影",en:"Projection"},
    desc:{zh:"输入 X 乘以权重 W_Q/W_K/W_V 得到 Q/K/V。GQA 中 Q 有 H_q 个头，K/V 只有 H_kv 个头（H_kv < H_q）。",
          en:"X is multiplied by weights W_Q/W_K/W_V to form Q/K/V. GQA gives Q H_q heads but K/V only H_kv heads (H_kv < H_q)."}},
  { name:{zh:"分组共享",en:"Grouping"},
    desc:{zh:"H_q 个 Query 头分成 H_kv 组，每组内的所有 Q 头共享同一个 K/V 头 —— 这是 GQA 省显存的关键。",
          en:"H_q query heads split into H_kv groups; every Q head in a group shares one K/V head — GQA's memory-saving core."}},
  { name:{zh:"打分 QKᵀ",en:"Scores QKᵀ"},
    desc:{zh:"每个 Q 头与其所属组的 K 头做点积，得到 seq×seq 的注意力分数矩阵，再除以 √d_k。",
          en:"Each Q head dots with its group's K head → a seq×seq score matrix, scaled by 1/√d_k."}},
  { name:{zh:"Softmax",en:"Softmax"},
    desc:{zh:"对分数矩阵按行做 softmax，得到归一化的注意力权重（每行和为 1）。",
          en:"Row-wise softmax over the scores yields normalized attention weights (each row sums to 1)."}},
  { name:{zh:"加权求和 ×V",en:"Weighted ×V"},
    desc:{zh:"注意力权重乘以组内共享的 V 头，得到每个 Q 头的上下文向量 context（=Σ w·V）。",
          en:"Multiply weights by the group's shared V head → per-head context vector (= Σ w·V)."}},
  { name:{zh:"输出投影 o_proj",en:"Output proj o_proj"},
    desc:{zh:"拼接所有 H_q 个头的 context，乘以输出权重 W_O(o_proj，行并行) 投回 hidden。TP>1 时各 GPU 部分和经一次 AllReduce。",
          en:"Concatenate all H_q contexts × W_O (o_proj, row-parallel) back to hidden. With TP>1, partial sums are AllReduced."}},
  { name:{zh:"残差①",en:"Residual ①"} },
  { name:{zh:"MLP/MoE · 上投影",en:"MLP/MoE · up"} },
  { name:{zh:"MLP/MoE · 下投影",en:"MLP/MoE · down"} },
  { name:{zh:"残差② → 层输出",en:"Residual ② → output"} },
];
// ===== MODULAR pipeline step system =====
// TWO floors, each a UNIFORM pipeline of SUBS_PER_FLOOR sub-steps:
//   0      input:  candIn (prompt / decode's own output block, self-looped) → embed_tokens → X
//   1..10  inner:  the SAME target transformer layer (attn + MLP/MoE), reused verbatim
//   11     head:   prefill → lm_head→logits→sample→bonus(gold); decode → verify+accept(bonus=gold)
//   12     mtp:    MTP/DFlash draft tail appends blue draft tokens → this floor's OUTPUT block
//                  [gold bonus, blue×(seq-1)].
// The prefill floor's output flows DOWN to the decode floor's input (one-shot). The DECODE floor's
// output loops back to its OWN input (a self-loop) — that self-loop IS the decode iteration.
// step = floor*SUBS_PER_FLOOR + sub.  floor 0 = prefill, 1 = decode (self-looping).
const NUM_FLOORS=2, SUBS_PER_FLOOR=13;
const SUB_IN=0, SUB_INNER0=1, SUB_HEAD=11, SUB_MTP=12;
const OFF_NITER=1;   // spec OFF: prefill emits 1 token → first decode step, cache = prefix + 1
const floorOf = st => Math.floor(st/SUBS_PER_FLOOR);
const subOf   = st => st % SUBS_PER_FLOOR;
const FLOOR_ZH=["① prefill","② decode·verify"];
const FLOOR_TAG=[ {zh:"① Prefill",en:"① Prefill"},
                  {zh:"② Decode（自循环）",en:"② Decode (self-loop)"} ];
function innerSteps(floorZh, floorEn){
  return INNER.map(s=>({ name:{zh:s.name.zh+"（"+floorZh+"）",en:s.name.en+" ("+floorEn+")"},
                         desc:s.desc }));
}
// build STEPS programmatically: one uniform block per floor.
const STEPS = (()=>{
  const out=[];
  for(let f=0; f<NUM_FLOORS; f++){
    const base=f*SUBS_PER_FLOOR;
    const inName = f===0 ? {zh:(base+1)+" · Prompt 输入 → X",en:(base+1)+" · Prompt in → X"}
                         : {zh:(base+1)+" · 上层候选块 → embed → X",en:(base+1)+" · Prev block → embed → X"};
    out.push({ name:inName });                                       // sub 0
    innerSteps(FLOOR_ZH[f],FLOOR_ZH[f]).forEach((s,i)=>            // sub 1..10
      out.push({ name:{zh:(base+2+i)+" · "+s.name.zh, en:(base+2+i)+" · "+s.name.en}, desc:s.desc }));
    const headName = f===0 ? {zh:(base+12)+" · lm_head → sample 出 bonus(金)",en:(base+12)+" · lm_head → sample bonus(gold)"}
                           : {zh:(base+12)+" · 验证 + 接受（bonus=金）",en:(base+12)+" · Verify + accept (bonus=gold)"};
    out.push({ name:headName });                                    // sub 11
    out.push({ name:{zh:(base+13)+" · draft 起草 → 输出候选块 [金+蓝×(n-1)]",
                     en:(base+13)+" · draft → output block [gold+blue×(n-1)]"} }); // sub 12
  }
  return out;
})();
// per-sub-step description text (input / lmhead / verify / mtp), keyed by floor kind + method
const XSPEC = {
  // sub 0 input: floor 0 = prompt; floors 1+ = previous floor's output candidate block
  prompt:{zh:"请求进来：一段 prompt（token id）。先过目标主模型的 embed_tokens（VocabParallelEmbedding，vocab×hidden 的查表）把 token id 变成向量 X，再对整个 prompt 跑一次完整前向（prefill）。draft/MTP 还没登场——它必须先拿到 target 的 hidden 才能起草。",
        en:"A request arrives: a prompt (token ids). They first pass the target's embed_tokens (VocabParallelEmbedding, a vocab×hidden lookup) into vectors X, then the target runs one full forward over the whole prompt (prefill). The draft/MTP hasn't acted yet; it needs the target's hidden states before it can draft."},
  blockin:{zh:"关键联系：上一层楼输出的候选块 [金 bonus, 蓝 draft×(n-1)]（token id）就是这一层的输入。这些 token id 先过 target 的 embed_tokens（vocab×hidden 查表）变成 X，target 再对整块长度 n 的序列跑一次前向来验证。这正是投机解码的核心——draft 的输出直接当作下一次 forward 的输入。",
        en:"The key link: the previous floor's output block [gold bonus, blue draft×(n-1)] (token ids) is THIS floor's input. The token ids first pass the target's embed_tokens (vocab×hidden lookup) into X, then the target runs one forward over the whole length-n block to verify. This is the heart of speculative decoding — the draft's output IS the next forward's input."},
  lmhead:{zh:"prefill 的层输出还只是 hidden，不是 token。取【最后一个位置】的 hidden 过最终 RMSNorm，再乘 lm_head（ParallelLMHead，hidden×vocab，与 embed_tokens 权重共享/tie），得到长度 vocab 的 logits；采样（argmax / top-p）得到第 1 个 token id —— 这就是 bonus（金色锚点）。lm_head 与输入侧的 embed_tokens 互为逆：一个 hidden→vocab，一个 vocab→hidden。",
        en:"The layer output is still a hidden state, not a token. Take the LAST position's hidden → final RMSNorm → multiply by lm_head (ParallelLMHead, hidden×vocab, weight-tied with embed_tokens) → a length-vocab logits vector; sampling (argmax / top-p) picks the 1st token id — this is the bonus (gold anchor). lm_head is the inverse of the input-side embed_tokens: hidden→vocab vs vocab→hidden."},
  // OFF (spec off) DECODE floor: plain autoregression — no draft block, no verify. Single token in,
  // single token out. offin = sub 0 input; offhead = sub 11 head.
  offin:{zh:"关闭投机解码：上一步（prefill 或上一 decode 步）生成的单个 token（金）就是这一层的输入。它先过 target 的 embed_tokens（vocab×hidden 查表）变成向量 X，再喂进 target 跑一次前向。没有草稿块、也没有验证——这就是普通自回归：一次只处理 1 个 token。",
        en:"Speculative decoding OFF: the single token (gold) generated by the previous step (prefill or the prior decode step) IS this floor's input. It first passes the target's embed_tokens (vocab×hidden lookup) into a vector X, then the target runs one forward. No draft block and no verify — this is plain autoregression: one token processed at a time."},
  offhead:{zh:"decode 的层输出是 hidden，不是 token。过最终 RMSNorm，再乘 lm_head（hidden×vocab，与 embed_tokens tie）得到长度 vocab 的 logits；采样（argmax / top-p）得到下一个 token id。没有 bonus、没有草稿——这个 token 直接作为下一个 decode 步的输入，如此自回归循环。",
        en:"The decode layer output is a hidden state, not a token. Pass it through the final RMSNorm, then multiply by lm_head (hidden×vocab, tied with embed_tokens) → a length-vocab logits vector; sampling (argmax / top-p) gives the next token id. No bonus, no draft — this token feeds straight into the next decode step, looping autoregressively."},
  verify:{zh:"一次前向就覆盖全部 n 个位置。逐位置比对草稿与 target 预测：matches = cand[1:]==target_pred[:-1]，cumprod 取连续命中前缀长度（绿）；首个失配处用 target 的预测作 bonus（金）。接受 k 个 → 序列前进 k 个（写进 KV）。这个金色 bonus 就是下面 MTP 起草的锚点。",
        en:"One forward covers all n positions. Compare drafts vs target predictions: matches = cand[1:]==target_pred[:-1], cumprod gives the consecutive-match prefix length (green); the first mismatch takes the target's prediction as bonus (gold). Accept k → the sequence advances by k (committed to KV). This gold bonus becomes the anchor the MTP tail drafts from."},
  mtp:{ DFLASH:{zh:"接在本层之后：DFlash draft（无自己的 embed/lm_head，借 target 的）读本层输出的主干 hidden，把后面 n-1 个位置填 MASK、一次并行前向填完整块草稿。输出候选块 = [金 bonus, 蓝 draft×(n-1)]，整块向下喂给下一层楼作输入。",
        en:"Appended after this layer: the DFlash draft (no embed/lm_head of its own, borrows target's) reads this layer's output hidden, fills the next n-1 positions with MASK and drafts the whole block in ONE parallel forward. Output block = [gold bonus, blue draft×(n-1)], fed DOWN to the next floor as its input."},
    MTP:{zh:"接在本层之后（架构上就是主干层 N+1）：MTP 物理只 1 个 block（eh_proj 把上一 token 的 embed 与本层输出的主干 hidden 拼接投影 → self_attn → MLP），从金色 bonus 出发递归 n-1 步，每步吐 1 个蓝色 draft token、hidden 喂下一步。这里把 n-1 步空间展开（权重共享）。输出候选块 = [金 bonus, 蓝×(n-1)]，整块向下喂给下一层楼。",
        en:"Appended after this layer (architecturally the backbone's layer N+1): MTP is physically ONE block (eh_proj concatenates the previous token's embed with this layer's output hidden → self_attn → MLP). Starting from the gold bonus it recurses n-1 steps, each emitting one blue draft token and feeding its hidden onward. Those n-1 steps are unrolled (shared weights). Output block = [gold bonus, blue×(n-1)], fed DOWN to the next floor."} },
};
// descriptions for the inner (non-attention) layer steps; MLP steps depend on Dense/MoE
const XDESC = {
  res1:{zh:"注意力输出加回输入 X（残差连接）。这是 Transformer 层的第一个 add。",
        en:"Attention output is added back to input X (residual). The layer's first add."},
  mlpUp:{ DENSE:{zh:"稠密 MLP：gate_up_proj（列并行）把 hidden 升到 2·inter，SiluAndMul 做 silu(gate)·up。每张 GPU 只算 inter/tp。",
        en:"Dense MLP: gate_up_proj (column-parallel) lifts hidden to 2·inter; SiluAndMul does silu(gate)·up. Each GPU computes inter/tp."},
    MOE:{zh:"MoE：gate(ReplicatedLinear) 算 router_logits，softmax 取 top-k(k=2) 个专家（每 token）。EP 下每张 GPU 只放 num_experts/ep 个专家，token 经 all-to-all dispatch 发到对应 GPU。另有 shared expert 对所有 token 无条件激活。",
        en:"MoE: gate → router_logits, softmax top-k (k=2) experts (per token). Under EP each GPU holds num_experts/ep experts; tokens go via all-to-all dispatch to the owner GPU. A shared expert fires for every token unconditionally."} },
  mlpDown:{ DENSE:{zh:"down_proj（行并行）把 inter 投回 hidden；TP>1 时各 GPU 部分和经一次 AllReduce 求和成完整输出。",
        en:"down_proj (row-parallel) maps inter back to hidden; with TP>1 partial sums are combined by one AllReduce."},
    MOE:{zh:"各专家跑自己的 SwiGLU，结果经 all-to-all combine 送回原 GPU，按 router 概率加权求和；shared expert（dense/TP1）并行相加。",
        en:"Each expert runs its SwiGLU; results return via all-to-all combine, weighted by router probs; a shared expert (dense/TP1) is added in parallel."} },
  res2:{zh:"MLP/MoE 输出加回残差①的结果，得到这一层的输出 hidden。真实模型会堆叠很多这样的层。",
        en:"MLP/MoE output is added back to residual① → this layer's output hidden. Real models stack many such layers."},
};
const UI = {
  zh:{title:"GQA — 分组查询注意力",prev:"上一步",next:"下一步",play:"播放",pause:"暂停",
      hq:"Q头",hkv:"KV头",seq:"预测序列",inseq:"输入序列",q:"Query 头",k:"Key 头",v:"Value 头",tp:"TP",home:"首页",
      gpu:"GPU",kvrep:"KV 复制",mlp:"MLP",ep:"EP",res:"残差",topk:"top-k",dp:"DP",spec:"投机"},
  en:{title:"GQA — Grouped Query Attention",prev:"Prev",next:"Next",play:"Play",pause:"Pause",
      hq:"Q heads",hkv:"KV heads",seq:"Pred seq",inseq:"Input seq",q:"Query",k:"Key",v:"Value",mode:"Mode",tp:"TP",home:"Home",
      gpu:"GPU",kvrep:"KV replica",mlp:"MLP",ep:"EP",res:"residual",topk:"top-k",dp:"DP",spec:"Spec"},
};
UI.zh.mode = "模式";
// per-mode titles + overrides for the steps whose meaning changes with the mode
const MODES = {
  MHA:{ title:{zh:"MHA — 多头注意力",en:"MHA — Multi-Head Attention"},
    proj:{zh:"X(seq×d_model) 乘以 W_Q/W_K/W_V。MHA 中 H_kv = H_q，故 W_K/W_V 与 W_Q 等宽。（图中 d_k 用小值示意，真实 d_k≈64，d_model = H_q·d_k）",
          en:"X(seq×d_model) × W_Q/W_K/W_V. In MHA H_kv = H_q, so W_K/W_V are as wide as W_Q. (Geometry uses a small d_k; real d_k≈64, d_model = H_q·d_k.)"},
    grp:{zh:"每个 Query 头对应独立的 K/V 头，没有任何共享 —— 这是最经典、但最耗显存的形式。",
         en:"Each query head maps to its own K/V head with no sharing — the classic form, but the most memory-hungry."}},
  GQA:{ title:{zh:"GQA — 分组查询注意力",en:"GQA — Grouped Query Attention"},
    proj:{zh:"X(seq×d_model) 乘以 W_Q/W_K/W_V。GQA 中 H_kv < H_q，故 W_K/W_V 比 W_Q 窄（宽度 = H_kv·d_k）。（真实 d_k≈64，d_model = H_q·d_k）",

// place camera so the bounding sphere fits BOTH vertical and horizontal FOV
function frameCamera(){
  const aspect = innerWidth/innerHeight;
  const vFov = FOV*Math.PI/180;
  const hFov = 2*Math.atan(Math.tan(vFov/2)*aspect);
  const fit = Math.min(vFov, hFov);           // tighter axis decides distance
  const dist = (BOUND/Math.sin(fit/2)) * 0.9; // fill more of the screen
  // preserve the user's current view direction; use the iso default only on first load
  const dir = viewInit
    ? new THREE.Vector3().subVectors(camera.position, controls.target).normalize()
    : new THREE.Vector3(0.32, 0.72, 0.62).normalize(); // raised, flatter 3D view
  viewInit = true;
  camera.position.copy(controls.target).addScaledVector(dir, dist);
  camera.near = Math.max(0.1, dist - BOUND*2);
  camera.far  = dist + BOUND*2.5;
  camera.updateProjectionMatrix();
  controls.update();
}

function gizmoAxis(dir, color, letter){

// W/S = forward/back along the view direction (screen-relative), A/D = strafe left/right,
// Q/E = down/up in world Y. Moves camera + target together (a pan/dolly), damped by OrbitControls.
const keys = Object.create(null);
function keyIsTyping(t){ return t && (t.tagName==="SELECT"||t.tagName==="INPUT"||t.tagName==="TEXTAREA"); }
addEventListener("keydown", e=>{ if(keyIsTyping(e.target)) return;
  const k=e.key.toLowerCase(); if("wasdqe".includes(k)){ keys[k]=true; e.preventDefault(); } });
addEventListener("keyup",   e=>{ const k=e.key.toLowerCase(); if(k in keys) keys[k]=false; });

function applyKeyPan(dt){
  const anyKey = keys.w||keys.a||keys.s||keys.d||keys.q||keys.e;
  if(!anyKey) return;
  const speed = BOUND * 0.9 * dt;                       // scale with scene size → consistent feel
  const fwd = new THREE.Vector3().subVectors(controls.target, camera.position);
  fwd.y = 0; if(fwd.lengthSq()<1e-6) fwd.set(0,0,-1); fwd.normalize();  // ground-plane forward
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
  const move = new THREE.Vector3();
  if(keys.w) move.addScaledVector(fwd,  speed);
  if(keys.s) move.addScaledVector(fwd, -speed);
  if(keys.d) move.addScaledVector(right,  speed);
  if(keys.a) move.addScaledVector(right, -speed);
  if(keys.e) move.y += speed;
  if(keys.q) move.y -= speed;
  camera.position.add(move); controls.target.add(move);
}

  // at framing time; pinch-zoom (mobile) / dolly moves the camera closer without updating them, so a
  // stale far-out near plane would clip blocks you zoom INTO before you can see them. Clamp near to a
  // small value when zoomed in close so nearby cubes stay visible.
  { const d = camera.position.distanceTo(controls.target);
    const near = Math.max(0.02, d - BOUND*2), far = d + BOUND*2.5;
    if(near!==camera.near || far!==camera.far){ camera.near=near; camera.far=far; camera.updateProjectionMatrix(); } }

}

const GPU_COLS = [0x4ea1ff, 0xf0a44a, 0x57d977, 0xc678dd, 0xe5484d, 0x39c5cf, 0xe0b341, 0xff8fab];

const boxGeo = new THREE.BoxGeometry(1,1,1);
function mat(color,opacity){ return new THREE.MeshStandardMaterial(
  {color, roughness:1.0, metalness:0.0, transparent:true, opacity:opacity??1,
   emissive:color, emissiveIntensity:0.0}); }

// a panel of stacked cells = one "head": `rows` tall (Y), `cols` wide.
// axis='x' spreads columns along X (compact heads); axis='z' spreads them along Z (wide matrices).
function makeHead(color, rows, w, cols, axis, perCell){
  const g = new THREE.Group();
  const nc = cols??1;
  const cw = nc>1 ? 0.55 : (w??0.9);   // narrower cells when it's a real grid
  const gap = nc>1 ? 0.62 : 1.0;       // column spacing
  const alongZ = axis==='z';
  // perCell: each cube gets its OWN material + a {mesh,mat,i:row,j:col} record, so rows can be
  // revealed/dimmed independently (used by the OFF-decode KV-cache growth). Else one shared mat.
  const shared = perCell ? null : mat(color,1);
  const cells = [];
  for(let r=0;r<rows;r++) for(let c=0;c<nc;c++){
    const m = perCell ? mat(color,1) : shared;
    const cell = new THREE.Mesh(boxGeo, m);
    const off = (c-(nc-1)/2)*gap;
    cell.scale.set(alongZ?0.6:cw, 0.92, alongZ?cw:0.6);
    cell.position.y = (r-(rows-1)/2)*1.0;
    if(alongZ) cell.position.z = off; else cell.position.x = off;
    g.add(cell); if(perCell) cells.push({mesh:cell, mat:m, i:r, j:c});
  }
  if(perCell) g.userData.cells = cells; else g.userData.mat = shared;
  return g;
}

// small rotary glyph marking where RoPE is applied (to Q and K, before QKᵀ). A pink ring of cubes
// suggesting rotation; sits just above the head it annotates. Shares one material for cheap fade.
function makeRope(scale){
  const g = new THREE.Group(); const m = mat(COL.rope,1); const s = scale??1;
  const N = 8, R = 0.5*s;
  for(let i=0;i<N;i++){ const a = i/N*Math.PI*2;
    const c = new THREE.Mesh(boxGeo, m); c.scale.setScalar(0.14*s);
    c.position.set(Math.cos(a)*R, Math.sin(a)*R, 0); g.add(c); }
  g.userData.mat = m; return g;
}

// a rows x cols matrix. orient='flat' lies on the ground (rows along Z, cols along X) —
// used for the seq x seq score/weight grids read from above. orient='stand' stands upright
// (rows along Y, cols along Z) — used for the projection weights so their width = cols reads.
// perCell=true gives each cell its own material (needed for the reveal animation); otherwise
// all cells share one material (far cheaper for the big weight matrices).
// blockCols: if set, insert a gap every `blockCols` columns so per-head blocks are countable
// (W_Q → H_q blocks of d_k; W_K/W_V → H_kv blocks). Matches SGLang q_size/kv_size = heads·d_k.
// blockColor(i,j): optional → returns a hex per cell so weight matrices can be tinted by the
// owning GPU rank (ColumnParallel = colour by column-block, RowParallel = by row-block).
// Same colour reuses one material; all block materials live in userData.mats for anim.
// divs (optional): draw GPU-partition separator lines as children of the matrix group so they
// scale/fade with it. {axis:'col'|'row', at:[boundary indices]} — 'col'=vertical (col-parallel),
// 'row'=horizontal (row-parallel). Lines land on the mid-point between the two bordering cells.
function makeMatrix(rows, cols, color, orient, perCell, blockCols, spacing, blockColor, divs){
  const g = new THREE.Group();
  const cells = [];
  const stand = orient==='stand';
  const shared = perCell ? null : (blockColor ? null : mat(color,1));
  const matCache = new Map();                    // hex → shared material (for blockColor mode)
  const blockMat = hex => { let m=matCache.get(hex); if(!m){ m=mat(hex,1); matCache.set(hex,m);} return m; };
  const sp = stand ? 0.62 : (spacing??1.0);       // flat: caller supplies spacing to avoid overlap
  const bc = blockCols||0, gap = 0.55;           // extra space between head-blocks
  // column offset with inter-block gaps folded in, then re-centred
  const colX = j => j*sp + (bc? Math.floor(j/bc)*gap : 0);
  const lastX = colX(cols-1), midX = lastX/2;
  for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){
    const m = perCell ? mat(color,1) : (blockColor ? blockMat(blockColor(i,j)) : shared);
    const c = new THREE.Mesh(boxGeo, m);
    const rOff = (i-(rows-1)/2), cOff = colX(j) - midX;
    if(stand){ c.scale.set(0.44,0.44,0.44); c.position.set(0, rOff*sp, cOff); }
    else     { c.scale.set(0.78,0.3,0.78); c.position.set(cOff, 0, rOff*1.0); }
    g.add(c); cells.push({mesh:c, mat:m, i, j});
  }
  // GPU partition dividers (standing matrices only). Push to +X so they float in FRONT of the
  // flat cube sheet (else an in-plane line is hidden by cube faces — esp. the row dividers, whose
  // row gaps are far narrower than the column-block gaps). Extend a bit past the sheet edges too.
  if(divs && stand){
    const xf = 0.35;                                        // forward offset, clears cube half-thickness 0.22
    const yHalf = (rows-1)/2*sp + 0.5, zHalf = midX + 0.5;
    divs.at.forEach(k=>{
      if(divs.axis==='col'){                       // vertical line between col k-1 and k
        const z = (colX(k-1)+colX(k))/2 - midX;
        g.add(line(new THREE.Vector3(xf,-yHalf,z), new THREE.Vector3(xf,yHalf,z), 0xeaf0f8, 0.9));
      } else {                                     // horizontal line between row k-1 and k
        const y = (k-0.5-(rows-1)/2)*sp;
        g.add(line(new THREE.Vector3(xf,y,-zHalf), new THREE.Vector3(xf,y,zHalf), 0xeaf0f8, 0.9));
      }
    });
  }
  if(perCell)        g.userData.cells = cells;   // animated per-cell
  else if(blockColor)g.userData.mats  = [...matCache.values()]; // several block materials
  else               g.userData.mat   = shared;  // single material → use setEmissive/opacity
  return g;
}

// AdditiveBlending: a line's colour is ADDED to the dark background, so a low-opacity line
// reads as a faint glow of its own colour — never darkening toward black the way normal
// alpha blending does on a dark bg. depthWrite:false keeps overlapping lines from culling.
function line(a, b, color, opacity){
  const geo = new THREE.BufferGeometry().setFromPoints([a,b]);
  const m = new THREE.LineBasicMaterial({color, transparent:true, opacity:opacity??0.5,
    blending:THREE.AdditiveBlending, depthWrite:false});
  return new THREE.Line(geo, m);
}

function addArcFlow(x1,y1,z1, x2,y2,z2, color, lift){

}
// ---------- build GQA layout ----------
let cfg = { Hq:8, Hkv:8, seq:4, inSeq:4, dim:2, mode:"MHA", tp:1, // seq=预测/草稿块长; inSeq=输入prompt长; dim=d_k
  mlp:"DENSE", ep:2, topk:2, dp:1, spec:"OFF" };         // MLP + EP + top-k + DP + speculative method
let parts = null; // holds groups/meshes we animate
let CUR = null;   // phase currently being built; module-level so buildLayerRight/IO (module fns) see it
let SEQ = 0;      // current phase's sequence length: prefill = PROMPT_LEN (whole prompt), decode = cfg.seq (draft block)

function clearRoot(){ while(root.children.length) root.remove(root.children[0]); }

function build(){
  clearRoot();
  const {Hq,Hkv,seq,inSeq,dim} = cfg;
  const perGroup = Hq/Hkv;
  const dmodel = Hq*dim;          // d_model = H_q · d_k
  const kvWidth = Hkv*dim;        // width of K/V projections (shrinks with H_kv) — the GQA/MQA point
  const dp = cfg.dp||1;           // data-parallel degree: one attention lane per DP rank
  // Each phase bag holds lanes[d] (a DP rank's attention pipeline), laneTails[d] (res2/output),
  // moe (shared MoE tail), and io (per-lane speculative shell: prompt/draft/candidates/accept/
  // loop + draft-extend). `group` (which KV group to highlight) is global across lanes.
  // TWO "floors": ① prefill (top) · ② decode (bottom, self-looping = the decode iteration).
  // Each phase is a self-contained bag
  // (its own THREE.Group offset in Y + its own lanes/laneTails/moe/io). The builders write
  // into the current phase `CUR`; the animation iterates parts.phases. `group` (which KV
  // group to highlight) stays global so both floors highlight the same group in sync.
  parts = { phases:[], group:0, labels:[], mtpIter:0, mtpAnim:0 };  // mtpIter = recursion iteration (0=gold only, 1..3=drafts); mtpAnim = per-iteration sub-clock for the 4-phase reveal
  CUR = null; DEX_MAX = 0;   // reset module-level phase pointer + draft-extend right edge
  function makePhase(name, y){
    const g=new THREE.Group(); g.position.set(0,y,0); root.add(g);
    return { name, y, root:g, lanes:[], laneTails:[], moe:null, seqLen:0, floor:0,
             // MODULAR floor I/O (per DP lane, indexed [d]):
             io:{ candIn:[], embeds:[], inFlows:[],       // sub 0: input block (prompt / prev-floor out) → embed → X
                  lmParts:[], lmFlows:[], accepts:[],      // sub 11 head: floor 0 → lm_head→logits→bonus; floors 1+ → accept row
                  mtpBlocks:[], drafts:[], recArrows:[],   // sub 12 MTP tail: step blocks + wiring
                  candOut:[], frozenKVs:[], bonusLinks:[], // sub 12 output: this floor's [gold+blue×(n-1)] block; bonusLinks = main-model bonus → MTP seed (same token)
                  downFlows:[] } };                        // connector: candOut(this) → candIn(next floor)
  }

  const GAP = 1.5;
  const standTop = r => r*0.62/2 + GAP; // top of a standing matrix + uniform gap
  const dTop    = standTop(dmodel);
  const headLY  = seq/2 + GAP;          // above a `seq`-row head
  const flatLY  = 0.2  + GAP;           // above a flat (thin) matrix

  // label added to the CURRENT phase's group (rides with its floor); `owner` drives focus
  // opacity; y is local-Y within the floor. Falls back to root before any phase is active.
  const addLabel = (txt, x, z, hex, owner, y)=>{ const s=makeLabel(txt, hex);
    s.position.set(x, y??dTop, z||0); (CUR?CUR.root:root).add(s);
    parts.labels.push({sp:s, owner}); return s; };
  // label parented to a group (scales with it); ly is local-y offset from group centre
  const addChildLabel = (grp, txt, ly, hex)=>{ const s=makeLabel(txt, hex);
    s.position.set(0, ly, 0); grp.add(s);
    parts.labels.push({sp:s, owner:grp}); return s; };

  // ---- uniform pipeline: 12 stages equally spaced along the central axis ----
  const PITCH = 5, X0 = -27.5;      // 12 slots × 5 ≈ 55 wide, centred near origin
  const slot = i => X0 + i*PITCH;
  // 0:X 1:W_Q 2:W_K 3:W_V 4:Q 5:K 6:V 7:scores 8:softmax 9:context 10:W_O 11:Output

  // ---- tensor-parallel rank helpers (shared by weights and heads; identical per lane) ----
  const tp = cfg.tp||1, qPerGpu = Hq/tp;          // each GPU owns qPerGpu contiguous Q heads
  const kvSplit = Hkv >= tp, kvPerGpu = kvSplit ? Hkv/tp : 0;
  const qRankColor  = h => GPU_COLS[Math.floor(h/qPerGpu) % GPU_COLS.length];       // Q head → rank colour
  const kvRankColor = g => kvSplit ? GPU_COLS[Math.floor(g/kvPerGpu) % GPU_COLS.length] : REPLICATE_COL;
  const wqCol = tp>1 ? ((i,j)=>qRankColor(Math.floor(j/dim)))  : null;
  const wkvCol= tp>1 ? ((i,j)=>kvRankColor(Math.floor(j/dim))) : null;
  const bounds = (n,per)=>{const a=[];for(let k=1;k<n;k++)a.push(k*per*dim);return a;};
  const wqDivs = tp>1 ? {axis:'col', at:bounds(tp,qPerGpu)} : null;
  const wkvDivs= (tp>1 && kvSplit) ? {axis:'col', at:bounds(tp,kvPerGpu)} : null;
  const wReplicated = tp>1 && !kvSplit;
  const wKVtag = tp<=1 ? "" : (kvSplit ? " col-parallel" : " \u590d\u5236\u00d7"+(tp/Hkv)+" replicated");
  const kvTag  = tp<=1 ? "" : (kvSplit ? " ("+kvPerGpu+"/GPU)" : " (\u590d\u5236\u00d7"+(tp/Hkv)+")");
  const qStartX = slot(4), qGap = 1.3, kX = slot(5), vX = slot(6);
  const kvSpan = (Hq*qGap) * 0.5;
  const flatSp = Math.min(1.0, (PITCH - 0.9) / Math.max(seq - 1, 1));

  // one DP lane's full attention pipeline (X → … → attn out → res1), all offset by laneZ.
  // Everything is pushed into L (a per-lane bag) rather than a global; labels get owner=L.<part>.
  function buildAttentionLane(d, laneZ){
    const L = { qHeads:[], kHeads:[], vHeads:[], shareLines:[], gpuBounds:[], ropes:[],
                input:null, wQ:null, wK:null, wV:null, scores:null, weights:null,
                ctxVec:null, wO:null, out:null, res1:null, res1Line:null };
    const Z = z => z + laneZ;   // shift a local Z into this lane's band
    // this phase's row count (prefill = PROMPT_LEN, decode = cfg.seq) + derived label/flat pitch
    const S = SEQ, hLY = S/2 + GAP, fSp = Math.min(1.0, (PITCH - 0.9) / Math.max(S - 1, 1));
    // DECODE floor: the S query tokens attend over the FULL KV cache = prefix (the prompt, already
    // prefilled) + this step's own tokens. So the key length KVN is decoupled from the query length S:
    //   · OFF   → S=1 query, cache = prefix + 1
    //   · MTP/DFlash → S=seq draft tokens (verify), cache = prefix + seq (the whole block appended)
    // Prefill floor has no prior prefix → KVN = S. Scores are S×KVN.
    const isDecode = CUR.floor===1;
    const isOffDecode = cfg.spec==="OFF" && isDecode;
    const C0 = cfg.inSeq;                                  // prefix cache length = input prompt length
    const KVN = isDecode ? C0 + S : S;                     // decode: prefix + this step's S tokens
    const kvLY = KVN/2 + GAP, kvSp = Math.min(1.0, (PITCH - 0.9) / Math.max(KVN - 1, 1));

    // input X — S × d_model
    const xg = makeHead(COL.x, S, 0.9, dmodel, 'z'); xg.position.set(slot(0),0,Z(0));
    CUR.root.add(xg); L.input=xg;
    addLabel((dp>1?"["+d+"] ":"")+"X  seq\u00d7d_model", slot(0), Z(0), 0xc4d0de, xg, hLY);

    // projection weights W_Q/W_K/W_V (ColumnParallel; K/V shrink with H_kv)
    L.wQ = makeMatrix(dmodel, dmodel,  COL.wQ, 'stand', false, dim, undefined, wqCol,  wqDivs);
    L.wK = makeMatrix(dmodel, kvWidth, COL.wK, 'stand', false, dim, undefined, wkvCol, wkvDivs);
    L.wV = makeMatrix(dmodel, kvWidth, COL.wV, 'stand', false, dim, undefined, wkvCol, wkvDivs);
    L.wQ.position.set(slot(1),0,Z(0)); CUR.root.add(L.wQ);
    L.wK.position.set(slot(2),0,Z(0)); CUR.root.add(L.wK);
    L.wV.position.set(slot(3),0,Z(0)); CUR.root.add(L.wV);
    addChildLabel(L.wQ, "W_Q ("+Hq+" heads)"+(tp>1?" col-parallel":""), dTop, 0x8fb8ff);
    addChildLabel(L.wK, "W_K ("+Hkv+")"+wKVtag, dTop, wReplicated?REPLICATE_COL:COL.k);
    addChildLabel(L.wV, "W_V ("+Hkv+")"+wKVtag, dTop, wReplicated?REPLICATE_COL:COL.v);

    // Q heads
    for(let h=0; h<Hq; h++){
      const grp = Math.floor(h/perGroup), rank = Math.floor(h/qPerGpu);
      const c = tp>1 ? GPU_COLS[rank % GPU_COLS.length]
                     : new THREE.Color().setHSL(0.58 - grp*0.12, 0.75, 0.5).getHex();
      const head = makeHead(c, S, 1.0, dim, 'z');   // d_k along Z (matches W_Q column direction)
      const qOff = (h-(Hq-1)/2)*qGap;
      head.position.set(qStartX, 0, Z(qOff));
      head.userData.group = grp; head.userData.rank = rank;
      head.userData.spread = { axis:'z', center: laneZ, base: qOff }; // focus zoom grows head gaps too
      CUR.root.add(head); L.qHeads.push(head);
    }
    addLabel((dp>1?"["+d+"] ":"")+(tp>1 ? "Q \u00d7 "+Hq+" ("+qPerGpu+"/GPU)" : "Q \u00d7 "+Hq+" query heads"),
      qStartX, Z(0), 0x7fb2ff, L.qHeads[0], hLY);
    // RoPE applied to Q (rotary marker centred above the query stack)
    { const rp=makeRope(1.1); rp.position.set(qStartX, hLY-0.6, Z(0));
      CUR.root.add(rp); L.ropes.push(rp);
      addLabel("⟳ RoPE", qStartX, Z(0), COL.rope, rp, 0.9); }
    if(tp>1) for(let r=1; r<tp; r++){
      const bz = Z(((r*qPerGpu - 0.5) - (Hq-1)/2) * qGap);
      const ln = line(new THREE.Vector3(qStartX, -S*0.7, bz), new THREE.Vector3(qStartX, S*0.7, bz), 0xd0d8e4, 0.55);
      CUR.root.add(ln); L.gpuBounds.push(ln);
    }

    // K & V heads: one per group; share lines Q→K within each group. Same per-head Z-gap as Q
    // (qGap) so the rotated d_k-along-Z sheets don't overlap; centred on the lane.
    for(let g=0; g<Hkv; g++){
      const kvOff = (g-(Hkv-1)/2) * qGap;
      const zc = Z(kvOff);
      const kvC = tp>1 ? kvRankColor(g) : null;
      // OFF-decode: per-cell so cache rows can be revealed one-per-iteration (KV-cache growth).
      const kh = makeHead(kvC ?? COL.k, KVN, 1.0, dim, 'z', isOffDecode); kh.position.set(kX,0,zc);
      const vh = makeHead(kvC ?? COL.v, KVN, 1.0, dim, 'z', isOffDecode); vh.position.set(vX,0,zc);
      if(isOffDecode){ kh.userData.noZoom = true; vh.userData.noZoom = true; } // KV cache: no focus enlarge
      else { kh.userData.spread = { axis:'z', center: laneZ, base: kvOff };   // focus zoom grows head gaps too
             vh.userData.spread = { axis:'z', center: laneZ, base: kvOff }; }
      CUR.root.add(kh); CUR.root.add(vh); L.kHeads.push(kh); L.vHeads.push(vh);
      for(let h=g*perGroup; h<(g+1)*perGroup; h++){
        const q = L.qHeads[h];
        const ln = line(new THREE.Vector3(qStartX,0,q.position.z), new THREE.Vector3(kX,0,zc), COL.k, 0.0);
        CUR.root.add(ln); L.shareLines.push(ln);
      }
    }
    const cacheTag = isDecode ? "（KV cache：前缀 "+C0+" + "+S+"）" : "";
    addLabel((dp>1?"["+d+"] ":"")+"K \u00d7 "+Hkv+kvTag+cacheTag, kX, Z(0), COL.k, L.kHeads[0], kvLY);
    addLabel((dp>1?"["+d+"] ":"")+"V \u00d7 "+Hkv+kvTag+(isDecode?"（KV cache）":""), vX, Z(0), COL.v, L.vHeads[0], kvLY);
    // RoPE applied to K too (NOT V) — rotary marker centred above the key stack
    { const rp=makeRope(1.1); rp.position.set(kX, kvLY-0.6, Z(0));
      CUR.root.add(rp); L.ropes.push(rp);
      addLabel("⟳ RoPE", kX, Z(0), COL.rope, rp, 0.9); }

    // scores / softmax weights. Normal: S(query)×KVN(keys) flat. OFF-decode: a KVN×1 COLUMN with keys
    // running along Z (i = key index), growing DOWN the cache — same orientation/direction as the MTP
    // detail block's QKᵀ, so the reveal reads consistently across both.
    L.scores  = isOffDecode ? makeMatrix(KVN, 1, COL.cell, 'flat', true)
                            : makeMatrix(S, KVN, COL.cell, 'flat', true, null, kvSp);
    L.scores.position.set(slot(7),0,Z(0)); CUR.root.add(L.scores);
    addLabel("QK\u1d40"+(isOffDecode?"（1 query × cache）":(isDecode?"（"+S+" query × cache "+KVN+"）":"")), slot(7), Z(0), 0xe5484d, L.scores, flatLY);
    L.weights = isOffDecode ? makeMatrix(KVN, 1, COL.q, 'flat', true)
                            : makeMatrix(S, KVN, COL.q, 'flat', true, null, kvSp);
    L.weights.position.set(slot(8),0,Z(0)); CUR.root.add(L.weights);
    addChildLabel(L.weights, "softmax", flatLY, 0x7fb2ff);
    // OFF-decode growth handle: the KV cache + score/softmax strips grow +1 row/col per decode
    // iteration (revealed on the decode SUB_MTP loop step). C0 = prefix already cached at prefill end.
    if(isOffDecode) L.kvGrow = { kc:L.kHeads, vc:L.vHeads, scores:L.scores, weights:L.weights, C0, KVN };

    // context, W_O, attn out
    L.ctxVec = makeHead(COL.ctx, S, 0.9, dmodel, 'z'); L.ctxVec.position.set(slot(9),0,Z(0));
    CUR.root.add(L.ctxVec); addChildLabel(L.ctxVec, "attn_output (context)", hLY, 0xb3a9ee);
    const woRow = tp>1 ? ((i,j)=>qRankColor(Math.floor(i/dim))) : null;
    const woDivs = tp>1 ? {axis:'row', at:bounds(tp,qPerGpu)} : null;
    L.wO = makeMatrix(dmodel, dmodel, COL.wO, 'stand', false, undefined, undefined, woRow, woDivs);
    L.wO.position.set(slot(10),0,Z(0)); CUR.root.add(L.wO);
    addChildLabel(L.wO, tp>1 ? "W_O (row-parallel)" : "W_O", dTop, 0x7fd4dd);
    L.out = makeHead(COL.out, S, 0.9, dmodel, 'z'); L.out.position.set(slot(11),0,Z(0));
    CUR.root.add(L.out); addChildLabel(L.out, "attn out", hLY, COL.out);

    // residual ① = X + attn_output → S × d_model (per-rank; all-to-all happens after this)
    const r1=makeHead(COL.res, S, 0.9, dmodel, 'z'); r1.position.set(RES1_X,0,Z(0));
    CUR.root.add(r1); L.res1=r1;
    addLabel((dp>1?"["+d+"] ":"")+"\u2295 \u6b8b\u5dee\u2460", RES1_X, Z(0), COL.res, r1, hLY);
    L.res1Line=line(new THREE.Vector3(slot(11),-0.4,Z(0)), new THREE.Vector3(RES1_X,-0.4,Z(0)), COL.res, 0.0);
    CUR.root.add(L.res1Line);
    if(dp>1) addLabel("DP rank "+d, slot(0)-3.5, Z(0), 0x9aa7b8, L.input, hLY+1.6);
    return L;
  }

  // stage X-anchors for the layer tail (set here so buildAttentionLane can place res1)
  RES1_X = slot(11) + 5;
  MUP_X  = RES1_X + 5; MIN_X = MUP_X + 5; MDN_X = MIN_X + 5; RES2_X = MDN_X + 5; LOUT_X = RES2_X + 5;

  // lane stacking pitch along Z (see attention-3d): clear the widest per-lane element.
  const interW = Math.max(cfg.tp||1, Math.round(Math.round(dmodel*2.5)/(cfg.tp||1))*(cfg.tp||1));
  const laneWidest = Math.max((Hq-1)*qGap, (dmodel-1)*0.62, (interW-1)*0.62);
  const LANE_DZ = laneWidest + 4;
  const laneZ = d => (d-(dp-1)/2)*LANE_DZ;

  // build ONE full target layer into the current phase CUR (lanes + MLP/MoE tail), sized to SEQ
  function buildFullLayer(){
    const hLY = SEQ/2 + GAP;
    for(let d=0; d<dp; d++) CUR.lanes.push(buildAttentionLane(d, laneZ(d)));
    buildLayerRight(dmodel, SEQ, hLY, dTop, laneZ, addLabel, addChildLabel);
  }

  // ===== TWO floors: ① PREFILL (top) · ② DECODE (bottom) =====
  // The real request lifecycle runs the SAME target layer once at prefill (whole prompt), then
  // once per decode step (verify the draft block). Prefill's output block seeds decode; the DECODE
  // floor then self-loops (its output block → its own input) — that self-loop IS the decode
  // iteration, run over and over until an EOS/stop, drafting a fresh fixed-length block each time.
  const floorHalf = Math.max(interW*0.62/2 + 2, cfg.mlp==="MOE" ? interW*0.62/2 + 9 : 0, 12);
  const floorGap = floorHalf + 6;
  const prefill = makePhase("prefill", floorGap);
  const decode  = makePhase("decode", -floorGap);
  parts.phases = [prefill, decode];

  // TWO floors, both running the SAME target layer and emitting a candidate block
  // [gold bonus, blue draft×(n-1)] from their MTP tail.
  //   ① prefill: prompt → X → [layer] → lm_head→sample→bonus(gold) → MTP tail → out block
  //              ↓ (one-shot: prefill's output feeds decode's input)
  //   ② decode : in → X → [layer] → verify+accept(bonus gold) → MTP tail → out block
  //              ↺ (self-loop: decode's output loops back to ITS OWN input = the decode iteration)
  const floors=[prefill, decode];
  floors.forEach((P,f)=>{
    // prefill uses inSeq (prompt); decode uses seq (draft block). With spec OFF there is no draft
    // block — decode is plain autoregression: 1 query token × KV cache → 1 output token.
    CUR=P; P.floor=f; SEQ = f===0 ? inSeq : (cfg.spec==="OFF" ? 1 : seq); P.seqLen=SEQ; buildFullLayer();
    buildFloorIO(slot, SEQ, dmodel, SEQ/2+GAP, dTop, laneZ, addLabel, f);
  });
  // connectors: each floor's output candidate block → the next floor's input block (down-arrows)
  buildFloorConnectors(laneZ);
  CUR = null;

  // ---- bounding radius for camera framing (spans THREE floors in Y) ----
  // Uniform floor: leftmost = input block (IN_X = CAND_X = PROMPT_X, left of embed); rightmost =
  // this floor's output candidate block / MTP unroll (DEX_MAX tracks the far-right output).
  const minX = Math.min(CAND_X, PROMPT_X)-5, maxX = Math.max(ACC_X, DEX_MAX)+5, cx = (minX+maxX)/2;
  const halfX = (maxX-minX)/2;
  const laneHalfZ = laneWidest/2 + 2;
  const dpHalfZ = (dp-1)/2*LANE_DZ + laneHalfZ;
  const halfZ = Math.max(dpHalfZ, MLP_HALFZ, 6);
  const halfY = floorGap + floorHalf;                  // top floor (+G) .. bottom floor (-G) + half
  BOUND = Math.sqrt(halfX*halfX + halfZ*halfZ + halfY*halfY);

  controls.target.set(cx, 0, 0);
  frameCamera();
}

// X positions of the appended stages (right of attn output, slot 11)
let RES1_X=0, MUP_X=0, MIN_X=0, MDN_X=0, RES2_X=0, LOUT_X=0;
let CAND_X=0, DRAFT_X=0, ACC_X=0, PROMPT_X=0, DEX_MAX=0; // candidates/draft/accept/prompt/draft-extend-right X-anchors
// embed_tokens = vocab × hidden. rows = EMB_VOCAB (vocab, schematic; real ≈15万), cols = dmodel
// (真实 hidden_size). vocab ≫ hidden → 竖着长的红色查表矩阵（vocab 沿 Y、hidden 沿 Z）。
const EMB_VOCAB=32;
let MLP_HALFZ=0; // widest Z extent of the MLP/MoE block, for camera framing

// -------- residual → MLP/MoE → residual → layer output --------
// Shapes are faithful to SGLang LlamaMLP: gate_up_proj is hidden→inter (ColumnParallel),
// down_proj is inter→hidden (RowParallel). inter > hidden, so the intermediate activation
// (seq×inter) is drawn WIDER than the seq×d_model hidden heads → the expand/contract reads.
// DP: Dense builds a full independent MLP tail per lane; MoE builds ONE shared experts block
// (centred at z=0) that all lanes all-to-all into, with per-lane gate + res2/output.
function buildLayerRight(dmodel, seq, headLY, dTop, laneZ, addLabel, addChildLabel){
  const tp=cfg.tp||1, dp=cfg.dp||1;
  // inter (MLP intermediate) drives BOTH gate_up width and down_proj height. Kept at ×1.5 so it still
  // reads as an expansion over hidden, but stays clearly SHORTER than the vocab matrix (EMB_VOCAB=32).
  let inter = Math.round(dmodel*1.5); inter = Math.max(tp, Math.round(inter/tp)*tp);
  const interTop = inter*0.62/2 + 1.5;   // label height above the down_proj matrix
  MLP_HALFZ = inter*0.62/2 + 2;
  const tokY=i=>(i-(seq-1)/2)*1.0;

  // ===== residual ②  +  layer output for one lane d (per-rank tail, at laneZ) =====
  // Returns {res2, lout, res2Line, res2ArcFrom}. Built for BOTH Dense and MoE (per-rank).
  function buildLaneTail(d){
    const dz = laneZ(d);
    const r2=makeHead(COL.res, seq, 0.9, dmodel, 'z'); r2.position.set(RES2_X,0,dz);
    CUR.root.add(r2);
    addLabel((dp>1?"["+d+"] ":"")+"\u2295 \u6b8b\u5dee\u2461", RES2_X, dz, COL.res, r2, headLY);
    // skip arc: hidden bypassing MLP/MoE, from this lane's res1 to res2 (dips below axis)
    const r2Line=arc(new THREE.Vector3(RES1_X,-0.4,dz), new THREE.Vector3(RES2_X,-0.4,dz), COL.res, 0.0, -3.4);
    CUR.root.add(r2Line);
    const lout=makeHead(COL.lout, seq, 0.9, dmodel, 'z'); lout.position.set(LOUT_X,0,dz);
    CUR.root.add(lout);
    addLabel((dp>1?"["+d+"] ":"")+"layer output", LOUT_X, dz, COL.lout, lout, headLY);
    const tail={res2:r2, lout, res2Line:r2Line};
    CUR.laneTails[d]=tail; return tail;
  }

  if(cfg.mlp==="DENSE"){
    // Each DP lane is a fully independent Transformer layer → its own MLP tail.
    const iPer = inter/tp;
    const iBounds = ()=>{const a=[];for(let k=1;k<tp;k++)a.push(k*iPer);return a;};
    const wUpCol = tp>1 ? ((i,j)=>GPU_COLS[Math.floor(j/iPer)%GPU_COLS.length]) : null; // col-parallel
    const wUpDivs= tp>1 ? {axis:'col', at:iBounds()} : null;
    const wDnRow = tp>1 ? ((i,j)=>GPU_COLS[Math.floor(i/iPer)%GPU_COLS.length]) : null; // row-parallel
    const wDnDivs= tp>1 ? {axis:'row', at:iBounds()} : null;
    const dnRowY = r => ((r*iPer + iPer/2 - 0.5) - (inter-1)/2)*0.62;

    for(let d=0; d<dp; d++){
      const dz=laneZ(d), M={};
      // gate_up_proj: standing weight hidden(rows) × inter(cols) → wider than W_Q
      M.wUp = makeMatrix(dmodel, inter, COL.wUp, 'stand', false, undefined, undefined, wUpCol, wUpDivs);
      M.wUp.position.set(MUP_X,0,dz); CUR.root.add(M.wUp);
      addChildLabel(M.wUp, tp>1?"gate_up_proj col-parallel":"gate_up_proj (hidden\u2192inter)", dTop, 0x8fb8ff);
      // SiluAndMul → seq × inter (wider than hidden heads)
      M.interAct = makeHead(COL.inter, seq, 0.9, inter, 'z'); M.interAct.position.set(MIN_X,0,dz);
      CUR.root.add(M.interAct); addChildLabel(M.interAct, "SiluAndMul \u2192 seq\u00d7inter", headLY, COL.inter);
      // down_proj: standing weight inter(rows) × hidden(cols) → taller than W_Q
      M.wDn = makeMatrix(inter, dmodel, COL.wDn, 'stand', false, undefined, undefined, wDnRow, wDnDivs);
      M.wDn.position.set(MDN_X,0,dz); CUR.root.add(M.wDn);
      addChildLabel(M.wDn, tp>1?"down_proj row-parallel+AllReduce":"down_proj (inter\u2192hidden)", interTop, 0x7fd4dd);
      // AllReduce lines from each rank's down_proj row-block centre → this lane's res2
      M.arLines=[]; if(tp>1) for(let r=0;r<tp;r++){ const l=line(new THREE.Vector3(MDN_X,dnRowY(r),dz),
        new THREE.Vector3(RES2_X,0,dz), COL.comm, 0.0); CUR.root.add(l); M.arLines.push(l); }
      const tail=buildLaneTail(d); tail.mlp=M;
    }
    CUR.moe=null;
    return;
  }

  // ===== MoE: ONE shared experts block (centred z=0); lanes all-to-all into it =====
  const NE=8, ep=cfg.ep, perRank=NE/ep;
  const topk=Math.min(cfg.topk||2, NE);
  // enlarged experts: bigger blocks + wider Z fan. eUX/eTh kept so the X extent (±(eUX+eTh/2)
  // ≈ ±3.85) still clears gate (MUP_X) and res2 (RES2_X), each ~7.5 away → ~3.3 gap each side.
  const eZ = 6.0, zOf = e => (e-(NE-1)/2)*eZ, eUX = 3.3;
  const mI = 4.2, hI = 2.0, sI = 2.0, eTh = 1.1;
  const expX=(MUP_X+RES2_X)/2;                 // experts centred between gate and res2 in X
  const experts=new THREE.Group(); experts.position.set(expX,0,0);
  const expCells=[], expAnchor=[];
  for(let e=0;e<NE;e++){
    const rank=Math.floor(e/perRank), col=GPU_COLS[rank%GPU_COLS.length], z=zOf(e);
    const up =cube(col);       up.scale.set(eTh,hI,mI);  up.position.set(-eUX,0,z); // gate_up weight → wide
    const mid=cube(COL.inter); mid.scale.set(eTh,sI,mI); mid.position.set(0,0,z);    // moe_inter activation → wide (green)
    const dn =cube(col);       dn.scale.set(eTh,mI,hI);  dn.position.set(eUX,0,z);   // down weight → tall
    experts.add(up,mid,dn);
    expCells.push({mesh:up,mat:up.userData.mat},{mesh:mid,mat:mid.userData.mat},{mesh:dn,mat:dn.userData.mat});
    expAnchor.push({up:new THREE.Vector3(expX-eUX,0,z), dn:new THREE.Vector3(expX+eUX,0,z)});
  }
  if(ep>1) for(let r=1;r<ep;r++){ const bz=(zOf(r*perRank-1)+zOf(r*perRank))/2;
    experts.add(line(new THREE.Vector3(-eUX-0.8,0,bz), new THREE.Vector3(eUX+0.8,0,bz), 0xd0d8e4, 0.5)); }
  experts.userData.cells=expCells; CUR.root.add(experts);
  addLabel(NE+" routed experts \u00b7 top-k("+topk+")/token \u00b7 EP ("+perRank+"/GPU\u00d7"+ep+")"+(dp>1?" \u00b7 shared across "+dp+" DP ranks":""),
    expX, 0, 0x8fb8ff, experts, mI/2+2.0);

  const routeOf=i=>{ const a=[]; for(let k=0;k<topk;k++) a.push((i*2+k*3)%NE); return a; };
  const MO={ experts, shareds:[], gates:[], dispatch:[], combine:[], sharedLines:[] };
  // shared expert is REPLICATED per DP rank (each independent MoE forward has its own copy;
  // it fires for every token of that rank, no routing). So DP>1 → one shared block per lane,
  // sitting below that lane's band. Routed experts stay a single EP-sharded central block.
  // shared replica hangs below its lane in Y. Clear the lane's tallest Y element: standing
  // matrices reach ±inter*0.62/2 (down_proj is inter-tall), so drop below that + margin.
  const shDrop = -( inter*0.62/2 + mI/2 + 2.5 );
  for(let d=0; d<dp; d++){
    const dz=laneZ(d);
    // per-lane gate (hidden→NE)
    const gate = makeMatrix(dmodel, NE, COL.router, 'stand', false, undefined, undefined, null, null);
    gate.position.set(MUP_X,0,dz); CUR.root.add(gate); MO.gates.push(gate);
    addChildLabel(gate, (dp>1?"["+d+"] ":"")+"gate\u2192top-k("+topk+")", dTop, COL.router);
    // all-to-all dispatch (this lane's tokens → central experts) and combine (→ this lane's res2)
    for(let i=0;i<seq;i++) for(const e of routeOf(i)){ const a=expAnchor[e];
      const l=line(new THREE.Vector3(RES1_X,tokY(i),dz), a.up, COL.comm, 0.0); CUR.root.add(l); MO.dispatch.push(l); }
    for(let i=0;i<seq;i++) for(const e of routeOf(i)){ const a=expAnchor[e];
      const l=line(a.dn, new THREE.Vector3(RES2_X,tokY(i),dz), COL.comm, 0.0); CUR.root.add(l); MO.combine.push(l); }
    // this lane's own shared-expert replica (dense SwiGLU): SAME Z band as the lane (z=dz),
    // dropped below the axis in Y so it hangs under that lane's pipeline. shDrop is a fixed
    // negative Y (not a Z offset) — clears the lane's heads/MLP which sit around y≈0.
    const shX = expX, shZ = dz;
    const shared=new THREE.Group(); shared.position.set(shX,shDrop,shZ); const shCells=[];
    const su=cube(COL.shared); su.scale.set(eTh,hI,mI); su.position.set(-eUX,0,0);
    const sm=cube(COL.inter);  sm.scale.set(eTh,sI,mI); sm.position.set(0,0,0);
    const sd=cube(COL.shared); sd.scale.set(eTh,mI,hI); sd.position.set(eUX,0,0);
    shared.add(su,sm,sd);
    shCells.push({mesh:su,mat:su.userData.mat},{mesh:sm,mat:sm.userData.mat},{mesh:sd,mat:sd.userData.mat});
    shared.userData.cells=shCells; CUR.root.add(shared); MO.shareds.push(shared);
    addLabel((dp>1?"["+d+"] ":"")+"shared expert (dense · all tokens)", shX, shZ, COL.shared, shared, shDrop+mI/2+1.5);
    // this lane's tokens → its own shared replica → back to its res2, all within z=dz band
    for(let i=0;i<seq;i++){
      const li=line(new THREE.Vector3(RES1_X,tokY(i),dz), new THREE.Vector3(shX-eUX,shDrop,shZ), COL.shared, 0.0);
      const lo=line(new THREE.Vector3(shX+eUX,shDrop,shZ), new THREE.Vector3(RES2_X,tokY(i),dz), COL.shared, 0.0);
      CUR.root.add(li); CUR.root.add(lo); MO.sharedLines.push(li,lo);
    }
    buildLaneTail(d);
  }
  CUR.moe=MO;
  // central experts' Z fan; shared replicas share the lane Z bands (already in dpHalfZ)
  MLP_HALFZ = Math.max(MLP_HALFZ, NE*eZ/2 + 2);
}

// ===== UNIFORM per-floor speculative I/O (downward pipeline) =====
// Every floor f runs the SAME target layer and has the SAME shape, left→right:
//   sub 0  input : candIn block (floor 0 = prompt; floors 1+ = the floor-above's OUTPUT block)
//                  → embed_tokens (vocab×hidden gather) → X  (candidates ARE the layer input)
//   sub 1-10 inner: the target transformer layer (attn + MLP/MoE) — reused verbatim
//   sub 11 head : floor 0 → lm_head→logits→sample→bonus(gold);  floors 1+ → verify+accept row
//   sub 12 mtp  : MTP/DFlash tail reads THIS layer's output hidden and appends blue draft tokens,
//                 producing this floor's OUTPUT block candOut = [gold bonus, blue draft×(seq-1)].
// buildFloorConnectors then links candOut(f) → candIn(f+1) with a downward arc (the pipeline).
function buildFloorIO(slot, seq, dmodel, headLY, dTop, laneZ, addLabel, floor){
  const dp=cfg.dp||1, spec=cfg.spec, sp=1.0, io=CUR.io;
  const isPrefill = floor===0;
  // `seq` = this floor's input/X row count (prefill = whole prompt = PROMPT_LEN; decode = cfg.seq).
  // `dseq` = the MTP DRAFT-BLOCK length = num_draft_tokens (FIXED = cfg.seq), independent of prompt
  // length. Both floors' MTP tail therefore draft the SAME-length block; prefill's output block
  // (dseq long) feeds decode's input (also dseq) — lengths must match for the pipeline to connect.
  const dseq = cfg.spec==="OFF" ? 1 : cfg.seq;   // OFF: no draft block → output is a single token
  const IN_X  = slot(0) - 9;             // input candidate block (left of embed)
  const EMB_X = slot(0) - 4.5;           // embed_tokens between input block and X
  const ACC_HEAD_X = LOUT_X + 5;         // head zone (accept row on decode floors)
  const NST = Math.max(1, dseq-1);       // MTP draft steps = num_draft_tokens-1 (FIXED)
  // Head zone width differs by floor: the prefill head is a WIDE lm_head matrix + logits column
  // (reaches ~LOUT_X+8), the decode head is just a thin accept-token row (~LOUT_X+5). Start the
  // MTP tail clear of it — else on prefill the lm_head/logits and the MTP c0 anchor overlap.
  // OFF uses the wide lm_head/logits head on BOTH floors (plain autoregression), so reserve the
  // wide span there too — else the decode accept-row width (5) would collide with the logits column.
  const headW  = (isPrefill || spec==="OFF") ? 15 : 5;  // X span reserved for the head before the tail
  const MTP0_X = LOUT_X + headW + 4;     // MTP block (right of the head zone; snug after the bonus token)
  // MTP: the single physical MTP layer drawn in FULL detail (same style as the main model,
  // one size smaller). It recurses n-1 steps (weight-shared) shown as a self-loop, not repeated blocks.
  const DETAIL_W = 22*2.5*0.55;          // detail block world width upper bound (≤22 slots × P × S)
  // candOut output block: sit just past the MTP draft token (otWX ≈ MTP0_X+DETAIL_W) / the DFlash box.
  // OFF: no MTP/DFlash tail — the output token sits right after the logits column (LOUT_X+13),
  // snug (+3), so the argmax→output line is short. MTP/DFlash push it past their tail block.
  const OUT_X  = spec==="OFF" ? LOUT_X + 16
               : spec==="MTP" ? MTP0_X + DETAIL_W + 2 : MTP0_X + 6;
  const tokY = i => (i-(seq-1)/2)*1.0;
  // module-level anchors for camera framing (leftmost input .. rightmost output)
  CAND_X = IN_X; PROMPT_X = IN_X; ACC_X = ACC_HEAD_X; DRAFT_X = MTP0_X;
  DEX_MAX = Math.max(DEX_MAX, OUT_X + 3);
  // uniform label placement: every label sits LGAP above ITS OWN block's top edge, so the
  // text-to-block distance is identical regardless of block height.
  const LGAP=1.5;
  const embTop=(EMB_VOCAB-1)/2*0.62 + 0.22 + LGAP; // top of a standing vocab matrix + gap
  const rowTop=0.36 + LGAP;                        // top of a 1-cube token row + gap
  const headTop=(seq-1)/2 + 0.46 + LGAP;           // top of a seq-row head + gap

  // DETAILED first MTP block: a compact full mini-transformer (embed → eh_proj → attention →
  // MLP/MoE → lm_head → logits → draft token), matching the main model's detail but scaled down.
  // Built in LOCAL coords then scaled+positioned; returns local anchors + scale for world wiring.
  function mtpDetailBlock(bx, dz, showSeed){
    const S=0.55, P=2.5, g=new THREE.Group(); g.position.set(bx,0,dz); g.scale.setScalar(S);
    const cells=[], flows=[];
    // head counts EXACTLY match the backbone (Hq/Hkv/d_k all follow cfg) — MTP is architecturally
    // the backbone's layer N+1, so its attention shape is identical. Only EV (vocab) stays a small
    // illustrative value since embed_tokens/lm_head are BORROWED from the target (size ≠ head count).
    const dim=cfg.dim, Hq=cfg.Hq, Hkv=cfg.Hkv;
    const dm=Hq*dim, kvW=Hkv*dim, EV=8;
    // TP: clamp the real tp to what these compact head counts allow (must divide Hq).
    let tp=cfg.tp||1; while(tp>1 && Hq%tp!==0) tp--;
    const qPer=Hq/tp, kvSplit=Hkv>=tp, kvPer=kvSplit?Hkv/tp:0;
    const qRank=h=>GPU_COLS[Math.floor(h/qPer)%GPU_COLS.length];
    const kvRank=gI=>kvSplit?GPU_COLS[Math.floor(gI/kvPer)%GPU_COLS.length]:REPLICATE_COL;
    const wqCol = tp>1?((i,j)=>qRank(Math.floor(j/dim))):null;
    const wkvCol= tp>1?((i,j)=>kvRank(Math.floor(j/dim))):null;
    const bnd=(n,per)=>{const a=[];for(let k=1;k<n;k++)a.push(k*per*dim);return a;};
    const wqDivs = tp>1?{axis:'col',at:bnd(tp,qPer)}:null;
    const wkvDivs= (tp>1&&kvSplit)?{axis:'col',at:bnd(tp,kvPer)}:null;
    const wRep = tp>1&&!kvSplit;
    // slot→x. Slots ≥3 are pushed one pitch right to open a FULL-pitch gap between eh_proj (slot 2)
    // and W_Q (slot 3); the hidden-state node sits exactly in that gap's middle → uniform P spacing.
    const X=i=>(i>=3?i+1:i)*P, hsX=(2+3+1)/2*P, add=o=>{ g.add(o); return o; };
    const pushMat=m=>{ if(m.userData.mat)cells.push({mat:m.userData.mat});
      if(m.userData.mats)m.userData.mats.forEach(x=>cells.push({mat:x}));
      if(m.userData.cells)m.userData.cells.forEach(c=>cells.push({mat:c.mat})); };
    const lab=(txt,x,top,hex)=>{ const s=makeLabel(txt,hex); s.position.set(x,top,0);
      g.add(s); parts.labels.push({sp:s,owner:g}); };
    const flow=(x1,y1,x2,y2,c)=>{ const l=line(new THREE.Vector3(x1,y1,0),new THREE.Vector3(x2,y2,0),c,0.0);
      g.add(l); flows.push(l); return l; };
    // 0: prev token (bonus/prev draft) — the recursion input. On prefill the main-model bonus cube IS
    // this seed (drawn outside, linked in), so we skip drawing a duplicate here (showSeed=false).
    if(showSeed){ const it=cube(COL.bonus); it.scale.set(0.7,0.7,0.7); it.position.set(X(0),-1.6,0); add(it);
      cells.push({mat:it.userData.mat}); }
    // 1: embed_tokens (vocab×hidden, borrowed from target)
    const em=makeMatrix(EV,dm,COL.embed,'stand',false); em.position.set(X(1),0,0); add(em); pushMat(em);
    lab("embed_tokens (借 target)", X(1), EV/2*0.62+0.9, COL.embed);
    if(showSeed) flow(X(0),-1.6, X(1),0, COL.embed);   // seed token → embed (only when seed cube exists)
    // 2: eh_proj / fc (2·hidden×hidden) — plain Linear, REPLICATED per rank (grey when tp>1)
    const eh=makeMatrix(dm*2,dm, tp>1?REPLICATE_COL:COL.draftBox,'stand',false); eh.position.set(X(2),0,0); add(eh); pushMat(eh);
    lab("eh_proj(fc): cat(embed,hidden)"+(tp>1?" 每卡复制":""), X(2), dm*0.62+0.9, 0x8fb8ff);
    flow(X(1),0, X(2),0, COL.embed);
    // 2.5: hidden state — eh_proj output, 1 token × d_model (1 row along Y, d_model along Z), the
    // attention input X. Same shape/orientation as the backbone's input hidden state.
    const hs=makeHead(COL.x,1,0.9,dm,'z'); hs.position.set(hsX,0,0); add(hs);
    if(hs.userData.mat) cells.push({mat:hs.userData.mat});
    lab("hidden 1×d_model", hsX, 1.0, COL.x);
    flow(X(2),0, hsX,0, COL.draftBox);
    // 3/4/5: W_Q / W_K / W_V — separate standing matrices, per-head block gaps + TP tint + dividers
    const wQ=makeMatrix(dm,dm ,COL.wQ,'stand',false,dim,undefined,wqCol ,wqDivs ); wQ.position.set(X(3),0,0); add(wQ); pushMat(wQ);
    const wK=makeMatrix(dm,kvW,COL.wK,'stand',false,dim,undefined,wkvCol,wkvDivs); wK.position.set(X(4),0,0); add(wK); pushMat(wK);
    const wV=makeMatrix(dm,kvW,COL.wV,'stand',false,dim,undefined,wkvCol,wkvDivs); wV.position.set(X(5),0,0); add(wV); pushMat(wV);
    lab("W_Q ("+Hq+"头)"+(tp>1?" 列并行":""), X(3), dm*0.62+0.9, 0x8fb8ff);
    lab("W_K ("+Hkv+")"+(wRep?" 复制":(tp>1?" 列并行":"")), X(4), dm*0.62+0.9, wRep?REPLICATE_COL:COL.k);
    lab("W_V ("+Hkv+")"+(wRep?" 复制":(tp>1?" 列并行":"")), X(5), dm*0.62+0.9, wRep?REPLICATE_COL:COL.v);
    flow(hsX,0, X(3),0, COL.draftBox); flow(hsX,0, X(4),0, COL.draftBox); flow(hsX,0, X(5),0, COL.draftBox);
    // 6/7/8/9/10/11: AUTOREGRESSIVE DECODE attention. Each recursion step drafts ONE token, so the
    // QUERY is a single row (Hq heads). K/V are the KV CACHE = C context rows + the draft tokens so
    // far (grows along Y). QKᵀ/softmax are a 1×(C+k) score strip (one score per cached key) that
    // GROWS one row per step. context = softmax·V = 1 token × d_model. Manual stepping walks k.
    const C = seq, Ctot = C + dseq;                       // cache: C context + up to dseq drafts
    const hZ=1.3, perGrp=Hq/Hkv;   // head Z-gap; ≥ rotated d_k-along-Z span so heads don't overlap
    const cacheTop = (Ctot-1)/2*0.62 + 1.0;               // label above a full cache strip
    // 6: Q — a SINGLE query token, Hq heads (1 row along Y, d_k along Z, heads along Z) — d_k rotated
    // X→Z to match W_Q column direction (same as the backbone).
    for(let h=0;h<Hq;h++){ const hd=makeHead(tp>1?qRank(h):COL.q,1,1.0,dim,'z');
      hd.position.set(X(6),0,(h-(Hq-1)/2)*hZ); add(hd); cells.push({mat:hd.userData.mat}); }
    lab("Q×"+Hq+"（1 query token）"+(tp>1?" "+qPer+"/GPU":""), X(6), Hq/2*hZ+1.0, COL.q);
    flow(X(3),0, X(6),0, COL.q);
    // RoPE on Q (rotary marker above the query heads)
    { const rp=makeRope(0.85); rp.position.set(X(6), Hq/2*hZ+0.5, 0); add(rp); cells.push({mat:rp.userData.mat});
      lab("⟳ RoPE", X(6), Hq/2*hZ+1.7, COL.rope); }
    // 7/8: K / V cache — Ctot positions × kv_hidden (= Hkv·d_k, ALL kv heads). Same orientation as
    // the backbone: cache position (seq) along Y, hidden along Z. Built per-cell (own material) so
    // the reveal animation grows it row-by-row. `i`=cache row (seq), `j`=hidden col (0..kvW-1).
    const buildCache=(color,x)=>{ const grp=new THREE.Group(), cs=[];
      for(let i=0;i<Ctot;i++)for(let j=0;j<kvW;j++){ const m=mat(color,1);
        const cell=new THREE.Mesh(boxGeo,m); cell.scale.set(0.6,0.44,0.55);   // hidden along Z, seq along Y
        cell.position.set(0, (i-(Ctot-1)/2)*0.62, (j-(kvW-1)/2)*0.62);
        grp.add(cell); cs.push({mesh:cell,mat:m,i,j}); cells.push({mat:m}); }
      grp.userData.cells=cs; grp.position.set(x,0,0); add(grp); return grp; };
    const kc=buildCache(COL.k,X(7)), vc=buildCache(COL.v,X(8));
    lab("K cache (C+draft)"+(cfg.mode==="MHA"?" ×"+Hkv+"=Hq":" ×"+Hkv), X(7), cacheTop, COL.k);
    lab("V cache ×"+Hkv, X(8), cacheTop, COL.v);
    flow(X(4),0, X(7),0, COL.k); flow(X(5),0, X(8),0, COL.v);
    // RoPE on K (NOT V) — applied before it lands in the cache
    { const rp=makeRope(0.85); rp.position.set(X(7), cacheTop-0.6, 0); add(rp); cells.push({mat:rp.userData.mat});
      lab("⟳ RoPE", X(7), cacheTop+0.6, COL.rope); }
    // Q→KV grouping lines: each Q head links to the Z-CENTER of its own KV head in the cache (not a
    // shared point), so GQA shows perGrp Q heads converging on one KV head, MQA all→1, MHA 1:1.
    const kvZ = gI => (gI*dim + (dim-1)/2 - (kvW-1)/2)*0.62;       // Z-center of KV head gI in the cache
    for(let h=0;h<Hq;h++){ const gI=Math.floor(h/perGrp);          // each Q head → its GQA/MQA KV group
      const sl=line(new THREE.Vector3(X(6),0,(h-(Hq-1)/2)*hZ),new THREE.Vector3(X(7),0,kvZ(gI)),COL.k,0.0);
      add(sl); flows.push(sl); }
    // 9: QKᵀ scores — single query · every cached key → 1×(C+k) ROW vector, laid FLAT/horizontal
    // (keys run along Z, one score per cached key). `i` = key index (0..Ctot-1) → reveal grows it.
    const sc=makeMatrix(Ctot,1,COL.cell,'flat',true); sc.position.set(X(9),0,0); add(sc);
    sc.userData.cells.forEach(c=>cells.push({mat:c.mat}));
    lab("QKᵀ→scores 1×(C+k)", X(9), 2.0, COL.cell);
    flow(X(6),0, X(9),0, COL.q); flow(X(7),0, X(9),0, COL.k);
    // 10: softmax over the current cache length — same flat 1×(C+k) row
    const sm=makeMatrix(Ctot,1,0x7fb2ff,'flat',true); sm.position.set(X(10),0,0); add(sm);
    sm.userData.cells.forEach(c=>cells.push({mat:c.mat}));
    lab("softmax", X(10), 2.0, 0x7fb2ff);
    flow(X(9),0, X(10),0, COL.cell);
    // 11: context = softmax·V → 1 token × d_model (only the current query's output)
    const ctx=makeHead(COL.ctx,1,0.9,dm,'z'); ctx.position.set(X(11),0,0); add(ctx);
    if(ctx.userData.mat) cells.push({mat:ctx.userData.mat});
    lab("attn_output（1 token）", X(11), 1.0, 0xb3a9ee);
    flow(X(10),0, X(11),0, 0x7fb2ff); flow(X(8),0, X(11),0, COL.v);
    // growth data: at manual step k, cache length = C+k+1 → reveal that many rows (newest brightest)
    g.userData.grow = { qk:sc, sm:sm, kc:kc, vc:vc, C, Ctot };
    // 12: W_O — standing matrix, ROW-parallel (tint by row-block = owning rank) + dividers
    const woRow = tp>1?((i,j)=>qRank(Math.floor(i/dim))):null;
    const woDivs= tp>1?{axis:'row',at:bnd(tp,qPer)}:null;
    const wO=makeMatrix(dm,dm,COL.wO,'stand',false,undefined,undefined,woRow,woDivs);
    wO.position.set(X(12),0,0); add(wO); pushMat(wO);
    lab(tp>1?"W_O 行并行":"W_O", X(12), dm*0.62+0.9, 0x7fd4dd);
    flow(X(11),0, X(12),0, COL.ctx);
    // 13: attn out — 1 token × d_model
    const ao=makeHead(COL.out,1,0.9,dm,'z'); ao.position.set(X(13),0,0); add(ao);
    if(ao.userData.mat) cells.push({mat:ao.userData.mat});
    lab("attn out（1 token）", X(13), 1.0, COL.out); flow(X(12),0, X(13),0, 0x7fd4dd);
    // 14: residual① — 1 token × d_model
    const r1=makeHead(COL.res,1,0.9,dm,'z'); r1.position.set(X(14),0,0); add(r1);
    if(r1.userData.mat) cells.push({mat:r1.userData.mat}); lab("⊕ 残差①", X(14), 1.0, COL.res);
    flow(X(13),0, X(14),0, COL.out);
    // 15..: MLP (gate_up→SiLU→down, col/row-parallel) or MoE (router+experts+shared) — backbone style
    const a2a=[]; let nx=15; const inter=Math.max(tp,Math.round(dm*2/tp)*tp);
    if(cfg.mlp!=="MOE"){
      const iPer=inter/tp;
      const upCol=tp>1?((i,j)=>GPU_COLS[Math.floor(j/iPer)%GPU_COLS.length]):null;
      const upDivs=tp>1?{axis:'col',at:(()=>{const a=[];for(let k=1;k<tp;k++)a.push(k*iPer);return a;})()}:null;
      const dnRow=tp>1?((i,j)=>GPU_COLS[Math.floor(i/iPer)%GPU_COLS.length]):null;
      const dnDivs=tp>1?{axis:'row',at:(()=>{const a=[];for(let k=1;k<tp;k++)a.push(k*iPer);return a;})()}:null;
      const up=makeMatrix(dm,inter,COL.wUp,'stand',false,undefined,undefined,upCol,upDivs);
      up.position.set(X(nx),0,0); add(up); pushMat(up);
      lab(tp>1?"gate_up 列并行":"gate_up_proj", X(nx), inter*0.62/2+0.9, 0x8fb8ff); flow(X(14),0, X(nx),0, COL.res); nx++;
      const ia=makeHead(COL.inter,1,0.9,inter,'z'); ia.position.set(X(nx),0,0); add(ia); // 1 token × inter
      if(ia.userData.mat) cells.push({mat:ia.userData.mat});
      lab("SiluAndMul（1 token）", X(nx), 1.0, COL.inter); flow(X(nx-1),0, X(nx),0, 0x8fb8ff); nx++;
      const dn=makeMatrix(inter,dm,COL.wDn,'stand',false,undefined,undefined,dnRow,dnDivs);
      dn.position.set(X(nx),0,0); add(dn); pushMat(dn);
      lab(tp>1?"down 行并行":"down_proj", X(nx), inter*0.62/2+0.9, 0x7fd4dd); flow(X(nx-1),0, X(nx),0, COL.inter); nx++;
    } else {
      const cx=X(nx), NE=4, ez=0.62, ezOf=e=>(e-(NE-1)/2)*ez;
      const rt=cube(COL.router); rt.scale.set(0.5,0.5,1.3); rt.position.set(cx-0.7,1.5,0); add(rt);
      cells.push({mat:rt.userData.mat});
      for(let e=0;e<NE;e++){ const c=cube(GPU_COLS[e%GPU_COLS.length]); c.scale.set(0.6,1.0,0.5);
        c.position.set(cx+0.3,0,ezOf(e)); add(c); cells.push({mat:c.userData.mat}); }
      const sh=cube(COL.shared); sh.scale.set(0.6,0.8,0.5); sh.position.set(cx+0.3,-1.6,0); add(sh);
      cells.push({mat:sh.userData.mat});
      for(let e=0;e<NE;e++){                                    // all-to-all dispatch/combine
        const dl=line(new THREE.Vector3(cx-0.35,0,0),new THREE.Vector3(cx+0.3,0,ezOf(e)),COL.comm,0.0);
        const cl=line(new THREE.Vector3(cx+0.3,0,ezOf(e)),new THREE.Vector3(cx+1.1,0,0),COL.comm,0.0);
        add(dl); add(cl); a2a.push(dl,cl); flows.push(dl,cl);
      }
      lab("MoE: router+experts+shared", X(nx), 2.4, COL.router); flow(X(14),0, X(nx),0, COL.res); nx++;
    }
    // layer output (hidden) — recurses; then lm_head → logits → argmax → draft token
    const loI=nx, lo=makeHead(COL.lout,1,0.9,dm,'z'); lo.position.set(X(loI),0,0); add(lo); // 1 token × d_model
    if(lo.userData.mat) cells.push({mat:lo.userData.mat});
    lab("layer output（1 token）", X(loI), 1.0, COL.lout); flow(X(loI-1),0, X(loI),0, COL.inter); nx++;
    const lmI=nx, lm=makeMatrix(EV,dm,COL.embed,'stand',false); lm.position.set(X(lmI),0,0); add(lm); pushMat(lm);
    lab("lm_head (借 target)", X(lmI), EV/2*0.62+0.9, COL.embed); flow(X(loI),0, X(lmI),0, COL.lout); nx++;
    const lgI=nx, lg=makeMatrix(EV,1,COL.lout,'stand',true); lg.position.set(X(lgI),0,0); add(lg);
    const argR=Math.floor(EV*0.4); lg.userData.cells.forEach((c,i)=>{ cells.push({mat:c.mat});
      if(i===argR){ c.mat.color.setHex(COL.bonus); c.mat.emissive.setHex(COL.bonus); } });
    lab("logits→argmax", X(lgI), EV/2*0.62+0.9, COL.lout); flow(X(lmI),0, X(lgI),0, COL.embed); nx++;
    const otI=nx, ot=cube(COL.draft); ot.scale.set(0.7,0.7,0.7); ot.position.set(X(otI),-1.6,0); add(ot);
    lab("draft token", X(otI), -1.6+1.4, COL.draft);
    flow(X(lgI),(argR-(EV-1)/2)*0.62, X(otI),-1.6, COL.draft);
    g.userData.cells=cells; g.userData.a2a=a2a; g.userData.flows=flows;
    g.userData.otCell={mat:ot.userData.mat};
    return { grp:g, S, EV, bx, X, P, cells, flows, a2a,
             inX:X(0), inY:-1.6, loX:X(loI), otWX:bx+X(otI)*S, otWY:-1.6*S,
             ehWX:bx+X(2)*S, ehWY:0, emWX:bx+X(1)*S, loWX:bx+X(loI)*S, width:X(otI)*S };
  }

  for(let d=0; d<dp; d++){
    const dz=laneZ(d), tag=dp>1?"["+d+"] ":"";

    // ---- sub 0: INPUT candidate block → embed_tokens → X ----
    const cin = makeTokenRow(seq, sp); cin.position.set(IN_X,0,dz); CUR.root.add(cin); io.candIn.push(cin);
    if(isPrefill){
      cin.userData.cells.forEach(c=>{ c.mat.color.setHex(COL.seedTok); c.mat.emissive.setHex(COL.seedTok); });
      addLabel(tag+"prompt ("+seq+" token id)", IN_X, dz, COL.seedTok, cin, rowTop);
    } else {
      cin.userData.cells.forEach((c,i)=>{ const col=i===0?COL.bonus:COL.draft;
        c.mat.color.setHex(col); c.mat.emissive.setHex(col); });
      addLabel(tag+"上层输出候选块 [金 bonus, 蓝×"+(seq-1)+"]（= 本层输入）", IN_X, dz, COL.draft, cin, rowTop);
    }
    const em = makeMatrix(EMB_VOCAB, dmodel, COL.embed, 'stand', false); em.position.set(EMB_X,0,dz);
    CUR.root.add(em); io.embeds.push(em);
    addLabel(tag+"embed_tokens (vocab\u00d7hidden 查表)", EMB_X, dz, COL.embed, em, embTop);
    const fl=[]; const rowY=r=>(r-(EMB_VOCAB-1)/2)*0.62, rowOf=t=>Math.floor((t+0.5)*EMB_VOCAB/seq);
    for(let i=0;i<seq;i++){ const r=rowOf(i);
      fl.push(addFlow(IN_X,0,dz+(i-(seq-1)/2)*sp, EMB_X,rowY(r),dz, isPrefill?COL.seedTok:COL.draft));
      fl.push(addFlow(EMB_X,rowY(r),dz, slot(0),tokY(i),dz, COL.embed)); }
    io.inFlows.push(fl);

    // ---- sub 11 head: lm_head→logits→sample token (prefill, and decode when spec OFF = plain
    // autoregression); real speculative decode floors → verify/accept row instead. ----
    let laneBonus=null;   // the gold token cube (prefill / OFF) — reused as the MTP recursion seed
    if(isPrefill || spec==="OFF"){
      const normX=LOUT_X+4, lmHeadX=LOUT_X+8.5, logitsX=LOUT_X+13, argRow=Math.floor(EMB_VOCAB*0.32);
      const lastY=tokY(0);                             // last position = the hidden state's BOTTOM row
      // final RMSNorm on the last-position hidden (thin single column) — makes the "take last pos" read
      const nrm=makeHead(COL.res, 1, 0.9, dmodel, 'z'); nrm.position.set(normX,lastY,dz);
      CUR.root.add(nrm); addLabel(tag+"RMSNorm(最后位置 hidden)", normX, dz, COL.res, nrm, lastY+rowTop);
      // lm_head (hidden × vocab), tied to embed_tokens
      const lmH=makeMatrix(EMB_VOCAB, dmodel, COL.embed, 'stand', false); lmH.position.set(lmHeadX,0,dz);
      CUR.root.add(lmH); addLabel(tag+"lm_head (hidden\u00d7vocab · 与 embed_tokens tie)", lmHeadX, dz, COL.embed, lmH, embTop);
      // logits: a per-cell vocab column so the argmax cell can glow gold (= the sampled bonus)
      const lmL=makeMatrix(EMB_VOCAB, 1, COL.lout, 'stand', true); lmL.position.set(logitsX,0,dz);
      lmL.userData.argRow=argRow;
      const argCell=lmL.userData.cells[argRow];
      argCell.mat.color.setHex(COL.bonus); argCell.mat.emissive.setHex(COL.bonus);
      CUR.root.add(lmL); addLabel(tag+"logits (vocab) → argmax → bonus(金)", logitsX, dz, COL.lout, lmL, embTop);
      // the sampled token (gold cube) sits just right of the logits column, at the argmax row.
      // OFF: skip this cube — the single output gold token is candOut (wired to the pipeline); a
      // second cube here would just duplicate it. MTP/DFlash keep it (it's the MTP recursion seed).
      const argY=(argRow-(EMB_VOCAB-1)/2)*0.62, bonusX=logitsX+3;
      let bonus=null;
      if(spec!=="OFF"){ bonus=cube(COL.bonus); bonus.position.set(bonusX,argY,dz); CUR.root.add(bonus); laneBonus=bonus;
        addLabel(tag+"bonus(金 token id)", bonusX, dz, COL.bonus, bonus, argY+rowTop); }
      // flows: last-pos layer output → RMSNorm → lm_head → logits column, then argmax → bonus token
      const fl=[];
      fl.push(addFlow(LOUT_X,lastY,dz, normX,lastY,dz, COL.lout));            // last-pos hidden → norm
      fl.push(addFlow(normX,lastY,dz, lmHeadX,0,dz, COL.embed));              // norm → lm_head
      fl.push(addFlow(lmHeadX,0,dz, logitsX,0,dz, COL.lout));                 // lm_head → logits (one line)
      if(bonus) fl.push(addFlow(logitsX,argY,dz, bonusX,argY,dz, COL.bonus)); // argmax cell → bonus token
      // OFF: no bonus cube — the sampled token IS candOut (at OUT_X). Connect the gold argmax cell
      // straight to it, and light the line on THIS head step (when the argmax pops), not the tail step.
      if(spec==="OFF") fl.push(addFlow(logitsX,argY,dz, OUT_X,0,dz, COL.bonus)); // argmax gold cell → output token
      io.lmFlows.push(fl);
      io.lmParts.push({head:lmH, logits:lmL, norm:nrm, argRow, bonus}); io.accepts.push(null);
    } else {
      const accLen=Math.max(1, Math.floor(seq*0.6));
      const acc=makeTokenRow(seq, sp); acc.position.set(ACC_HEAD_X,0,dz);
      acc.userData.cells.forEach((c,i)=>{ const col=i<accLen?COL.accept:(i===accLen?COL.bonus:COL.mask);
        c.mat.color.setHex(col); c.mat.emissive.setHex(col); });
      CUR.root.add(acc); io.accepts.push(acc);
      addLabel(tag+"验证：绿=接受 金=bonus(主干生成) 灰=拒绝", ACC_HEAD_X, dz, COL.accept, acc, headTop);
      io.lmParts.push(null);
    }

    // ---- sub 12 MTP tail: read this layer's output hidden → blue draft tokens → candOut block ----
    // candOut is the DRAFT block: fixed dseq long (num_draft_tokens), NOT the floor's seq.
    const coutZ = i => dz+(i-(dseq-1)/2)*sp;             // Z of candOut slot i (dseq-long block)
    const cout = makeTokenRow(dseq, sp); cout.position.set(OUT_X,0,dz); CUR.root.add(cout); io.candOut.push(cout);
    cout.userData.cells.forEach((c,i)=>{ const col=i===0?COL.bonus:COL.draft;
      c.mat.color.setHex(col); c.mat.emissive.setHex(col); });
    addLabel(tag+(spec==="OFF" ? "本层输出：生成 1 个 token → 下一步"
                                : "本层输出 [金 bonus, 蓝 draft×"+(dseq-1)+"] → 下一层"),
      OUT_X, dz, COL.draft, cout, rowTop);

    const recs=[]; const mtpBlocks=[]; let draftObj=null;
    if(spec==="OFF"){
      // no draft tail. The gold argmax cell → output-token line is drawn in the head's lmFlows
      // (lit on the head step, when the argmax pops), so nothing to add to the tail here.
      io.frozenKVs.push(null);
    } else if(spec==="DFLASH"){
      const box=makeBox(1.6,4.4,4.4,COL.draftBox); box.position.set(MTP0_X,0,dz); CUR.root.add(box); draftObj=box;
      addLabel(tag+"DFlash draft (读本层 hidden · parallel masked block · 借 target embed/lm_head)", MTP0_X, dz, 0x8fb8ff, box, 3.4);
      const kv=makeBox(3.2,0.5,3.2,COL.frozen); kv.position.set(MTP0_X,4.6,dz); CUR.root.add(kv); io.frozenKVs.push(kv);
      addLabel(tag+"draft KV", MTP0_X, dz, 0x6b7684, kv, 5.4);
      recs.push(addFlow(LOUT_X,0,dz, MTP0_X,0,dz, COL.frozen));                       // read layer-output hidden
      for(let i=1;i<dseq;i++) recs.push(addFlow(MTP0_X,0,dz, OUT_X,0,coutZ(i), COL.draft)); // draft → candOut[1..]
    } else {
      const grp=new THREE.Group(); const allCells=[];
      // ONE physical MTP layer, fully expanded (main-model style, one size smaller).
      const db=mtpDetailBlock(MTP0_X,dz,!isPrefill); CUR.root.add(db.grp); mtpBlocks.push(db.grp);
      db.cells.forEach(c=>allCells.push(c));
      db.grp.userData.otCell.mat.color.setHex(COL.draft); db.grp.userData.otCell.mat.emissive.setHex(COL.draft);
      addLabel(tag+"MTP 层（唯一一层）", MTP0_X+db.width/2, dz, 0x8fb8ff, db.grp, db.EV/2*0.62*db.S+3.4);
      // backbone hidden → eh_proj: arc BELOW the block so it arrives from underneath instead of a
      // straight line piercing embed_tokens / the whole pipeline.
      recs.push(addArcFlow(LOUT_X,0,dz, db.ehWX,db.ehWY,dz, COL.frozen, -(db.EV/2*0.62*db.S+10)));
      // identity link: the main-model bonus (gold) IS the MTP seed → feeds straight into embed_tokens.
      if(laneBonus){ io.bonusLinks.push(addFlow(laneBonus.position.x,laneBonus.position.y,dz, db.emWX,0,dz, COL.bonus)); }
      // recursion self-loop: layer output hidden + the just-emitted draft token → back to eh_proj input,
      // repeated n-1 times (weight-shared). One physical layer, unrolled in time — shown as a loop arc.
      recs.push(addArcFlow(db.loWX,0,dz, db.ehWX,db.ehWY,dz, COL.bonus, db.EV/2*0.62*db.S+5));
      recs.push(addFlow(db.otWX,db.otWY,dz, OUT_X,0,coutZ(1), COL.draft));              // draft token → candOut
      for(let k=2;k<dseq;k++) recs.push(addFlow(db.otWX,db.otWY,dz, OUT_X,0,coutZ(k), COL.draft)); // ×(n-1) via loop
      addLabel(tag+"递归 "+(NST)+" 步（权重共享）→ 每步 1 蓝 token",
        MTP0_X+db.width/2, dz, 0x6b7684, mtpBlocks[0], -3.4);
      grp.userData.cells=allCells; draftObj=grp; io.frozenKVs.push(null);
    }
    io.drafts.push(draftObj); io.mtpBlocks.push(mtpBlocks); io.recArrows.push(recs);
  }
}

// connectors (2-floor model):
//   ① prefill.candOut → ② decode.candIn : a one-shot DOWN arc across the floor gap (prefill seeds
//      the first decode step). Stored in prefill.io.downFlows, animated on prefill's MTP step.
//   ② decode.candOut → ② decode.candIn : a SELF-LOOP arc (output far-right → input far-left, over
//      the top of the decode floor). THIS loop is the decode iteration. Stored in decode.io.downFlows,
//      animated on decode's MTP step.
function buildFloorConnectors(laneZ){
  const dp=cfg.dp||1, pre=parts.phases[0], dec=parts.phases[1];
  pre.io.downFlows=[]; dec.io.downFlows=[];
  // ① prefill → decode (down)
  for(let d=0; d<dp; d++){
    const dz=laneZ(d), cout=pre.io.candOut[d], cin=dec.io.candIn[d];
    if(!cout||!cin) continue;
    const a=arc(new THREE.Vector3(cout.position.x,pre.y,dz), new THREE.Vector3(cin.position.x,dec.y,dz),
                COL.draft, 0.0, -(pre.y-dec.y)*0.3);
    root.add(a); pre.io.downFlows.push(a);
  }
  addRootLabel("① prefill 输出候选块 → ② decode 输入（首次起草）", 0, (pre.y+dec.y)/2+2, 0, COL.draft, null);
  // ② decode self-loop (output far-right arcs back over the top to its own far-left input)
  const loopLiftLocal = (dec.seqLen||cfg.seq)/2 + 12;   // arc apex height above the decode floor
  for(let d=0; d<dp; d++){
    const dz=laneZ(d), cout=dec.io.candOut[d], cin=dec.io.candIn[d];
    if(!cout||!cin) continue;
    // arc lives INSIDE the decode floor group (local coords) so it rides with the floor.
    const a=arc(new THREE.Vector3(cout.position.x,0,dz), new THREE.Vector3(cin.position.x,0,dz),
                COL.bonus, 0.0, loopLiftLocal);
    dec.root.add(a); dec.io.downFlows.push(a);
  }
  // self-loop label: parent to the decode floor group so it rides with it (local y above apex)
  const lbl=makeLabel("② decode 自循环：本层输出候选块 → 回接本层输入（这就是 decode 循环：draft 输出即下次输入）", COL.bonus);
  lbl.position.set(0, loopLiftLocal+1.5, 0); dec.root.add(lbl);
  parts.labels.push({sp:lbl, owner:null});
}


// single-material box / cube / label / arc helpers for the appended stages
function makeBox(w,h,d,color){ const m=mat(color,1); const c=new THREE.Mesh(boxGeo,m);
