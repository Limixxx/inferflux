<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=820, viewport-fit=cover">
<title>PD Disaggregation Simulator · PD 分离模拟器</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2d3646;
  --text:#e6edf3; --muted:#8b98a9; --accent:#4ea1ff;
  --amber:#f0b429; --grey:#7d8590; --blue:#4ea1ff; --green:#3fb950;
  --purple:#bc8cff; --red:#f85149; --cyan:#39c5cf; --orange:#f0883e;
  --radius:10px; --sidebar-w:300px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,"SF Pro","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13px; overflow:hidden;
}
button,select,input{font-family:inherit; font-size:12px; color:var(--text);}
button{
  background:var(--panel2); border:1px solid var(--border); border-radius:6px;
  padding:4px 10px; cursor:pointer; white-space:nowrap;
}
button:hover{border-color:var(--accent);}
button.active{background:var(--accent); color:#04121f; border-color:var(--accent); font-weight:600;}
select{background:var(--panel2); border:1px solid var(--border); border-radius:6px; padding:3px 6px;}

#topbar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:8px 12px; border-bottom:1px solid var(--border); background:var(--panel);
}
#topbar .title{font-size:15px; font-weight:700; margin-right:6px;}
#topbar .title small{color:var(--muted); font-weight:400; font-size:11px;}
#topbar .home{color:var(--muted); font-size:12px; text-decoration:none; margin-right:4px;}
#topbar .home:hover{color:var(--accent);}
#topbar .gh-link{display:inline-flex; align-items:center; color:var(--muted); margin-left:auto; transition:color .18s;}
#topbar .gh-link:hover{color:var(--accent);}
#topbar .sep{width:1px; height:20px; background:var(--border); margin:0 2px;}
#speedWrap{display:flex; align-items:center; gap:6px;}
#speedWrap input[type=range]{width:110px;}
#speedVal{min-width:44px; color:var(--accent); font-variant-numeric:tabular-nums;}
#simClock{color:var(--muted); font-variant-numeric:tabular-nums; min-width:88px;}
#presetWrap{display:flex; gap:6px; align-items:center;}
#sidebarToggle{display:inline-block;}

#layout{display:flex; height:calc(100% - 45px);}
#sidebar{
  width:var(--sidebar-w); min-width:var(--sidebar-w);
  overflow-y:auto; border-right:1px solid var(--border); background:var(--panel);
  padding:10px 12px 40px;
  transition:width .2s ease, min-width .2s ease, padding .2s ease;
}
#main{flex:1; min-width:0; display:flex; flex-direction:column; overflow-y:auto; padding:10px;}

.pgroup{margin-bottom:14px;}
.pgroup h3{
  font-size:11px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--muted); border-bottom:1px solid var(--border);
  padding-bottom:4px; margin-bottom:8px;
}
.prow{margin-bottom:9px;}
.prow .plabel{display:flex; justify-content:space-between; margin-bottom:2px;}
.prow .plabel .pname{color:var(--text);}
.prow .plabel .pval{color:var(--accent); font-variant-numeric:tabular-nums;}
.prow input[type=range]{width:100%; accent-color:var(--accent); height:18px;}
.prow select{width:100%;}
.pinfo{
  background:var(--panel2); border:1px solid var(--border); border-radius:6px;
  padding:6px 8px; font-size:11px; color:var(--muted); line-height:1.6;
}
.pinfo b{color:var(--cyan); font-variant-numeric:tabular-nums;}

#flowWrap{position:relative; width:100%;}
#flow{
  width:100%; display:block; background:var(--panel);
  border:1px solid var(--border); border-radius:var(--radius);
}

#bdWrap{margin-top:10px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:8px 12px;}
#bdWrap h3{font-size:12px; color:var(--muted); margin-bottom:6px;}
#bd{width:100%; height:86px; display:block;}

#metrics{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:8px; margin-top:10px;
}
.mcard{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:8px 10px 6px;
}
.mcard .mtitle{font-size:11px; color:var(--muted); margin-bottom:2px;}
.mcard .mval{font-size:18px; font-weight:700; font-variant-numeric:tabular-nums;}
.mcard .mval small{font-size:10px; color:var(--muted); font-weight:400;}
.mcard .msub{font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; margin-bottom:2px; min-height:12px;}
.mcard canvas{width:100%; height:34px; display:block;}

#sidebar.collapsed{
  width:0; min-width:0; padding-left:0; padding-right:0;
  border-right:0; overflow:hidden;
}
@media (max-width:820px){
  :root{ --sidebar-w:200px; }
}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
</style>
</head>

function fmtTokens(v){ if (v >= 1e6) return (v / 1e6).toFixed(v % 1e6 === 0 ? 0 : 2) + "M"; if (v >= 1e3) return (v / 1e3).toFixed(v % 1e3 === 0 ? 0 : 1) + "k"; return v.toFixed(0); }
function gpuKvBudget(hbm){ return Math.round(hbm * 0.7); }
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
const LOG_STEPS = 1000;
const SNAP_GRID = [1, 2, 3, 5, 7, 10];
function logSliderToVal(def, pos){ if (pos <= 0) return def.min; if (pos >= LOG_STEPS) return def.max; const lo = Math.log(def.min), hi = Math.log(def.max); const raw = Math.exp(lo + (hi - lo) * (pos / LOG_STEPS)); const mag = Math.pow(10, Math.floor(Math.log10(raw))); const base = raw / mag; let snap = SNAP_GRID[0]; for (const g of SNAP_GRID) if (Math.abs(Math.log(base / g)) < Math.abs(Math.log(base / snap))) snap = g; return Math.max(def.min, Math.min(def.max, Math.round(snap * mag))); }
function nearestStepIdx(def, val){ let idx = 0, best = Infinity; for (let i = 0; i < def.steps.length; i++){ const d = Math.abs(def.steps[i] - val); if (d < best){ best = d; idx = i; } } return idx; }
function logValToSlider(def, val){ const lo = Math.log(def.min), hi = Math.log(def.max); return Math.max(0, Math.min(LOG_STEPS, Math.round((Math.log(val) - lo) / (hi - lo) * LOG_STEPS))); }

function cellSizeOf(P){
  if (P.mla) return (P.kvLoraRank + P.qkRope) * P.layers * P.dtypeBytes;
  const growLayers = P.hybrid ? P.fullLayers : P.layers;
  return growLayers * P.kvHeads * P.headDim * P.dtypeBytes * 2;
}
function chunkPrefillMs(P, r, idx){
  const q = Math.min(P.chunkSize, r.uncachedLen - idx * P.chunkSize);
  const gemmMs = q / P.prefillTokPerSec * 1000;
  const effFlops = P.prefillTokPerSec * 2 * (P.activeB * 1e9);
  const fullLayers = P.hybrid ? P.fullLayers : P.layers;
  const swaLayers  = P.hybrid ? (P.layers - P.fullLayers) : 0;
  const flopsPerLayer = 4 * P.qHeads * P.headDim;
  const coefFull = flopsPerLayer * fullLayers / effFlops * 1000;
  const coefSwa  = flopsPerLayer * swaLayers  / effFlops * 1000;
  const ctx = r.cachedLen + idx * P.chunkSize + q / 2;
  const W = P.swaWindow || 0;
  const swaCtx = W > 0 ? Math.min(W, ctx) : ctx;
  return gemmMs + coefFull * q * ctx + coefSwa * q * swaCtx;
}

function applyRenderState(data){
  sim.now = data.now; sim.P = data.P; sim.retractTotal = data.retractTotal;
  const isAgg = (data.mode === "agg") || (sim.P.mode === "agg");
  if (isAgg){
    sim.pList = []; sim.dList = [];
    sim.wList = data.wList.map(w=>({
      id:w.id, kvUsed:w.kvUsed, draining:w.draining, maxTokens:()=>w.maxTokens,
      ntr:w.ntr, retractGlow:w.retractGlow, nextStepAt:w.nextStepAt,
      waitingQ:[], running:[],
    }));
    const fixReq = r => { r.w = r.wIdx >= 0 ? sim.wList[r.wIdx] : null; r.p = null; r.d = null; return r; };
    for (let i=0; i<sim.wList.length; i++){
      const w=sim.wList[i], wd=data.wList[i];
      w.waitingQ=wd.waitingQ.map(fixReq); w.running=wd.running.map(fixReq);
    }
    sim.allActive=new Set(data.allActive.map(fixReq));
    sim.responding=data.responding.map(fixReq);
    return;
  }
  sim.wList = [];
  sim.pList = data.pList.map(p=>({
    id:p.id, kvUsed:p.kvUsed, draining:p.draining, maxTokens:()=>p.maxTokens,
    bootstrapQ:[], waitingQ:[], slots:[], inflight:[],
    link:{queue:p.link.queue, current:p.link.current, startAt:p.link.startAt, doneAt:p.link.doneAt, depth:p.link.depth},
  }));
  sim.dList = data.dList.map(d=>({
    id:d.id, kvUsed:d.kvUsed, draining:d.draining, maxTokens:()=>d.maxTokens,
    ntr:d.ntr, retractGlow:d.retractGlow,
    preallocQ:[], transferQ:[], waitingQ:[], running:[],
  }));
  const fixReq = r => { r.p = r.pIdx >= 0 ? sim.pList[r.pIdx] : null; r.d = r.dIdx >= 0 ? sim.dList[r.dIdx] : null; return r; };
  for (let i=0; i<sim.pList.length; i++){
    const p=sim.pList[i], pd=data.pList[i];
    p.bootstrapQ=pd.bootstrapQ.map(fixReq); p.waitingQ=pd.waitingQ.map(fixReq);
    p.slots=pd.slots.map(s=>({req:fixReq(s.req),busyUntil:s.busyUntil}));
    p.inflight=pd.inflight.map(fixReq);
    if (p.link.current) p.link.current.req=fixReq(p.link.current.req);
  }
  for (let i=0; i<sim.dList.length; i++){
    const d=sim.dList[i], dd=data.dList[i];
    d.preallocQ=dd.preallocQ.map(fixReq); d.transferQ=dd.transferQ.map(fixReq);
    d.waitingQ=dd.waitingQ.map(fixReq); d.running=dd.running.map(fixReq);
  }
  sim.allActive=new Set(data.allActive.map(fixReq));
  sim.responding=data.responding.map(fixReq);
}

/* ========================== Renderer ================================= */
const COLORS = {
  Bootstrapping:"#f0b429", WaitingForInput:"#7d8590", Transferring:"#4ea1ff",
  Success:"#3fb950", decoding:"#bc8cff", tokenize:"#39c5cf", retract:"#f85149",
  bd:["#39c5cf","#f0b429","#7d8590","#f0883e","#4ea1ff","#bc8cff","#3fb950"],
};
function kvGaugeColor(r){ return r < 0.7 ? "#3fb950" : (r < 0.9 ? "#f0b429" : "#f85149"); }
const BOX_H = 118, BOX_GAP = 12;
const CLIENT_VIS_MS = 60, FANOUT_VIS_MS = 60;

class Renderer {
  constructor(cv){ this.cv = cv; this.ctx = cv.getContext("2d"); this.W = 0; this.H = 0; }
  resize(sim){
    const w = this.cv.parentElement.clientWidth || 800;
    const n = sim.P.mode === "agg" ? sim.wList.length : Math.max(sim.pList.length, sim.dList.length);
    const h = Math.max(420, n * (BOX_H + BOX_GAP) - BOX_GAP + 70);
    const dpr = window.devicePixelRatio || 1;
    const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
    if (this.cv.width !== pw || this.cv.height !== ph){ this.cv.width = pw; this.cv.height = ph; this.cv.style.height = h + "px"; }
    this.W = w; this.H = h; this.dpr = dpr;
  }
  draw(sim){
    if (sim.P.mode === "agg") { this.drawAgg(sim); return; }
    const ctx = this.ctx, W = this.W, H = this.H, now = sim.now;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.font = "10px sans-serif";
    const midY = H / 2;
    const nodeH = 46;
    const nd = (fx, fw, name) => ({ x: fx * W, y: midY - nodeH / 2, w: fw * W, h: nodeH, name });
    const client = nd(.015, .065, t("n.client"));
    const router = nd(.125, .075, t("n.router"));
    const areaT = 30, areaB = H - 40;
    const boxW = Math.max(W * .21, 150);
    const boxCol = (bx, list) => {
      const n = list.length;
      const totH = n * BOX_H + (n - 1) * BOX_GAP;
      const y0 = areaT + Math.max(0, (areaB - areaT - totH) / 2);
      return list.map((_, i) => ({ x: bx, y: y0 + i * (BOX_H + BOX_GAP), w: boxW, h: BOX_H }));
    };
    const pX = W * .27;
    const dX = Math.min(Math.max(W * .68, pX + boxW + 40), W - 16 - boxW);
    const pRects = boxCol(pX, sim.pList);
    const dRects = boxCol(dX, sim.dList);
    ctx.lineWidth = 1; ctx.strokeStyle = "#2d3646";
    ctx.beginPath(); ctx.moveTo(client.x + client.w, midY); ctx.lineTo(router.x, midY); ctx.stroke();
    const curve = (x1, y1, x2, y2, style, width) => {
      ctx.strokeStyle = style || "#2d3646"; ctx.lineWidth = width || 1;
      ctx.beginPath(); ctx.moveTo(x1, y1);
      const mx = (x1 + x2) / 2;
      ctx.bezierCurveTo(mx, y1, mx, y2, x2, y2);
      ctx.stroke();
    };
    ctx.globalAlpha = 0.7;
    for (const pr of pRects) curve(router.x + router.w, midY, pr.x, pr.y + pr.h / 2, "#f85149", 1.3);
    for (const dr of dRects) curve(router.x + router.w, midY, dr.x, dr.y + dr.h / 2, "#4ea1ff", 1.3);
    ctx.globalAlpha = 1;
    for (const pr of pRects) for (const dr of dRects) curve(pr.x + pr.w, pr.y + pr.h / 2, dr.x, dr.y + dr.h / 2, "#232c3b", 1);
    const boxBottom = Math.max(
      pRects.length ? pRects[pRects.length - 1].y + BOX_H : midY,
      dRects.length ? dRects[dRects.length - 1].y + BOX_H : midY);
    const respY = Math.min(H - 10, boxBottom + 40);
    const routerCx = router.x + router.w / 2;
    const respPath = dr => [
      { x: dr.x + dr.w / 2, y: dr.y + dr.h },
      { x: dr.x + dr.w / 2, y: respY },
      { x: routerCx, y: respY },
      { x: routerCx, y: router.y + router.h },
    ];
    ctx.strokeStyle = "#3d4a5e"; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (const dr of dRects){ const pts = respPath(dr); ctx.moveTo(pts[0].x, pts[0].y); for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y); }
    ctx.stroke();
    const relayY = midY + 12;
    ctx.beginPath(); ctx.moveTo(router.x, relayY); ctx.lineTo(client.x + client.w, relayY);
    ctx.stroke(); ctx.setLineDash([]);
    this._respPath = respPath; this._respY = respY; this._routerCx = routerCx; this._relayY = relayY;

    for (let i = 0; i < sim.pList.length; i++){
      const p = sim.pList[i], link = p.link, pr = pRects[i];
      if (!link.current) continue;
      const di = sim.dList.indexOf(link.current.req.d);
      if (di < 0) continue;
      const dr = dRects[di];
      const x1 = pr.x + pr.w, y1 = pr.y + pr.h / 2, x2 = dr.x, y2 = dr.y + dr.h / 2;
      const prog = clamp((now - link.startAt) / Math.max(1, link.doneAt - link.startAt), 0, 1);
      const mx = (x1 + x2) / 2;
      const bez = tt => { const u = 1 - tt; return { x: u*u*u*x1 + 3*u*u*tt*mx + 3*u*tt*tt*mx + tt*tt*tt*x2, y: u*u*u*y1 + 3*u*u*tt*y1 + 3*u*tt*tt*y2 + tt*tt*tt*y2 }; };
      const mb = link.current.bytes / 2**20;
      const lw = clamp(2 + Math.log2(1 + mb) * 1.1, 2, 11);
      ctx.strokeStyle = COLORS.Transferring; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.globalAlpha = 0.9;
      ctx.beginPath();
      const t0 = Math.max(0, prog - 0.07), pts = 8;
      let m0 = bez(t0); ctx.moveTo(m0.x, m0.y);
      for (let k = 1; k <= pts; k++){ const q = bez(t0 + (prog - t0) * k / pts); ctx.lineTo(q.x, q.y); }
      ctx.stroke(); ctx.globalAlpha = 1; ctx.lineCap = "butt";
      if (link.queue.length){ ctx.fillStyle = COLORS.Transferring; ctx.fillText("\u21e5" + link.queue.length, x1 + 4, y1 - 6); }
    }

    const drawNode = (r) => {
      this.rr(r.x, r.y, r.w, r.h, 8);
      ctx.fillStyle = "#1c2330"; ctx.fill();
      ctx.strokeStyle = "#2d3646"; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = "#e6edf3"; ctx.textAlign = "center"; ctx.font = "11px sans-serif";
      ctx.fillText(r.name, r.x + r.w / 2, r.y + r.h / 2 + 4);
      ctx.textAlign = "left";
    };
    drawNode(client); drawNode(router);

    const bezPoint = (x1, y1, x2, y2, tt) => { const mx = (x1 + x2) / 2, u = 1 - tt; return { x: u*u*u*x1 + 3*u*u*tt*mx + 3*u*tt*tt*mx + tt*tt*tt*x2, y: u*u*u*y1 + 3*u*u*tt*y1 + 3*u*tt*tt*y2 + tt*tt*tt*y2 }; };
    for (const r of sim.allActive){
      const age = now - r.stamps.recv;
      if (age < 0) continue;
      if (age <= CLIENT_VIS_MS){
        const prog = age / CLIENT_VIS_MS;
        const x = client.x + client.w + (router.x - client.x - client.w) * prog;
        this.dot(x, midY, 4, COLORS.tokenize);
      } else if (age <= CLIENT_VIS_MS + FANOUT_VIS_MS){
        const prog = (age - CLIENT_VIS_MS) / FANOUT_VIS_MS;
        const pi = sim.pList.indexOf(r.p), di = sim.dList.indexOf(r.d);
        const rx = router.x + router.w;
        if (pi >= 0){ const pr = pRects[pi], pt = bezPoint(rx, midY, pr.x, pr.y + pr.h / 2, prog); this.dot(pt.x, pt.y, 3.5, "#f85149"); }
        if (di >= 0){ const dr = dRects[di], pt = bezPoint(rx, midY, dr.x, dr.y + dr.h / 2, prog); this.dot(pt.x, pt.y, 3.5, "#4ea1ff"); }
      }
    }

    for (const r of sim.responding){
      const di = sim.dList.indexOf(r.d);
      if (di < 0) continue;
      const dr = dRects[di];
      const dToRouter = this._respPath(dr);
      const routerToClient = [
        { x: this._routerCx, y: router.y + router.h },
        { x: router.x, y: this._relayY },
        { x: client.x + client.w, y: this._relayY },
      ];
      const pts = dToRouter.concat(routerToClient);
      const prog = clamp(1 - (r.readyAt - now) / Math.max(1, sim.P.detokenizeMs), 0, 1);
      const pt = this.pathPoint(pts, prog);
      this.dot(pt.x, pt.y, 4, COLORS.tokenize);
    }

    for (let i = 0; i < sim.pList.length; i++) this.drawPrefill(sim, sim.pList[i], pRects[i], i, now);
    for (let i = 0; i < sim.dList.length; i++) this.drawDecode(sim, sim.dList[i], dRects[i], i, now);

    const legend = [
      ["tokenize", COLORS.tokenize], ["Bootstrapping", COLORS.Bootstrapping],
      ["WaitingForInput", COLORS.WaitingForInput], ["Transferring", COLORS.Transferring],
      ["Success", COLORS.Success], ["decoding", COLORS.decoding], ["retract", COLORS.retract],
    ];
    let lx = 12;
    ctx.font = "10px sans-serif";
    for (const [k, c] of legend){
      this.dot(lx, 14, 4, c);
      ctx.fillStyle = "#8b98a9";
      const label = t("lg." + k);
      ctx.fillText(label, lx + 8, 17);
      lx += 16 + ctx.measureText(label).width + 10;
    }
  }

  /* ===================== agg-mode renderer ========================= */
  drawAgg(sim){
    const ctx = this.ctx, W = this.W, H = this.H, now = sim.now;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.font = "10px sans-serif";
    const midY = H / 2;
    const nodeH = 46;
    const nd = (fx, fw, name) => ({ x: fx * W, y: midY - nodeH / 2, w: fw * W, h: nodeH, name });
    const client = nd(.015, .065, t("n.client"));
    const router = nd(.125, .075, t("n.router"));
    const areaT = 30, areaB = H - 40;
    const boxW = Math.max(W * .30, 180);
    const wX = Math.min(Math.max(W * .45, router.x + router.w + 40), W - 16 - boxW);
    const n = sim.wList.length;
    const totH = n * BOX_H + (n - 1) * BOX_GAP;
    const y0 = areaT + Math.max(0, (areaB - areaT - totH) / 2);
    const wRects = sim.wList.map((_, i) => ({ x: wX, y: y0 + i * (BOX_H + BOX_GAP), w: boxW, h: BOX_H }));

    ctx.lineWidth = 1; ctx.strokeStyle = "#2d3646";
    ctx.beginPath(); ctx.moveTo(client.x + client.w, midY); ctx.lineTo(router.x, midY); ctx.stroke();
    const curve = (x1, y1, x2, y2, style, width) => {
      ctx.strokeStyle = style || "#2d3646"; ctx.lineWidth = width || 1;
      ctx.beginPath(); ctx.moveTo(x1, y1);
      const mx = (x1 + x2) / 2;
      ctx.bezierCurveTo(mx, y1, mx, y2, x2, y2);
      ctx.stroke();
    };
    ctx.globalAlpha = 0.7;
    for (const wr of wRects) curve(router.x + router.w, midY, wr.x, wr.y + wr.h / 2, "#3fb950", 1.3);
    ctx.globalAlpha = 1;

    const boxBottom = wRects.length ? wRects[wRects.length - 1].y + BOX_H : midY;
    const respY = Math.min(H - 10, boxBottom + 40);
    const routerCx = router.x + router.w / 2;
    const respPath = wr => [
      { x: wr.x + wr.w / 2, y: wr.y + wr.h },
      { x: wr.x + wr.w / 2, y: respY },
      { x: routerCx, y: respY },
      { x: routerCx, y: router.y + router.h },
    ];
    ctx.strokeStyle = "#3d4a5e"; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (const wr of wRects){ const pts = respPath(wr); ctx.moveTo(pts[0].x, pts[0].y); for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y); }
    ctx.stroke();
    const relayY = midY + 12;
    ctx.beginPath(); ctx.moveTo(router.x, relayY); ctx.lineTo(client.x + client.w, relayY);
    ctx.stroke(); ctx.setLineDash([]);
    this._respPath = respPath; this._respY = respY; this._routerCx = routerCx; this._relayY = relayY;

    const drawNode = (r) => {
      this.rr(r.x, r.y, r.w, r.h, 8);
      ctx.fillStyle = "#1c2330"; ctx.fill();
      ctx.strokeStyle = "#2d3646"; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = "#e6edf3"; ctx.textAlign = "center"; ctx.font = "11px sans-serif";
      ctx.fillText(r.name, r.x + r.w / 2, r.y + r.h / 2 + 4);
      ctx.textAlign = "left";
    };
    drawNode(client); drawNode(router);

    const bezPoint = (x1, y1, x2, y2, tt) => { const mx = (x1 + x2) / 2, u = 1 - tt; return { x: u*u*u*x1 + 3*u*u*tt*mx + 3*u*tt*tt*mx + tt*tt*tt*x2, y: u*u*u*y1 + 3*u*u*tt*y1 + 3*u*tt*tt*y2 + tt*tt*tt*y2 }; };
    for (const r of sim.allActive){
      const age = now - r.stamps.recv;
      if (age < 0) continue;
      if (age <= CLIENT_VIS_MS){
        const prog = age / CLIENT_VIS_MS;
        const x = client.x + client.w + (router.x - client.x - client.w) * prog;
        this.dot(x, midY, 4, COLORS.tokenize);
      } else if (age <= CLIENT_VIS_MS + FANOUT_VIS_MS){
        const prog = (age - CLIENT_VIS_MS) / FANOUT_VIS_MS;
        const wi = sim.wList.indexOf(r.w);
        if (wi >= 0){ const wr = wRects[wi], pt = bezPoint(router.x + router.w, midY, wr.x, wr.y + wr.h / 2, prog); this.dot(pt.x, pt.y, 3.5, "#3fb950"); }
      }
    }

    for (const r of sim.responding){
      const wi = sim.wList.indexOf(r.w);
      if (wi < 0) continue;
      const wr = wRects[wi];
      const dToRouter = this._respPath(wr);
      const routerToClient = [
        { x: this._routerCx, y: router.y + router.h },
        { x: router.x, y: this._relayY },
        { x: client.x + client.w, y: this._relayY },
      ];
      const pts = dToRouter.concat(routerToClient);
      const prog = clamp(1 - (r.readyAt - now) / Math.max(1, sim.P.detokenizeMs), 0, 1);
      const pt = this.pathPoint(pts, prog);
      this.dot(pt.x, pt.y, 4, COLORS.tokenize);
    }

    for (let i = 0; i < sim.wList.length; i++) this.drawWorker(sim, sim.wList[i], wRects[i], i, now);

    const legend = [
      ["tokenize", COLORS.tokenize], ["w_waiting", COLORS.WaitingForInput],
      ["w_prefill", "#f0883e"], ["w_chunked_prefill", "#bc8cff"],
      ["w_decode", COLORS.decoding], ["retract", COLORS.retract],
    ];
    let lx = 12;
    ctx.font = "10px sans-serif";
    for (const [k, c] of legend){
      this.dot(lx, 14, 4, c);
      ctx.fillStyle = "#8b98a9";
      const label = t("s." + k);
      ctx.fillText(label, lx + 8, 17);
      lx += 16 + ctx.measureText(label).width + 10;
    }
  }

  drawWorker(sim, w, r, idx, now){
    const ctx = this.ctx, P = sim.P;
    this.instanceFrame(r, t("n.worker") + " " + w.id + (w.draining ? " \u23f3" : ""));
    if (now - w.retractGlow < 500){
      const a = 1 - (now - w.retractGlow) / 500;
      this.rr(r.x, r.y, r.w, r.h, 8);
      ctx.strokeStyle = "rgba(248,81,73," + (0.2 + 0.6 * a).toFixed(2) + ")";
      ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
    }
    ctx.fillStyle = "#5a6675"; ctx.font = "8px sans-serif";
    const ntrTxt = "ntr " + (w.ntr || 0).toFixed(2);
    ctx.fillText(ntrTxt, r.x + r.w - 8 - ctx.measureText(ntrTxt).width, r.y + 27);
    ctx.font = "10px sans-serif";
    let y = r.y + 26;
    const nRetract = w.waitingQ.reduce((s, q) => s + (q.retracted ? 1 : 0), 0);
    this.queueRow(r, y, "q.waiting", w.waitingQ.length, COLORS.WaitingForInput); y += 15;
    if (nRetract > 0){ ctx.fillStyle = COLORS.retract; ctx.font = "9px sans-serif"; const rt = "\u27f2" + nRetract; ctx.fillText(rt, r.x + r.w - 8 - ctx.measureText(rt).width, y - 7); ctx.font = "10px sans-serif"; }
    y += 15;
    // running batch: mixed w_prefill / w_chunked_prefill / w_decode
    const nP = w.running.reduce((s,q)=>s+(q.stage==="w_prefill"?1:0),0);
    const nCP = w.running.reduce((s,q)=>s+(q.stage==="w_chunked_prefill"?1:0),0);
    const nD = w.running.reduce((s,q)=>s+(q.stage==="w_decode"?1:0),0);
    ctx.fillStyle = "#8b98a9";
    ctx.fillText(t("q.running"), r.x + 8, y + 8);
    let dx = r.x + 66;
    const dotRun = (cnt, color) => { const maxDots = Math.floor((r.w - 110) / 7); const m = Math.min(cnt, maxDots); for (let i = 0; i < m; i++) this.dot(dx + i * 7, y + 5, 2.5, color); dx += m * 7 + 4; };
    dotRun(nP, "#f0883e"); dotRun(nCP, "#bc8cff"); dotRun(nD, COLORS.decoding);
    ctx.fillStyle = COLORS.decoding;
    ctx.fillText(w.running.length + "/" + P.maxRunning, r.x + r.w - 44, y + 8);
    this.kvGauge(r, w.kvUsed, w.maxTokens(P));
  }

  drawPrefill(sim, p, r, idx, now){
    const ctx = this.ctx, P = sim.P;
    this.instanceFrame(r, t("n.prefill") + " " + p.id + (p.draining ? " \u23f3" : ""));
    const tokCount = p.bootstrapQ.reduce((s, q) => s + (q.stamps.tokenized > now ? 1 : 0), 0);
    let y = r.y + 26;
    this.queueRow(r, y, "q.tok", tokCount, COLORS.tokenize); y += 15;
    this.queueRow(r, y, "q.bootstrap", p.bootstrapQ.length - tokCount, COLORS.Bootstrapping); y += 15;
    this.queueRow(r, y, "q.waiting", p.waitingQ.length, COLORS.WaitingForInput); y += 15;
    const bx = r.x + 66, bw = r.w - 74;
    const slots = p.slots.length ? p.slots : [null];
    for (const slot of slots){
      ctx.fillStyle = "#8b98a9";
      ctx.fillText(t("q.prefilling"), r.x + 8, y + 8);
      this.rr(bx, y, bw, 10, 3); ctx.fillStyle = "#0d1117"; ctx.fill();
      if (slot){
        const req = slot.req;
        const dur = chunkPrefillMs(P, req, Math.min(req.chunksComputed, req.chunksTotal - 1));
        const frac = clamp(1 - (slot.busyUntil - now) / Math.max(1, dur), 0, 1);
        const prog = clamp((req.chunksComputed + frac) / req.chunksTotal, 0, 1);
        this.rr(bx, y, bw * prog, 10, 3); ctx.fillStyle = "#f0883e"; ctx.fill();
        ctx.fillStyle = "#e6edf3"; ctx.font = "9px sans-serif";
        ctx.fillText(req.uncachedLen + " tok \u00b7 " + req.chunksComputed + "/" + req.chunksTotal, bx + 3, y + 8);
        ctx.font = "10px sans-serif";
      }
      y += 15;
    }
    this.queueRow(r, y, "q.inflight", p.inflight.length, COLORS.Transferring);
    this.kvGauge(r, p.kvUsed, p.maxTokens(P));
  }

  drawDecode(sim, d, r, idx, now){
    const ctx = this.ctx, P = sim.P;
    this.instanceFrame(r, t("n.decode") + " " + d.id + (d.draining ? " \u23f3" : ""));
    if (now - d.retractGlow < 500){
      const a = 1 - (now - d.retractGlow) / 500;
      this.rr(r.x, r.y, r.w, r.h, 8);
      ctx.strokeStyle = "rgba(248,81,73," + (0.2 + 0.6 * a).toFixed(2) + ")";
      ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
    }
    ctx.fillStyle = "#5a6675"; ctx.font = "8px sans-serif";
    const ntrTxt = "ntr " + d.ntr.toFixed(2);
    ctx.fillText(ntrTxt, r.x + r.w - 8 - ctx.measureText(ntrTxt).width, r.y + 27);
    ctx.font = "10px sans-serif";
    const tokCount = d.preallocQ.reduce((s, q) => s + (q.stamps.tokenized > now ? 1 : 0), 0);
    let y = r.y + 26;
    this.queueRow(r, y, "q.tok", tokCount, COLORS.tokenize); y += 15;
    this.queueRow(r, y, "q.prealloc", d.preallocQ.length - tokCount, COLORS.Bootstrapping); y += 15;
    this.queueRow(r, y, "q.transfer", d.transferQ.length, COLORS.Transferring); y += 15;
    const nRetract = d.waitingQ.reduce((s, q) => s + (q.retracted ? 1 : 0), 0);
    this.queueRow(r, y, "q.waiting", d.waitingQ.length - nRetract, COLORS.Success);
    if (nRetract > 0){ ctx.fillStyle = COLORS.retract; ctx.font = "9px sans-serif"; const rt = "\u27f2" + nRetract; ctx.fillText(rt, r.x + r.w - 8 - ctx.measureText(rt).width, y + 8); ctx.font = "10px sans-serif"; }
    y += 15;
    ctx.fillStyle = "#8b98a9";
    ctx.fillText(t("q.running"), r.x + 8, y + 8);
    const n = d.running.length;
    const maxDots = Math.floor((r.w - 110) / 7);
    for (let i = 0; i < Math.min(n, maxDots); i++) this.dot(r.x + 66 + i * 7, y + 5, 2.5, COLORS.decoding);
    ctx.fillStyle = COLORS.decoding;
    ctx.fillText(n + "/" + P.maxRunning, r.x + r.w - 44, y + 8);
    this.kvGauge(r, d.kvUsed, d.maxTokens(P));
  }

  instanceFrame(r, title){
    const ctx = this.ctx;
    this.rr(r.x, r.y, r.w, r.h, 8);
    ctx.fillStyle = "#1c2330"; ctx.fill();
    ctx.strokeStyle = "#2d3646"; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "#e6edf3"; ctx.font = "bold 11px sans-serif";
    ctx.fillText(title, r.x + 8, r.y + 15);
    ctx.fillStyle = "#5a6675"; ctx.font = "8px sans-serif";
    const sub = t("inst.pipeline");
    ctx.fillText(sub, r.x + r.w - 8 - ctx.measureText(sub).width, r.y + 15);
    ctx.font = "10px sans-serif";
  }
  pathPoint(pts, prog){
    let total = 0; const segs = [];
    for (let i = 1; i < pts.length; i++){ const l = Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y); segs.push(l); total += l; }
    let rem = clamp(prog, 0, 1) * total;
    for (let i = 0; i < segs.length; i++){
      if (rem <= segs[i] || i === segs.length - 1){
        const f = segs[i] > 0 ? rem / segs[i] : 1;
        return { x: pts[i].x + (pts[i+1].x - pts[i].x) * f, y: pts[i].y + (pts[i+1].y - pts[i].y) * f };
      }
      rem -= segs[i];
    }
    return pts[pts.length - 1];
  }
  queueRow(r, y, labelKey, count, color){
    const ctx = this.ctx;
    ctx.fillStyle = "#8b98a9";
    ctx.fillText(t(labelKey), r.x + 8, y + 8);
    const x0 = r.x + 66, maxDots = Math.floor((r.w - 110) / 8);
    for (let i = 0; i < Math.min(count, maxDots); i++) this.dot(x0 + i * 8, y + 5, 3, color);
    if (count > 0){ ctx.fillStyle = color; ctx.fillText(String(count), r.x + r.w - 26, y + 8); }
  }
  kvGauge(r, used, cap){
    const ctx = this.ctx;
    const y = r.y + r.h - 12, x = r.x + 8, w = r.w - 16;
    const ratio = clamp(used / Math.max(1, cap), 0, 1);
    this.rr(x, y, w, 6, 3); ctx.fillStyle = "#0d1117"; ctx.fill();
    if (ratio > 0){ this.rr(x, y, Math.max(2, w * ratio), 6, 3); ctx.fillStyle = kvGaugeColor(ratio); ctx.fill(); }
    ctx.fillStyle = "#8b98a9"; ctx.font = "9px sans-serif";
    ctx.fillText("KV " + (ratio * 100).toFixed(0) + "%", x + w - 42, y - 2);
    ctx.font = "10px sans-serif";
  }
  dot(x, y, rad, color){ const ctx = this.ctx; ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); }
  rr(x, y, w, h, rad){
    const ctx = this.ctx;
    rad = Math.min(rad, h / 2, w / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }
}

/* ===================== Sparklines & breakdown ======================== */
function drawSpark(cv, data, color){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 160, h = cv.clientHeight || 34;
  if (cv.width !== Math.round(w * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  let max = -Infinity, any = false;
  for (const v of data) if (!Number.isNaN(v)){ any = true; if (v > max) max = v; }
  if (!any) return;
  if (max <= 0) max = 1;
  const n = data.length, pad = 2;
  ctx.strokeStyle = color; ctx.lineWidth = 1.4;
  ctx.beginPath();
  let pen = false, lastX = 0, lastY = 0;
  for (let i = 0; i < n; i++){
    const v = data[i];
    if (Number.isNaN(v)){ pen = false; continue; }
    const x = n > 1 ? (i / (n - 1)) * (w - pad * 2) + pad : w / 2;
    const y = h - pad - (v / max) * (h - pad * 2);
    if (!pen){ ctx.moveTo(x, y); pen = true; } else ctx.lineTo(x, y);
    lastX = x; lastY = y;
  }
  ctx.stroke();
  ctx.beginPath(); ctx.arc(lastX, lastY, 2, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
}
function drawBreakdown(cv, bd){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 600, h = cv.clientHeight || 86;
  if (cv.width !== Math.round(w * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.font = "10px sans-serif";
  if (!bd){ ctx.fillStyle = "#8b98a9"; ctx.fillText("\u2026", 6, 20); return; }
  const total = bd.reduce((a, b) => a + Math.max(0, b), 0) || 1;
  let x = 0;
  const barY = 6, barH = 24;
  const isAgg = sim.P.mode === "agg";
  const BD_KEYS = isAgg ? ["tokenize","queue","prefill","detok"] : ["tokenize","bootstrap","pQueue","prefill","transfer","dQueue","detok"];
  const BD_COLORS = isAgg ? ["#39c5cf","#7d8590","#f0883e","#3fb950"] : COLORS.bd;
  for (let i = 0; i < BD_KEYS.length; i++){
    const seg = Math.max(0, bd[i]) / total * w;
    ctx.fillStyle = BD_COLORS[i];
    ctx.fillRect(x, barY, Math.max(seg, 0), barH);
    if (seg > 46){ ctx.fillStyle = "#04121f"; ctx.font = "bold 10px sans-serif"; ctx.fillText(fmtMs(bd[i]), x + 4, barY + 16); ctx.font = "10px sans-serif"; }
    x += seg;
  }
  let lx = 2, ly = barY + barH + 18;
  for (let i = 0; i < BD_KEYS.length; i++){
    const label = t("bd." + BD_KEYS[i]) + " " + fmtMs(bd[i]);
    const lw = 12 + ctx.measureText(label).width + 14;
    if (lx + lw > w){ lx = 2; ly += 16; }
    ctx.fillStyle = BD_COLORS[i]; ctx.fillRect(lx, ly - 8, 8, 8);
    ctx.fillStyle = "#8b98a9"; ctx.fillText(label, lx + 12, ly);
    lx += lw;
  }
  ctx.fillStyle = "#e6edf3"; ctx.font = "bold 11px sans-serif";
  ctx.fillText("TTFT \u2248 " + fmtMs(total), Math.max(2, w - 110), barY + 16);
}
function fmtMs(v){ if (v === undefined || v === null || Number.isNaN(v)) return "\u2014"; if (v >= 10000) return (v / 1000).toFixed(1) + " s"; if (v >= 100) return v.toFixed(0) + " ms"; return v.toFixed(1) + " ms"; }
function fmtPct(v){ return Number.isNaN(v) ? "\u2014" : (v * 100).toFixed(0) + "%"; }
function fmtNum(v){ return Number.isNaN(v) ? "\u2014" : (v >= 100 ? v.toFixed(0) : v.toFixed(1)); }

function seriesMean(k, lastN){
  const arr = sim.metrics.series[k] || [];
  const len = arr.length;
  let sum = 0, n = 0;
  for (let back = 1; back <= Math.min(lastN, len); back++){
    const v = arr[len - back];
    if (v != null && !Number.isNaN(v)){ sum += v; n++; }
  }
  return n ? sum / n : NaN;
}
function lastSeriesVal(k){
  const arr = sim.metrics.series[k] || [];
  for (let back = 1; back <= Math.min(5, arr.length); back++){
    const v = arr[arr.length - back];
    if (v != null && !Number.isNaN(v)) return v;
  }
  return NaN;
}

}

const METRIC_WINDOW_MS = 10000;
function updatePanels(){

  const isAgg = sim.P.mode === "agg";
  for (const def of METRIC_DEFS){
    const card = document.getElementById("mc_card_" + def.key);
    const hide = (def.disaggOnly && isAgg) || (def.aggOnly && !isAgg);
    if (card) card.style.display = hide ? "none" : "";
    const mv = document.getElementById("mv_" + def.key); if (mv) mv.textContent = def.val(snap, lastSeriesVal);
    const ms = document.getElementById("ms_" + def.key); if (ms) ms.textContent = def.sub(snap, lastSeriesVal);
    const mc = document.getElementById("mc_" + def.key);
    if (mc) drawSpark(mc, sim.metrics.latestSeries(def.series), def.color);
  }
  drawBreakdown(document.getElementById("bd"), snap ? sim.metrics.recentBreakdown() : null);
  updateKvInfo();
  document.getElementById("simClock").textContent = "t = " + (sim.now / 1000).toFixed(1) + " s";
}

/* --------------------------- sidebar -------------------------------- */
function buildSidebar(){
  const el = document.getElementById("sidebar");
  el.innerHTML = "";
  for (const g of GROUPS){
    const div = document.createElement("div");
    div.className = "pgroup";
    const h = document.createElement("h3");
    h.dataset.i18n = "g." + g;
    div.appendChild(h);
    for (const def of PARAM_DEFS.filter(d => d.group === g)) div.appendChild(buildRow(def));
    if (g === "kv"){
      const info = document.createElement("div");
      info.className = "pinfo"; info.id = "kvInfo";
      div.appendChild(info);
    }
    el.appendChild(div);
  }
}
function buildRow(def){
  const row = document.createElement("div");
  row.className = "prow"; row.id = "row_" + def.key;
  const lab = document.createElement("div");
  lab.className = "plabel";
  const nm = document.createElement("span");
  nm.className = "pname"; nm.dataset.i18n = "p." + def.key;
  lab.appendChild(nm);
  if (def.type !== "select"){
    const val = document.createElement("span");
    val.className = "pval"; val.id = "val_" + def.key;
    lab.appendChild(val);
  }
  row.appendChild(lab);
  if (def.type === "toggle"){
    const btn = document.createElement("button");
    btn.id = "in_" + def.key; btn.style.width = "100%";
    const paint = () => { btn.classList.toggle("active", !!P[def.key]); btn.textContent = t(P[def.key] ? "toggle.on" : "toggle.off"); };
    paint();
    btn.addEventListener("click", () => { P[def.key] = !P[def.key]; paint(); refreshInputs(); apiPost("/api/params", {params:{[def.key]:P[def.key]}}); });
    row.appendChild(btn);
  } else if (def.type === "select"){
    const sel = document.createElement("select");
    sel.id = "in_" + def.key;
    for (const opt of def.options){ const o = document.createElement("option"); o.value = opt; o.dataset.i18n = def.i18nPrefix + opt; sel.appendChild(o); }
    sel.value = P[def.key];
    sel.addEventListener("change", () => {
      P[def.key] = sel.value;
      if (def.key === "modelPreset") applyModelPreset(sel.value);
      if (def.key === "gpu") applyGpuPreset(sel.value);
      if (def.key === "mode") refreshInputs();
      apiPost("/api/params", {params:{[def.key]:P[def.key]}});
    });
    row.appendChild(sel);
  } else {
    const inp = document.createElement("input");
    inp.type = "range"; inp.id = "in_" + def.key;
    if (def.steps){ inp.min = 0; inp.max = def.steps.length - 1; inp.step = 1; inp.value = nearestStepIdx(def, P[def.key]); }
    else if (def.log){ inp.min = 0; inp.max = LOG_STEPS; inp.step = 1; inp.value = logValToSlider(def, P[def.key]); }
    else { inp.min = def.min; inp.max = def.max; inp.step = def.step; inp.value = P[def.key]; }
    inp.addEventListener("input", () => {
      P[def.key] = def.steps ? def.steps[parseInt(inp.value)] : def.log ? logSliderToVal(def, parseFloat(inp.value)) : parseFloat(inp.value);
      document.getElementById("val_" + def.key).textContent = def.fmt(P[def.key]);
      if (["layers","kvHeads","headDim","dtypeBytes"].includes(def.key)){ P.modelPreset = "custom"; syncSelect("modelPreset"); }
      if (["kvGbP","kvGbD"].includes(def.key)){ P.gpu = "custom"; syncSelect("gpu"); }
      apiPost("/api/params", {params:{[def.key]:P[def.key]}});
    });
    row.appendChild(inp);
  }
  return row;
}
function applyModelPreset(name){
  if (name !== "custom" && !MODEL_PRESETS[name]) name = DEFAULTS.modelPreset;
  P.modelPreset = name;
  const mp = {};
  if (name !== "custom"){
    const m = MODEL_PRESETS[name];
    P.layers = m.layers; P.kvHeads = m.kvHeads; P.headDim = m.headDim;
    P.dtypeBytes = m.dtypeBytes; P.mla = !!m.mla;
    P.hybrid = !!m.hybrid; P.fullLayers = m.fullLayers || m.layers;
    P.activeB = m.activeB; P.qHeads = m.qHeads || 32;
    P.swaWindow = m.hybrid ? (m.swaWindow || 0) : 0;
    if (m.mla){ P.kvLoraRank = m.kvLoraRank; P.qkRope = m.qkRope; }
    Object.assign(mp, {modelPreset:name, layers:P.layers, kvHeads:P.kvHeads, headDim:P.headDim, dtypeBytes:P.dtypeBytes, mla:P.mla, hybrid:P.hybrid, fullLayers:P.fullLayers, activeB:P.activeB, qHeads:P.qHeads, swaWindow:P.swaWindow, kvLoraRank:P.kvLoraRank, qkRope:P.qkRope});
  } else {
    P.mla = false; P.hybrid = false; P.swaWindow = 0;
    Object.assign(mp, {modelPreset:"custom", mla:false, hybrid:false, swaWindow:0});
  }
  refreshInputs();
  apiPost("/api/params", {params:mp});
}
function applyGpuPreset(name){
  if (name !== "custom"){
    const kv = gpuKvBudget(GPU_PRESETS[name].hbm);
    P.kvGbP = kv; P.kvGbD = kv;
    apiPost("/api/params", {params:{gpu:name, kvGbP:kv, kvGbD:kv}});
  }
  refreshInputs();
}
function syncSelect(key){ const sel = document.getElementById("in_" + key); if (sel) sel.value = P[key]; }
function refreshInputs(){
  const isAgg = P.mode === "agg";
  const disaggOnlyKeys = ["numP","numD","lbPolicyD","kvGbP","kvGbD","bandwidthGBs","transferOverheadMs"];
  const aggOnlyKeys = ["numWorkers","kvGb","chunkedPrefill"];
  for (const def of PARAM_DEFS){
    const inp = document.getElementById("in_" + def.key);
    if (!inp) continue;
    const row = document.getElementById("row_" + def.key);
    if (def.type === "toggle"){
      inp.classList.toggle("active", !!P[def.key]);
      inp.textContent = t(P[def.key] ? "toggle.on" : "toggle.off");
    } else {
      inp.value = def.steps ? nearestStepIdx(def, P[def.key]) : def.log ? logValToSlider(def, P[def.key]) : P[def.key];
      if (def.type !== "select"){
        const v = document.getElementById("val_" + def.key); if (v) v.textContent = def.fmt(P[def.key]);
      }
    }
    let display = "";
    if (def.customOnly && P.modelPreset !== "custom") display = "none";
    if (disaggOnlyKeys.includes(def.key) && isAgg) display = "none";
    if (aggOnlyKeys.includes(def.key) && !isAgg) display = "none";
    row.style.display = display;
  }
}
function updateKvInfo(){
  const cell = cellSizeOf(P);
  const fmtTok = v => v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : (v / 1e3).toFixed(0) + "k";
  const el = document.getElementById("kvInfo"); if (!el) return;
  if (P.mode === "agg"){
    const capW = Math.floor(P.kvGb * 2**30 / cell);
    el.innerHTML =
      t("info.cell") + ": <b>" + (cell / 1024).toFixed(1) + " KB</b>" + t("info.perTok") +
      (P.mla ? " (MLA)" : P.hybrid ? " (" + P.fullLayers + "/" + P.layers + " " + t("info.fullAttn") + ")" : "") + "<br>" +
      t("info.capW") + ": <b>" + fmtTok(capW) + "</b> " + t("info.tokens");
    return;
  }
  const capP = Math.floor(P.kvGbP * 2**30 / cell);
  const capD = Math.floor(P.kvGbD * 2**30 / cell);
  el.innerHTML =
    t("info.cell") + ": <b>" + (cell / 1024).toFixed(1) + " KB</b>" + t("info.perTok") +
    (P.mla ? " (MLA)" : P.hybrid ? " (" + P.fullLayers + "/" + P.layers + " " + t("info.fullAttn") + ")" : "") + "<br>" +
    t("info.capP") + ": <b>" + fmtTok(capP) + "</b> " + t("info.tokens") + " \u00b7 " +
    t("info.capD") + ": <b>" + fmtTok(capD) + "</b> " + t("info.tokens");
}

/* --------------------------- top bar -------------------------------- */
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".preset").forEach(b => { b.textContent = t("preset." + b.dataset.preset); });
  updatePauseLabel();
  document.getElementById("btnStep").textContent = t("ctl.step");
  document.getElementById("btnReset").textContent = t("ctl.reset");
  document.getElementById("btnLang").textContent = LANG === "zh" ? "EN" : "\u4e2d\u6587";
  document.documentElement.lang = LANG;
  refreshInputs();
}
function updatePauseLabel(){
  document.getElementById("btnPause").textContent = t(paused ? "ctl.resume" : "ctl.pause");
}
function wireTopbar(){
  document.getElementById("btnPause").addEventListener("click", () => {
    paused = !paused; updatePauseLabel();
    apiCommand(paused ? "pause" : "start");
  });
  document.getElementById("btnStep").addEventListener("click", () => {
    if (!paused){ paused = true; updatePauseLabel(); apiCommand("pause"); }
    apiCommand("step", 100);
  });
  document.getElementById("btnReset").addEventListener("click", () => {
    apiCommand("reset");
  });
  const speed = document.getElementById("speed");
  const setSpeed = () => {
    timeScale = Math.pow(2, parseFloat(speed.value));
    document.getElementById("speedVal").textContent =
      (timeScale >= 1 ? timeScale.toFixed(timeScale >= 8 ? 0 : 1) : timeScale.toFixed(2)) + "\u00d7";
    apiCommand("speed", timeScale);
  };
  speed.addEventListener("input", setSpeed); setSpeed();
  document.querySelectorAll(".preset").forEach(b => {
    b.addEventListener("click", () => {
      Object.assign(P, PRESETS[b.dataset.preset]);
      applyModelPreset(P.modelPreset);
      apiPost("/api/preset", {preset: b.dataset.preset});
      document.querySelectorAll(".preset").forEach(x => x.classList.toggle("active", x === b));
    });
  });
  document.getElementById("btnLang").addEventListener("click", () => {
    LANG = LANG === "zh" ? "en" : "zh";
    applyI18n(); updatePanels();
  });
  document.getElementById("sidebarToggle").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("collapsed");
  });
}

/* --------------------------- main loop ------------------------------ */
function frame(ts){
  // Extrapolate sim.now between fetches for smooth dot animation
  if (!paused && _lastFetchTs > 0){
    const dt = ts - _lastFetchTs;
    sim.now = _lastFetchNow + dt * timeScale;
  }
  renderer.resize(sim);
  renderer.draw(sim);
  requestAnimationFrame(frame);
}

async function fetchLoop(){
  for (;;){
    await Promise.all([fetchRender(), fetchState()]);
    updatePanels();
    await new Promise(r => setTimeout(r, 100));
  }
}

async function boot(){
  buildSidebar();
  buildMetricCards();
  wireTopbar();
  refreshInputs();
  applyI18n();
  // Fetch initial state from server
  await Promise.all([fetchState(), fetchRender()]);
  Object.assign(P, sim.P);
  refreshInputs();
  updateKvInfo();
  updatePanels();
  requestAnimationFrame(frame);
  fetchLoop();
  console.log("%cPD-Disagg Simulator (API mode)", "font-weight:bold");
  console.log("Connected to SimService at /api/*");
}

window.addEventListener("resize", () => {});
boot();
</script>
