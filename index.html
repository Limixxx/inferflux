<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InferFlux</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2d3646;
  --text:#e6edf3; --muted:#8b98a9; --accent:#4ea1ff; --cyan:#39c5cf;
  --radius:12px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font-family:-apple-system,"SF Pro","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.6;
}
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 32px; border-bottom:1px solid var(--border);
  background:var(--panel); position:sticky; top:0; z-index:10;
}
.site-title{font-size:16px; font-weight:700;}
.site-title small{color:var(--muted); font-weight:400; font-size:12px; margin-left:8px;}
#btnLang{
  background:var(--panel2); border:1px solid var(--border);
  border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; color:var(--text);
}
#btnLang:hover{border-color:var(--accent);}
.right-controls{display:flex; align-items:center; gap:12px;}
.gh-link{display:inline-flex; align-items:center; color:var(--muted); transition:color .18s;}
.gh-link:hover{color:var(--accent);}
.hero{max-width:680px; margin:60px auto 44px; padding:0 24px; text-align:center;}
.hero h1{font-size:28px; font-weight:700; line-height:1.3; margin-bottom:14px;}
.hero h1 span{color:var(--accent);}
.hero p{color:var(--muted); font-size:14px; max-width:520px; margin:0 auto;}
.grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px; max-width:1040px; margin:0 auto 60px; padding:0 24px;
}
.card{
  background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius); padding:24px; text-decoration:none;
  color:var(--text); display:flex; flex-direction:column; gap:10px;
  transition:border-color .18s, transform .18s, box-shadow .18s;
}
.card:hover{
  border-color:var(--accent); transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.card-icon{font-size:28px; line-height:1;}
.card-title{font-size:15px; font-weight:700;}
.card-sub{font-size:12px; color:var(--muted); line-height:1.55; flex:1;}
.card-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;}
.tag{
  font-size:11px; padding:2px 8px; border-radius:20px;
  background:var(--panel2); border:1px solid var(--border); color:var(--muted);
}
.tag.accent{border-color:var(--accent); color:var(--accent);}
.soon{opacity:.5; pointer-events:none;}
footer{
  text-align:center; padding:24px; border-top:1px solid var(--border);
  color:var(--muted); font-size:12px;
}
footer a{color:var(--accent); text-decoration:none;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<header>
  <div class="site-title" data-i18n="site.title"></div>
  <div class="right-controls">
    <a class="gh-link" href="https://github.com/Abatom/inferflux" target="_blank" rel="noopener" aria-label="GitHub">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg>
    </a>
    <button id="btnLang">EN</button>
  </div>
</header>

<section class="hero">
  <h1 data-i18n="hero.h1"></h1>
  <p data-i18n="hero.p"></p>
</section>

<main class="grid" id="grid"></main>

<footer>
  <span data-i18n="footer.text"></span>
  · <a href="https://github.com/Abatom/inferflux" target="_blank" rel="noopener">GitHub</a>
  · <a href="https://github.com/sgl-project/sglang" target="_blank" rel="noopener">SGLang</a>
  · <a href="https://github.com/vllm-project/vllm" target="_blank" rel="noopener">vLLM</a>
</footer>

<script>
/* Each animation is a self-contained page. Add a new entry here + its .html
   file, and it shows up on the homepage. `href:null` renders a disabled
   "coming soon" card. */
const CARDS = [
  {
    href: "pd-disagg.html", icon: "\u{1F500}",
    title: { zh: "PD 分离模拟器", en: "PD Disaggregation Simulator" },
    sub: {
      zh: "Prefill/Decode 分离推理的实时可视化：请求扇出、chunked prefill、KV 传输、握手门控与 TTFT/TPOT/吞吐指标。",
      en: "Real-time view of prefill/decode disaggregated serving: request fan-out, chunked prefill, KV transfer, handshake gating, and TTFT/TPOT/throughput metrics.",
    },
    tags: [
      { zh: "推理服务", en: "Inference" },
      { zh: "SGLang", en: "SGLang", accent: true },
    ],
  },
  {
    href: "calc-input.html", icon: "\u{1F4CA}",
    title: { zh: "输入吞吐计算器", en: "Input Throughput Calculator" },
    sub: {
      zh: "按模型、GPU 型号、TP/DP/EP 并行度、输入长度与缓存命中率推算输入吞吐、显存可行性，并可由实测数据反推 MFU。",
      en: "Compute prefill throughput and KV memory feasibility from model, GPU, TP/DP/EP, input length and cache hit rate. Back-solve observed MFU from measured data.",
    },
    tags: [
      { zh: "Roofline", en: "Roofline", accent: true },
      { zh: "MFU", en: "MFU" },
    ],
  },
  {
    href: "calc-output.html", icon: "\u{1F4C8}",
    title: { zh: "输出吞吐计算器", en: "Output Throughput Calculator" },
    sub: {
      zh: "按模型、GPU、TP/DP/EP 并行度、批大小与上下文长度推算 decode 输出吞吐与 TPOT，展示权重/KV 带宽瓶颈拐点，并可由实测 TPOT 反推 MBU。",
      en: "Compute decode output throughput and TPOT from model, GPU, TP/DP/EP, batch size and context length. Show the weight/KV bandwidth roofline knee, and back-solve MBU from measured TPOT.",
    },
    tags: [
      { zh: "TPOT", en: "TPOT", accent: true },
      { zh: "MBU", en: "MBU" },
    ],
  },
  {
    href: "transformer-3d.html", icon: "\u{1F9E0}",
    title: { zh: "请求生命周期 3D", en: "Request Lifecycle 3D" },
    sub: {
      zh: "按真实执行顺序展示一个请求的完整生命周期（对齐 SGLang eagle_worker）：上层楼 = Prefill（目标主模型对整个 prompt 跑一次完整前向 → 出首 token → draft-extend 填 draft KV 热身），下层楼 = Decode 循环（draft 起草候选 → 目标层一次并行验证 → 接受+bonus → 回到 draft）。两份完整目标层各自展开：Attention（MHA/GQA/MQA）+ MLP/MoE（top-k + shared expert）+ TP/EP/DP 三种并行全保留。投机可选 DFLASH（并行 masked block）/ MTP（内置头串行链）。对齐 SGLang 与 vLLM 真实源码（含 DFlash+DP 引擎差异标注）。可鼠标旋转缩放。",
      en: "The full request lifecycle in real execution order (faithful to SGLang's eagle_worker): upper floor = Prefill (the target model runs one full forward over the whole prompt → 1st token → draft-extend warms the draft KV); lower floor = the Decode loop (draft proposes candidates → the target layer verifies them in one parallel forward → accept+bonus → back to draft). Two full target layers, each fully expanded: attention (MHA/GQA/MQA) + MLP/MoE (top-k + shared expert) + TP/EP/DP parallelism. Speculation is DFLASH (parallel masked block) or MTP (built-in-head serial chain). Faithful to real SGLang & vLLM source (incl. the DFlash+DP engine-difference note). Drag to rotate, scroll to zoom.",
    },
    tags: [
      { zh: "投机 (DFlash/MTP)", en: "Spec (DFlash/MTP)" },
      { zh: "MoE / TP / EP / DP", en: "MoE / TP / EP / DP" },
      { zh: "3D", en: "3D", accent: true },
    ],
  },
  {
    href: "collective-3d.html", icon: "\u{1F310}",
    title: { zh: "GPU 集合通信 3D 动画", en: "GPU Collective Communication 3D" },
    sub: {
      zh: "多卡集合通信的 3D 分步演示：AllReduce（Ring 两阶段 ReduceScatter+AllGather）、AllGather、ReduceScatter、Broadcast、All-to-All。数据块按来源 GPU 着色，可切换 GPU 数（2/4/8）。可鼠标旋转缩放。",
      en: "Step-by-step 3D walkthrough of GPU collectives: AllReduce (Ring = ReduceScatter + AllGather), AllGather, ReduceScatter, Broadcast, All-to-All. Data chunks coloured by source GPU; switch GPU count (2/4/8). Drag to rotate, scroll to zoom.",
    },
    tags: [
      { zh: "分布式", en: "Distributed" },
      { zh: "NCCL", en: "NCCL" },
      { zh: "3D", en: "3D", accent: true },
    ],
  },
];

const I18N = {
  zh: {
    "site.title": "InferFlux",
    "hero.h1": "InferFlux — 推理系统<span>可视化</span>",
    "hero.p": "一组可交互的推理服务动画。每个动画独立成页，拖动参数即时看到系统行为变化。",
    "footer.text": "纯静态 · 无后端 · 打开即用",
    "card.open": "打开 →",
    "card.soon": "即将上线",
  },
  en: {
    "site.title": "InferFlux",
    "hero.h1": "InferFlux — inference <span>visualized</span>",
    "hero.p": "A collection of interactive animations for LLM inference systems. Each animation is its own page — drag the params and watch the system respond.",
    "footer.text": "Fully static · no backend · open and run",
    "card.open": "Open \u2192",
    "card.soon": "Coming soon",
  },
};

let LANG = (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
const t = k => (I18N[LANG][k] ?? k);

function renderCards(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const c of CARDS){
    const live = !!c.href;
    const el = document.createElement(live ? "a" : "div");
    el.className = "card" + (live ? "" : " soon");
    if (live) el.href = c.href;
    const tags = c.tags.map(tg =>
      `<span class="tag${tg.accent ? " accent" : ""}">${tg[LANG]}</span>`).join("");
    el.innerHTML =
      `<div class="card-icon">${c.icon}</div>` +
      `<div class="card-title">${c.title[LANG]}</div>` +
      `<div class="card-sub">${c.sub[LANG]}</div>` +
      `<div class="card-tags">${tags}` +
      `<span class="tag${live ? " accent" : ""}">${live ? t("card.open") : t("card.soon")}</span>` +
      `</div>`;
    grid.appendChild(el);
  }
}

function applyI18n(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.innerHTML = t(el.dataset.i18n);
  });
  document.getElementById("btnLang").textContent = LANG === "zh" ? "EN" : "中文";
  renderCards();
}

document.getElementById("btnLang").addEventListener("click", () => {
  LANG = LANG === "zh" ? "en" : "zh";
  applyI18n();
});

applyI18n();
</script>
</body>
</html>
